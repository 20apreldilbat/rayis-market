<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYIS BOZORI — Sevimlilar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; }
  body { background:#0b0f1a; color:#fff; min-height:100vh; padding-bottom:80px; }

  .header { background:#0f1626; border-bottom:1px solid rgba(255,255,255,0.06); padding:12px 16px; position:sticky; top:0; z-index:100; }
  .htop { display:flex; align-items:center; gap:10px; }
  .back { font-size:22px; cursor:pointer; color:#8b9ab8; }
  .title { font-size:16px; font-weight:800; flex:1; }
  .count-badge { background:rgba(255,59,107,0.15); border:1px solid rgba(255,59,107,0.3); padding:5px 12px; border-radius:20px; font-size:11px; color:#ff3b6b; font-weight:800; }
  .clear-btn { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:7px 12px; border-radius:10px; font-size:11px; font-weight:700; cursor:pointer; }

  .toolbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px 6px; }
  .sort-btn { padding:8px 14px; background:#131a2b; border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:#cbd5e1; font-size:12px; font-weight:700; cursor:pointer; }
  .sort-btn.active { border-color:#005bff; color:#60a5fa; }

  .products { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px; }
  .prod { background:#131a2b; border:1px solid rgba(255,255,255,0.06); border-radius:14px; overflow:hidden; cursor:pointer; transition:all 0.15s; position:relative; }
  .prod:active { transform:scale(0.98); }
  .prod-img { height:130px; background:linear-gradient(135deg,#1a2337,#0f1626); display:flex; align-items:center; justify-content:center; font-size:48px; position:relative; overflow:hidden; }
  .prod-img img { width:100%; height:100%; object-fit:cover; }
  .prod-img .heart { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.55); color:#ff3b6b; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
  .prod-info { padding:10px; }
  .prod-name { font-size:13px; font-weight:700; margin-bottom:5px; line-height:1.3; min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .prod-rating { display:flex; align-items:center; gap:4px; margin-bottom:6px; font-size:11px; }
  .prod-rating .stars { color:#fbbf24; letter-spacing:0.5px; }
  .prod-rating .num { color:#fbbf24; font-weight:800; }
  .prod-rating .cnt { color:#8b9ab8; }
  .prod-rating .none { color:#5b6b8a; }
  .prod-price-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .prod-price { font-size:14px; font-weight:900; color:#34d399; }
  .prod-old { font-size:11px; color:#5b6b8a; text-decoration:line-through; }
  .prod-add { width:100%; padding:9px; background:linear-gradient(135deg,#005bff,#0047cc); border:none; border-radius:10px; color:#fff; font-size:12px; font-weight:800; cursor:pointer; }
  .prod-add:active { transform:scale(0.97); }
  .prod-add.in-cart { background:linear-gradient(135deg,#10b981,#059669); }

  .empty { padding:70px 20px; text-align:center; color:#5b6b8a; }
  .empty .ic { font-size:70px; margin-bottom:14px; opacity:0.5; }
  .empty h3 { font-size:17px; color:#cbd5e1; margin-bottom:8px; font-weight:800; }
  .empty p { font-size:13px; line-height:1.6; margin-bottom:20px; }
  .empty button { background:linear-gradient(135deg,#005bff,#0047cc); color:#fff; border:none; padding:14px 28px; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; }

  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:#005bff; color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:9999; transition:transform 0.3s; max-width:90%; text-align:center; box-shadow:0 10px 30px rgba(0,91,255,0.4); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.ok { background:#10b981; }
  .toast.err { background:#ef4444; }

  .nav { position:fixed; bottom:0; left:0; right:0; background:#0f1626; border-top:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-around; padding:10px 0 max(10px,env(safe-area-inset-bottom)); z-index:200; }
  .nav-i { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#5b6b8a; cursor:pointer; flex:1; padding:4px; position:relative; }
  .nav-i.active { color:#60a5fa; }
  .nav-i .ic { font-size:20px; }
  .nav-i .nc { position:absolute; top:0; right:25%; background:#ff3b30; color:#fff; font-size:9px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
</style>
</head>
<body>

<div class="header">
  <div class="htop">
    <div class="back" onclick="location.href='profile.html'">←</div>
    <div class="title">❤️ Sevimlilar</div>
    <div class="count-badge" id="countBadge">0 ta</div>
    <button class="clear-btn" id="clearBtn" onclick="clearAll()" style="display:none">🗑 Tozalash</button>
  </div>
</div>

<div class="toolbar">
  <div style="font-size:12px;color:#8b9ab8;font-weight:600" id="toolbarInfo">Barcha saqlangan mahsulotlar</div>
  <button class="sort-btn" id="sortBtn" onclick="toggleSort()">💰 Arzon → Qimmat</button>
</div>

<div id="list"></div>

<div class="nav">
  <div class="nav-i" onclick="location.href='home.html'"><div class="ic">🏠</div><div>Bosh</div></div>
  <div class="nav-i" onclick="location.href='search.html'"><div class="ic">🔍</div><div>Qidiruv</div></div>
  <div class="nav-i" onclick="location.href='cart.html'">
    <div class="ic">🛒</div><div>Savat</div>
    <div class="nc" id="navCartCnt" style="display:none">0</div>
  </div>
  <div class="nav-i" onclick="location.href='orders.html'"><div class="ic">📦</div><div>Buyurtma</div></div>
  <div class="nav-i active" onclick="location.href='profile.html'"><div class="ic">👤</div><div>Profil</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// STATE
// ============================================
let sortAsc = true;

// ============================================
// YORDAMCHI
// ============================================
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function fmt(p) { return (Number(p)||0).toLocaleString('uz-UZ').replace(/,/g,' ') + " so'm"; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============================================
// SEVIMLILAR
// ============================================
function getFavs() {
  let all = [];
  try { all = JSON.parse(localStorage.getItem('rayis_favs') || '[]'); } catch(e) {}
  return Array.isArray(all) ? all : [];
}
function saveFavs(favs) {
  try { localStorage.setItem('rayis_favs', JSON.stringify(favs)); } catch(e) {}
}
function getProducts() {
  let all = [];
  try { all = JSON.parse(localStorage.getItem('rayis_products') || '[]'); } catch(e) {}
  return Array.isArray(all) ? all : [];
}

// ============================================
// REYTING
// ============================================
function getRatingInfo(productId) {
  let reviews = [];
  try { reviews = JSON.parse(localStorage.getItem('rayis_reviews') || '[]'); } catch(e) {}
  if (!Array.isArray(reviews)) return { avg: 0, count: 0 };
  const filtered = reviews.filter(r => r && String(r.productId) === String(productId));
  if (filtered.length === 0) return { avg: 0, count: 0 };
  const sum = filtered.reduce((s, r) => s + (Number(r.rating) || 0), 0);
  return { avg: Math.round((sum / filtered.length) * 10) / 10, count: filtered.length };
}
function ratingHtml(productId) {
  const r = getRatingInfo(productId);
  if (r.count === 0) return '<div class="prod-rating"><span class="none">☆☆☆☆☆ Sharh yo\'q</span></div>';
  const stars = '⭐'.repeat(Math.round(r.avg)) + '☆'.repeat(5 - Math.round(r.avg));
  return '<div class="prod-rating">' +
    '<span class="stars">' + stars + '</span>' +
    '<span class="num">' + r.avg.toFixed(1) + '</span>' +
    '<span class="cnt">(' + r.count + ')</span>' +
  '</div>';
}

// ============================================
// SAVAT
// ============================================
function isInCart(id) {
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('rayis_cart') || '[]'); } catch(e) {}
  if (!Array.isArray(cart)) cart = [];
  return cart.some(i => String(i.id) === String(id));
}
function addToCart(id) {
  const all = getProducts();
  const p = all.find(x => String(x.id) === String(id));
  if (!p) return toast('Topilmadi', 'err');

  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('rayis_cart') || '[]'); } catch(e) {}
  if (!Array.isArray(cart)) cart = [];

  const ex = cart.find(i => String(i.id) === String(id));
  if (ex) {
    ex.qty = (Number(ex.qty) || 1) + 1;
  } else {
    cart.push({
      id: p.id, name: p.name, price: p.price,
      unit: p.unit || 'dona', emoji: p.emoji || '📦',
      images: p.images || [], category: p.category, qty: 1
    });
  }
  try { localStorage.setItem('rayis_cart', JSON.stringify(cart)); } catch(e) {
    return toast('Xotira to\'ldi', 'err');
  }
  updateCartBadge();
  toast('✅ Savatga qo\'shildi', 'ok');
  render();
}

// ============================================
// SEVIMLIDAN O'CHIRISH
// ============================================
function removeFav(id, el) {
  if (el) el.style.pointerEvents = 'none';
  let favs = getFavs();
  favs = favs.filter(x => String(x) !== String(id));
  saveFavs(favs);
  toast('💔 Sevimlilardan olindi', 'ok');
  setTimeout(() => render(), 200);
}

function clearAll() {
  if (!confirm('Barcha sevimlilarni o‘chirishni tasdiqlaysizmi?')) return;
  saveFavs([]);
  toast('🗑 Hammasi o‘chirildi', 'ok');
  render();
}

// ============================================
// SORT
// ============================================
function toggleSort() {
  sortAsc = !sortAsc;
  const btn = document.getElementById('sortBtn');
  btn.textContent = sortAsc ? '💰 Arzon → Qimmat' : '💰 Qimmat → Arzon';
  btn.classList.toggle('active', !sortAsc);
  render();
}

// ============================================
// RENDER
// ============================================
function render() {
  const list = document.getElementById('list');
  const favs = getFavs();
  const allProducts = getProducts();

  // Faqat mavjud mahsulotlar
  let items = allProducts.filter(p => p && p.name && favs.indexOf(p.id) !== -1);

  // Saralash
  items.sort((a, b) => sortAsc ? a.price - b.price : b.price - a.price);

  // UI yangilash
  document.getElementById('countBadge').textContent = items.length + ' ta';
  document.getElementById('toolbarInfo').textContent = items.length > 0 ? 'Saralash:' : '';
  document.getElementById('sortBtn').style.display = items.length > 0 ? 'block' : 'none';
  document.getElementById('clearBtn').style.display = items.length > 0 ? 'block' : 'none';

  if (items.length === 0) {
    list.innerHTML = '<div class="empty"><div class="ic">💔</div><h3>Sevimlilar yo‘q</h3><p>Mahsulotlarni yurakcha bilan belgilang<br>va ular shu yerda saqlanadi</p><button onclick="location.href=\'search.html\'">🔍 Mahsulot qidirish</button></div>';
    updateCartBadge();
    return;
  }

  let html = '<div class="products">';
  items.forEach(p => {
    const img = (p.images && p.images[0]) ? '<img src="' + p.images[0] + '">' : (p.emoji || '📦');
    const oldPrice = (p.oldPrice && p.oldPrice > p.price) ? '<span class="prod-old">' + fmt(p.oldPrice) + '</span>' : '';
    const inCart = isInCart(p.id);
    const btnClass = inCart ? 'prod-add in-cart' : 'prod-add';
    const btnText = inCart ? '✅ Savatda' : '🛒 Savatga';

    html += '<div class="prod">' +
      '<div class="prod-img" onclick="location.href=\'product.html?id=' + p.id + '\'">' + img +
        '<div class="heart" onclick="event.stopPropagation();removeFav(' + p.id + ', this)">❤️</div>' +
      '</div>' +
      '<div class="prod-info">' +
        '<div class="prod-name">' + esc(p.name) + '</div>' +
        ratingHtml(p.id) +
        '<div class="prod-price-row"><span class="prod-price">' + fmt(p.price) + '</span>' + oldPrice + '</div>' +
        '<button class="' + btnClass + '" onclick="event.stopPropagation();addToCart(' + p.id + ')">' + btnText + '</button>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  list.innerHTML = html;

  updateCartBadge();
}

// ============================================
// BADGE
// ============================================
function updateCartBadge() {
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('rayis_cart') || '[]'); } catch(e) {}
  if (!Array.isArray(cart)) cart = [];
  const cnt = Math.round(cart.reduce((s, i) => s + (Number(i.qty) || 0), 0));
  const el = document.getElementById('navCartCnt');
  if (cnt > 0) {
    el.textContent = cnt > 99 ? '99+' : cnt;
    el.style.display = 'flex';
  } else {
    el.style.display = 'none';
  }
}

// ============================================
// BOSHLASH
// ============================================
render();
</script>
</body>
</html>
