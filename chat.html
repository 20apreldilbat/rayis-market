<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYIS BOZORI — Chat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
  body { background:#0b0f1a; color:#fff; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* HEADER */
  .header { background:#0f1626; border-bottom:1px solid rgba(255,255,255,0.06); padding:12px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0; z-index:10; }
  .back { font-size:22px; cursor:pointer; color:#8b9ab8; }
  .header-info { flex:1; min-width:0; }
  .header-title { font-size:15px; font-weight:800; }
  .header-sub { font-size:11px; color:#8b9ab8; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .avatar-h { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#005bff,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }

  /* MAIN */
  .main { flex:1; overflow:hidden; display:flex; flex-direction:column; position:relative; }

  /* CHAT LIST */
  .chat-list { flex:1; overflow-y:auto; padding:16px; padding-bottom:90px; }
  .chat-item { background:#131a2b; border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:12px; margin-bottom:10px; cursor:pointer; display:flex; gap:12px; align-items:center; transition:all 0.15s; }
  .chat-item:active { transform:scale(0.98); background:rgba(0,91,255,0.05); }
  .chat-item.unread { border-color:rgba(0,91,255,0.4); background:rgba(0,91,255,0.04); }
  .chat-avatar { width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg,#005bff,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .chat-info { flex:1; min-width:0; }
  .chat-name { font-size:14px; font-weight:700; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-prod { font-size:11px; color:#60a5fa; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-last { font-size:12px; color:#8b9ab8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-meta { text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .chat-time { font-size:10px; color:#5b6b8a; }
  .chat-badge { background:#ff3b30; color:#fff; font-size:10px; font-weight:800; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px; }

  /* ROOM */
  .room { display:none; flex-direction:column; height:100%; }
  .room.show { display:flex; }
  .chat-list.hide { display:none; }

  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.45; word-break:break-word; }
  .msg.me { background:linear-gradient(135deg,#005bff,#0047cc); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg.other { background:#131a2b; color:#cbd5e1; align-self:flex-start; border-bottom-left-radius:4px; border:1px solid rgba(255,255,255,0.06); }
  .msg-img { max-width:200px; border-radius:12px; margin-top:6px; display:block; }
  .msg-time { font-size:9px; opacity:0.55; margin-top:4px; text-align:right; }

  /* INPUT */
  .input-area { background:#0f1626; border-top:1px solid rgba(255,255,255,0.08); padding:10px 12px; display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
  .input-area textarea { flex:1; padding:11px 14px; background:#0b0f1a; border:1px solid rgba(255,255,255,0.08); border-radius:20px; color:#fff; font-size:14px; outline:none; font-family:inherit; resize:none; max-height:100px; min-height:42px; }
  .input-area textarea:focus { border-color:#005bff; }
  .input-area textarea::placeholder { color:#4b5876; }
  .att-btn { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#8b9ab8; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .send-btn { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#005bff,#0047cc); border:none; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .send-btn:active { transform:scale(0.94); }
  .send-btn:disabled { opacity:0.4; }

  /* IMG PREVIEW */
  .img-prev-wrap { padding:8px 12px; background:#0f1626; border-top:1px solid rgba(255,255,255,0.06); display:none; gap:8px; }
  .img-prev-wrap.show { display:flex; }
  .ip-item { position:relative; width:60px; height:60px; border-radius:10px; overflow:hidden; background:#0b0f1a; }
  .ip-item img { width:100%; height:100%; object-fit:cover; }
  .ip-item .rm { position:absolute; top:2px; right:2px; background:rgba(239,68,68,0.9); color:#fff; width:18px; height:18px; border-radius:50%; font-size:10px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  /* EMPTY */
  .empty { padding:60px 20px; text-align:center; color:#5b6b8a; }
  .empty .ic { font-size:64px; margin-bottom:14px; opacity:0.5; }
  .empty h3 { font-size:16px; color:#cbd5e1; margin-bottom:8px; font-weight:700; }
  .empty p { font-size:13px; line-height:1.6; }

  /* TOAST */
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:#005bff; color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:9999; transition:transform 0.3s; max-width:90%; text-align:center; box-shadow:0 10px 30px rgba(0,91,255,0.4); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.err { background:#ef4444; }
  .toast.ok { background:#10b981; }

  /* NAV */
  .nav { position:fixed; bottom:0; left:0; right:0; background:#0f1626; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-around; padding:10px 0 max(10px,env(safe-area-inset-bottom)); z-index:200; }
  .nav.hide { display:none; }
  .nav-i { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#4b5876; cursor:pointer; flex:1; padding:4px; position:relative; }
  .nav-i.active { color:#60a5fa; }
  .nav-i .ic { font-size:20px; }
  .nav-i .nc { position:absolute; top:0; right:25%; background:#ff3b30; color:#fff; font-size:9px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="back" id="backBtn">←</div>
  <div class="avatar-h" id="headerAvatar" style="display:none">💬</div>
  <div class="header-info">
    <div class="header-title" id="headerTitle">Chatlar</div>
    <div class="header-sub" id="headerSub"></div>
  </div>
</div>

<div class="main">
  <div class="chat-list" id="listView"></div>
  <div class="room" id="roomView">
    <div class="messages" id="messages"></div>
    <div class="img-prev-wrap" id="imgPrevWrap"></div>
    <div class="input-area">
      <label for="fileImg" class="att-btn">📎</label>
      <input type="file" id="fileImg" accept="image/*" style="display:none" onchange="pickImage(event)">
      <textarea id="msgInput" placeholder="Xabar yozing..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>➤</button>
    </div>
  </div>
</div>

<div class="nav" id="nav">
  <div class="nav-i" onclick="location.href='home.html'"><div class="ic">🏠</div><div>Bosh</div></div>
  <div class="nav-i" onclick="location.href='search.html'"><div class="ic">🔍</div><div>Qidiruv</div></div>
  <div class="nav-i" onclick="location.href='cart.html'"><div class="ic">🛒</div><div>Savat</div></div>
  <div class="nav-i active"><div class="ic">💬</div><div>Chat</div><div class="nc" id="navChatCnt" style="display:none">0</div></div>
  <div class="nav-i" onclick="location.href='profile.html'"><div class="ic">👤</div><div>Profil</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// MEN
// ============================================
const user = JSON.parse(localStorage.getItem('rayis_user') || '{}');
const myRole = user.role || 'xaridor';
const myId = user.userId || (myRole === 'xaridor' ? (localStorage.getItem('rayis_buyer_id') || 'buyer_me') : ('user_' + myRole));
const myName = user.firstName ? (user.firstName + ' ' + (user.lastName || '')).trim() : (user.name || 'Foydalanuvchi');
const myIcon = user.icon || (myRole === 'xaridor' ? '🛒' : '👤');

// ============================================
// URL PARAMS
// ============================================
const params = new URLSearchParams(location.search);
const openId = params.get('id');
const newWith = params.get('new');
const newName = params.get('nname');
const newProduct = params.get('p');
const newProductName = params.get('pn');
const newProductImg = params.get('pi');

let activeChatId = openId || null;
let pendingImages = [];
let pollTimer = null;

// ============================================
// TOAST
// ============================================
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ============================================
// STORAGE
// ============================================
function getChats() {
  let all = [];
  try { all = JSON.parse(localStorage.getItem('rayis_chats') || '[]'); } catch(e) {}
  return Array.isArray(all) ? all : [];
}
function saveChats(chats) {
  try { localStorage.setItem('rayis_chats', JSON.stringify(chats)); } catch(e) {
    toast('Xotira to\'ldi', 'err');
  }
}
function getMyChats() {
  return getChats().filter(c => c.buyerId === myId || c.sellerId === myId);
}
function getUnread(chat) {
  return (chat.messages || []).filter(m => m.senderId !== myId && !m.read).length;
}
function getTotalUnread() {
  return getMyChats().reduce((s, c) => s + getUnread(c), 0);
}

// ============================================
// YORDAMCHI
// ============================================
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatTime(iso) {
  try {
    const d = new Date(iso);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const isToday = d.toDateString() === now.toDateString();
    if (isToday) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  } catch(e) { return '—'; }
}
function otherPerson(chat) {
  const isBuyer = chat.buyerId === myId;
  return {
    id: isBuyer ? chat.sellerId : chat.buyerId,
    name: isBuyer ? chat.sellerName : chat.buyerName,
    icon: isBuyer ? '🏪' : '🛒'
  };
}

// ============================================
// IMG COMPRESS
// ============================================
function compressImage(file, maxW, q) {
  maxW = maxW || 800; q = q || 0.75;
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > maxW) { h = (maxW/w)*h; w = maxW; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', q));
        } catch(err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function pickImage(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  if (pendingImages.length + files.length > 3) { toast('Maksimal 3 ta rasm', 'err'); event.target.value = ''; return; }
  for (const f of files) {
    if (f.size > 5*1024*1024) { toast('Rasm juda katta', 'err'); continue; }
    try { pendingImages.push(await compressImage(f)); } catch(e) {}
  }
  renderPreview();
  event.target.value = '';
  checkSendBtn();
}

function renderPreview() {
  const w = document.getElementById('imgPrevWrap');
  if (pendingImages.length === 0) { w.classList.remove('show'); w.innerHTML = ''; return; }
  w.classList.add('show');
  let html = '';
  pendingImages.forEach((src, i) => {
    html += '<div class="ip-item"><img src="' + src + '"><button class="rm" onclick="rmImage(' + i + ')">✕</button></div>';
  });
  w.innerHTML = html;
}
function rmImage(i) {
  pendingImages.splice(i, 1);
  renderPreview();
  checkSendBtn();
}

// ============================================
// RENDER LIST
// ============================================
function renderList() {
  const list = document.getElementById('listView');
  const chats = getMyChats();

  if (chats.length === 0) {
    list.innerHTML = '<div class="empty"><div class="ic">💬</div><h3>Chatlar yo\'q</h3><p>Mahsulot yoki xizmat sahifasidan<br>"💬 Bog\'lanish" tugmasini bosing</p></div>';
    return;
  }

  chats.sort((a,b) => (b.lastUpdate || '').localeCompare(a.lastUpdate || ''));

  let html = '';
  chats.forEach(c => {
    const other = otherPerson(c);
    const unread = getUnread(c);
    const last = (c.messages && c.messages.length) ? c.messages[c.messages.length - 1] : null;
    const lastText = last ? (last.senderId === myId ? 'Siz: ' : '') + (last.text || '📷 Rasm') : 'Xabar yo\'q';

    html += '<div class="chat-item ' + (unread > 0 ? 'unread' : '') + '" onclick="openChat(\'' + c.id + '\')">' +
      '<div class="chat-avatar">' + other.icon + '</div>' +
      '<div class="chat-info">' +
        '<div class="chat-name">' + esc(other.name || 'Foydalanuvchi') + '</div>' +
        (c.productName ? '<div class="chat-prod">📦 ' + esc(c.productName) + '</div>' : '') +
        '<div class="chat-last">' + esc(lastText) + '</div>' +
      '</div>' +
      '<div class="chat-meta">' +
        (last ? '<div class="chat-time">' + formatTime(last.createdAt) + '</div>' : '') +
        (unread > 0 ? '<div class="chat-badge">' + unread + '</div>' : '') +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;
}

// ============================================
// OPEN CHAT ROOM
// ============================================
function openChat(id) {
  activeChatId = id;
  document.getElementById('listView').classList.add('hide');
  document.getElementById('roomView').classList.add('show');
  document.getElementById('nav').classList.add('hide');
  markRead(id);
  renderRoom();
  startPoll();
}

function closeChat() {
  activeChatId = null;
  document.getElementById('roomView').classList.remove('show');
  document.getElementById('listView').classList.remove('hide');
  document.getElementById('nav').classList.remove('hide');
  document.getElementById('headerAvatar').style.display = 'none';
  document.getElementById('headerTitle').textContent = 'Chatlar';
  document.getElementById('headerSub').textContent = '';
  renderList();
  updateNavBadge();
  stopPoll();
}

function renderRoom() {
  const chats = getChats();
  const chat = chats.find(c => c.id === activeChatId);
  if (!chat) { closeChat(); return; }

  const other = otherPerson(chat);

  document.getElementById('headerAvatar').style.display = 'flex';
  document.getElementById('headerAvatar').textContent = other.icon;
  document.getElementById('headerTitle').textContent = other.name || 'Foydalanuvchi';
  document.getElementById('headerSub').textContent = chat.productName ? '📦 ' + chat.productName : 'Chat';

  const msgC = document.getElementById('messages');
  const msgs = chat.messages || [];

  if (msgs.length === 0) {
    msgC.innerHTML = '<div class="empty" style="padding:30px 20px"><div class="ic">💬</div><p>Xabar yozib boshlang</p></div>';
    return;
  }

  let html = '';
  msgs.forEach(m => {
    const cls = m.senderId === myId ? 'me' : 'other';
    let inner = '';
    if (m.text) inner += '<div>' + esc(m.text) + '</div>';
    if (m.image) inner += '<img class="msg-img" src="' + m.image + '">';
    inner += '<div class="msg-time">' + formatTime(m.createdAt) + '</div>';
    html += '<div class="msg ' + cls + '">' + inner + '</div>';
  });
  msgC.innerHTML = html;

  // Scroll to bottom
  setTimeout(() => { msgC.scrollTop = msgC.scrollHeight; }, 30);
}

// ============================================
// SEND MESSAGE
// ============================================
function checkSendBtn() {
  const inp = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  btn.disabled = (inp.value.trim() === '' && pendingImages.length === 0);
}

function sendMessage() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text && pendingImages.length === 0) return;

  const chats = getChats();
  const idx = chats.findIndex(c => c.id === activeChatId);
  if (idx === -1) return;

  const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

  if (pendingImages.length > 0) {
    // Har bir rasmga alohida xabar
    pendingImages.forEach((img, i) => {
      chats[idx].messages.push({
        id: msgId + '_' + i,
        senderId: myId,
        senderName: myName,
        text: i === 0 ? text : '',  // matn faqat birinchi rasmga
        image: img,
        createdAt: new Date().toISOString(),
        read: false
      });
    });
  } else {
    chats[idx].messages.push({
      id: msgId,
      senderId: myId,
      senderName: myName,
      text: text,
      image: null,
      createdAt: new Date().toISOString(),
      read: false
    });
  }

  chats[idx].lastUpdate = new Date().toISOString();
  saveChats(chats);

  inp.value = '';
  pendingImages = [];
  renderPreview();
  checkSendBtn();
  renderRoom();
  resizeInput();
}

// ============================================
// MARK READ
// ============================================
function markRead(chatId) {
  const chats = getChats();
  const idx = chats.findIndex(c => c.id === chatId);
  if (idx === -1) return;
  let changed = false;
  chats[idx].messages.forEach(m => {
    if (m.senderId !== myId && !m.read) { m.read = true; changed = true; }
  });
  if (changed) saveChats(chats);
}

// ============================================
// NAV BADGE
// ============================================
function updateNavBadge() {
  const cnt = getTotalUnread();
  const el = document.getElementById('navChatCnt');
  if (cnt > 0) { el.textContent = cnt > 99 ? '99+' : cnt; el.style.display = 'flex'; }
  else { el.style.display = 'none'; }
}

// ============================================
// POLL (real-time yangilanish)
// ============================================
function startPoll() {
  stopPoll();
  pollTimer = setInterval(() => {
    if (!activeChatId) return;
    const chats = getChats();
    const chat = chats.find(c => c.id === activeChatId);
    if (!chat) return;
    markRead(activeChatId);
    renderRoom();
  }, 3000);
}
function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ============================================
// NEW CHAT (from URL)
// ============================================
function handleNewChat() {
  if (!newWith) return;

  const chats = getChats();

  // Mavjud chat bormi?
  let found = null;
  if (myRole === 'xaridor') {
    found = chats.find(c => c.buyerId === myId && c.sellerId === newWith && String(c.productId) === String(newProduct));
  } else {
    found = chats.find(c => c.sellerId === myId && c.buyerId === newWith && String(c.productId) === String(newProduct));
  }

  if (found) {
    // Mavjudni ochish
    setTimeout(() => openChat(found.id), 100);
    return;
  }

  // Yangi chat yaratish
  const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const newChat = {
    id: chatId,
    buyerId: myRole === 'xaridor' ? myId : newWith,
    buyerName: myRole === 'xaridor' ? myName : newName,
    sellerId: myRole === 'xaridor' ? newWith : myId,
    sellerName: myRole === 'xaridor' ? newName : myName,
    productId: newProduct ? Number(newProduct) : null,
    productName: newProductName || null,
    productImage: newProductImg || null,
    messages: [],
    lastUpdate: new Date().toISOString(),
    createdAt: new Date().toISOString()
  };
  chats.push(newChat);
  saveChats(chats);

  setTimeout(() => openChat(chatId), 100);
}

// ============================================
// INPUT EVENTS
// ============================================
document.getElementById('msgInput').addEventListener('input', () => {
  checkSendBtn();
  resizeInput();
});
document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('sendBtn').addEventListener('click', sendMessage);

function resizeInput() {
  const inp = document.getElementById('msgInput');
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
}

// ============================================
// BACK BUTTON
// ============================================
document.getElementById('backBtn').addEventListener('click', () => {
  if (activeChatId) closeChat();
  else if (history.length > 1) history.back();
  else location.href = 'home.html';
});

// ============================================
// BOSHLASH
// ============================================
if (newWith) {
  handleNewChat();
} else if (openId) {
  setTimeout(() => openChat(openId), 100);
} else {
  renderList();
  updateNavBadge();
}
</script>
</body>
</html>
