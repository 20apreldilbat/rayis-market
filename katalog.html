<style>
:root{
  --bg:#F5F7FA;--sf:#FFFFFF;--sf2:#F1F5F9;--bd:#E2E8F0;
  --tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --pr:#22C55E;--pr2:#16A34A;--prD:#15803D;
  --or:#F59E0B;--er:#EF4444;--ac:#3B82F6;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-t="dark"]{
  --bg:#0B1119;--sf:#151C26;--sf2:#1E2733;--bd:#2A3441;
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;
  --sh:0 1px 3px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.4;
  min-height:100vh;padding-bottom:calc(78px + var(--safe-b));
  overscroll-behavior-y:none;
  -webkit-overflow-scrolling:touch;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input{font-family:inherit;font-size:16px}
.app{max-width:640px;margin:0 auto}

.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--sf);border-bottom:1px solid var(--bd);
  padding:calc(8px + var(--safe-t)) 8px 8px;
  display:flex;align-items:center;gap:8px;
}
.back{
  width:42px;height:42px;flex-shrink:0;
  border-radius:12px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:var(--tx);
  border:1px solid var(--bd);
  transition:.15s;
}
.back:active{transform:scale(.9);background:var(--bd)}
.hdr-title{flex:1;min-width:0}
.hdr-title b{font-size:16px;font-weight:800;display:block}
.hdr-title span{font-size:11px;color:var(--tx2)}
.hdr-act{
  width:42px;height:42px;flex-shrink:0;
  border-radius:12px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;border:1px solid var(--bd);
  position:relative;
}
.hdr-act:active{transform:scale(.9)}
.hdr-act .badge{
  position:absolute;top:-3px;right:-3px;
  min-width:18px;height:18px;padding:0 5px;
  background:var(--er);color:#fff;font-size:10px;font-weight:800;
  border-radius:100px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sf);
}

.search-row{
  display:flex;gap:8px;padding:8px 12px;
  background:var(--sf);border-bottom:1px solid var(--bd);
  position:sticky;top:calc(58px + var(--safe-t));z-index:45;
}
.search{
  flex:1;display:flex;align-items:center;gap:6px;
  background:var(--sf2);border:1.5px solid var(--bd);
  border-radius:11px;padding:0 12px;height:42px;
}
.search input{
  flex:1;background:none;border:none;outline:none;
  color:var(--tx);font-size:14px;font-weight:500;
  min-width:0;padding:10px 0;
}
.search .si{font-size:16px;color:var(--tx3);flex-shrink:0}
.search .clr{font-size:14px;color:var(--tx3);padding:4px;display:none}
.search.has .clr{display:block}
.filter-btn{
  height:42px;padding:0 14px;border-radius:11px;
  background:var(--sf2);border:1.5px solid var(--bd);
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:700;color:var(--tx);
  flex-shrink:0;position:relative;
}
.filter-btn:active{transform:scale(.95)}
.filter-btn .fdot{
  position:absolute;top:-4px;right:-4px;
  width:10px;height:10px;border-radius:50%;
  background:var(--er);display:none;
}
.filter-btn.has .fdot{display:block}

.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:10px 12px;scrollbar-width:none;
  background:var(--sf);border-bottom:1px solid var(--bd);
  position:sticky;top:calc(108px + var(--safe-t));z-index:40;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:100px;
  background:var(--sf2);border:1.5px solid var(--bd);
  font-size:12.5px;font-weight:600;white-space:nowrap;
  color:var(--tx);
}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.chip:active{transform:scale(.95)}

.result-info{
  padding:10px 12px;font-size:12px;color:var(--tx2);
  display:flex;justify-content:space-between;align-items:center;
}
.result-info b{color:var(--tx)}

.grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;padding:0 12px;
}
.prod{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
  transition:.15s;
}
.prod:active{transform:scale(.98)}
.prod-img{
  aspect-ratio:1;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:52px;position:relative;
}
.prod-disc{
  position:absolute;top:8px;left:8px;
  background:var(--er);color:#fff;
  font-size:10.5px;font-weight:900;
  padding:3px 7px;border-radius:6px;
}
.prod-fav{
  position:absolute;top:8px;right:8px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.95);color:var(--tx);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;backdrop-filter:blur(4px);
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.prod-fav.on{color:var(--er)}
.prod-body{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column}
.prod-price{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.prod-new{font-size:15px;font-weight:900;color:var(--tx)}
.prod-old{font-size:11px;color:var(--tx3);text-decoration:line-through}
.prod-name{
  font-size:12px;color:var(--tx);line-height:1.3;
  margin:5px 0;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  min-height:32px;
}
.prod-rate{
  display:flex;align-items:center;gap:3px;
  font-size:10.5px;color:var(--tx2);margin-bottom:6px;
}
.prod-rate .star{color:var(--or)}
.prod-add{
  width:100%;padding:9px;border-radius:9px;
  background:var(--pr);color:#fff;
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-height:38px;
}
.prod-add:active{transform:scale(.96)}
.prod-add.on{background:var(--sf2);color:var(--pr);border:1.5px solid var(--pr)}

.empty{
  text-align:center;padding:60px 20px;
  grid-column:1/-1;
}
.empty .ic{font-size:64px;margin-bottom:12px}
.empty b{font-size:16px;font-weight:800;display:block;margin-bottom:6px}
.empty span{font-size:12.5px;color:var(--tx2)}

.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--sf);border-top:1px solid var(--bd);
  display:flex;
  padding:6px 0 calc(6px + var(--safe-b));
  max-width:640px;margin:0 auto;
}
.nv{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:6px 4px;
  color:var(--tx3);font-size:10px;font-weight:600;
  position:relative;min-height:52px;
}
.nv-ic{font-size:20px;line-height:1}
.nv.on{color:var(--pr)}
.nv .badge{
  position:absolute;top:2px;right:calc(50% - 18px);
  min-width:16px;height:16px;padding:0 4px;
  background:var(--er);color:#fff;font-size:9.5px;font-weight:800;
  border-radius:100px;display:flex;align-items:center;justify-content:center;
}

.dr{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;
  animation:fdIn .15s ease-out;
}
.dr.on{display:flex}
@keyframes fdIn{from{opacity:0}to{opacity:1}}
.dr-box{
  background:var(--sf);width:100%;max-width:640px;
  max-height:90vh;overflow-y:auto;
  border-radius:22px 22px 0 0;
  padding:16px;
  padding-bottom:calc(16px + var(--safe-b));
  animation:up .25s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dr-h{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;position:sticky;top:-16px;
  background:var(--sf);padding:8px 0;z-index:1;
}
.dr-h h3{font-size:18px;font-weight:900}
.dr-x{
  width:38px;height:38px;border-radius:50%;
  background:var(--sf2);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--bd);
}
.dr-x:active{transform:scale(.9)}

.fgroup{margin-bottom:18px}
.fgroup-t{
  font-size:12px;font-weight:800;color:var(--pr);
  margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;
}
.fopts{display:flex;flex-wrap:wrap;gap:8px}
.fopt{
  padding:9px 14px;border-radius:100px;
  background:var(--sf2);border:1.5px solid var(--bd);
  font-size:12.5px;font-weight:600;color:var(--tx);
}
.fopt.on{background:var(--pr);border-color:var(--pr);color:#fff}
.fopt:active{transform:scale(.95)}

.range-box{display:flex;align-items:center;gap:10px}
.range-box input{
  flex:1;padding:11px 12px;border-radius:10px;
  background:var(--sf2);border:1.5px solid var(--bd);
  color:var(--tx);font-weight:700;outline:none;
  font-size:14px;min-width:0;
}
.range-box input:focus{border-color:var(--pr)}
.range-box span{color:var(--tx2);font-weight:800}

.btn-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:18px;position:sticky;bottom:0;
  background:var(--sf);padding:12px 0 0;
}
.btn{
  padding:14px;border-radius:12px;
  font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;
}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--pr);color:#fff}
.btn-g{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}

.ci{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ci-img{
  width:64px;height:64px;border-radius:10px;
  background:var(--sf2);display:flex;align-items:center;justify-content:center;
  font-size:30px;flex-shrink:0;
}
.ci-inf{flex:1;min-width:0}
.ci-n{font-size:12.5px;font-weight:700;line-height:1.3;margin-bottom:4px}
.ci-p{font-size:14px;font-weight:900;color:var(--pr);margin-bottom:6px}
.ci-q{display:flex;align-items:center;gap:8px}
.qb{
  width:30px;height:30px;border-radius:8px;
  background:var(--sf2);border:1px solid var(--bd);
  font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.qb:active{transform:scale(.9)}
.qv{font-size:14px;font-weight:800;min-width:24px;text-align:center}

.total{background:var(--sf2);border-radius:12px;padding:14px;margin-top:14px}
.total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.total-row.big{font-size:16px;font-weight:900;color:var(--pr);margin-top:8px;padding-top:8px;border-top:2px solid var(--bd)}

.tst{
  position:fixed;bottom:calc(90px + var(--safe-b));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--tx);color:var(--bg);
  padding:11px 20px;border-radius:100px;
  font-size:13px;font-weight:700;z-index:300;
  opacity:0;transition:.3s;pointer-events:none;
  max-width:90%;text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.o{background:var(--pr);color:#fff}
.tst.e{background:var(--er);color:#fff}

@media(max-width:360px){
  .grid{grid-template-columns:1fr 1fr;gap:8px;padding:0 8px}
  .prod-new{font-size:14px}
  .prod-add{font-size:11px;padding:8px 6px}
  .chips{padding:8px}
  .hdr{padding-left:6px;padding-right:6px}
}
</style>

var ST={
  cat:'all',
  search:'',
  sort:'popular',
  priceMin:0,
  priceMax:0,
  fav:{},
  cart:{},
  loc:'Qumqo\'rg\'on tumani'
};

var SORTS=[
  {id:'popular',   n:'🔥 Ommabop'},
  {id:'price_asc', n:'💵 Arzon → Qimmat'},
  {id:'price_desc',n:'💰 Qimmat → Arzon'},
  {id:'rating',    n:'⭐ Reyting'},
  {id:'discount',  n:'🎁 Chegirma'}
];

function loadLocal(){
  try{
    var c=localStorage.getItem('rayis_cart_'+UID);
    if(c)ST.cart=JSON.parse(c);
    var f=localStorage.getItem('rayis_fav_'+UID);
    if(f)ST.fav=JSON.parse(f);
    var l=localStorage.getItem('rayis_loc');
    if(l)ST.loc=l;
  }catch(e){}
}
function saveCart(){localStorage.setItem('rayis_cart_'+UID,JSON.stringify(ST.cart));updateBadges();}
function saveFav(){localStorage.setItem('rayis_fav_'+UID,JSON.stringify(ST.fav));}

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':' o');},2000);}

function getParam(k){return new URLSearchParams(window.location.search).get(k);}
function setParams(){
  var p=new URLSearchParams();
  if(ST.cat!=='all')p.set('cat',ST.cat);
  if(ST.search)p.set('q',ST.search);
  if(ST.sort!=='popular')p.set('sort',ST.sort);
  if(ST.priceMin>0)p.set('min',ST.priceMin);
  if(ST.priceMax>0)p.set('max',ST.priceMax);
  var url=p.toString()?'?'+p.toString():'';
  history.replaceState({cat:ST.cat,search:ST.search,sort:ST.sort},'','katalog.html'+url);
}
function readParams(){
  var c=getParam('cat');
  if(c)ST.cat=c;
  var q=getParam('q');
  if(q){ST.search=q;document.getElementById('searchInput').value=q;}
  var s=getParam('sort');
  if(s)ST.sort=s;
  var mn=getParam('min');
  if(mn)ST.priceMin=parseInt(mn)||0;
  var mx=getParam('max');
  if(mx)ST.priceMax=parseInt(mx)||0;
}

function renderChips(){
  var h='';
  CATS.forEach(function(c){
    h+='<button class="chip '+(ST.cat===c.id?'on':'')+'" onclick="setCat(\''+c.id+'\')">'+c.ic+' '+esc(c.n)+'</button>';
  });
  document.getElementById('chips').innerHTML=h;
}

function getFiltered(){
  var list=PRODUCTS.filter(function(p){
    if(ST.cat!=='all'&&p.cat!==ST.cat)return false;
    if(ST.search){
      var q=ST.search.toLowerCase();
      var hit=p.n.toLowerCase().indexOf(q)>=0||p.seller.toLowerCase().indexOf(q)>=0;
      if(!hit)return false;
    }
    if(ST.priceMin>0&&p.price<ST.priceMin)return false;
    if(ST.priceMax>0&&p.price>ST.priceMax)return false;
    return true;
  });
  list.sort(function(a,b){
    if(ST.sort==='price_asc')return a.price-b.price;
    if(ST.sort==='price_desc')return b.price-a.price;
    if(ST.sort==='rating')return b.rate-a.rate;
    if(ST.sort==='discount'){
      var da=a.old>a.price?(1-a.price/a.old):0;
      var db=b.old>b.price?(1-b.price/b.old):0;
      return db-da;
    }
    return (b.rate*b.reviews)-(a.rate*a.reviews);
  });
  return list;
}

function renderProducts(){
  var list=getFiltered();
  var g=document.getElementById('grid');

  var catName=CATS.find(function(c){return c.id===ST.cat;});
  document.getElementById('pageTitle').textContent=ST.search?'Qidiruv':(catName?catName.ic+' '+catName.n:'Katalog');
  document.getElementById('pageSub').textContent=ST.search?'"'+ST.search+'" uchun':(catName?catName.n:'Barcha mahsulotlar');
  document.getElementById('resInfo').innerHTML='<b>'+list.length+'</b> ta mahsulot';

  var sortObj=SORTS.find(function(s){return s.id===ST.sort;});
  document.getElementById('sortInfo').textContent=(sortObj?sortObj.n:'Saralash')+' ⚙';

  var fb=document.getElementById('filterBtn');
  if(ST.priceMin>0||ST.priceMax>0)fb.classList.add('has');
  else fb.classList.remove('has');

  if(!list.length){
    g.innerHTML='<div class="empty"><div class="ic">🔍</div><b>Topilmadi</b><span>Filtrlarni o\'zgartiring yoki boshqa so\'z bilan qidiring</span><button class="btn btn-p" style="margin-top:16px;padding:12px 24px" onclick="resetFilters()">Filtrlarni tozalash</button></div>';
    return;
  }

  var h='';
  list.forEach(function(p){
    var disc=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
    var inCart=ST.cart[p.id];
    var inFav=ST.fav[p.id];
    h+='<div class="prod" onclick="openProduct(\''+p.id+'\')">';
    h+='<div class="prod-img">';
    if(disc>0)h+='<div class="prod-disc">-'+disc+'%</div>';
    h+='<button class="prod-fav '+(inFav?'on':'')+'" onclick="toggleFav(\''+p.id+'\',event)">'+(inFav?'❤️':'🤍')+'</button>';
    h+=p.e;
    h+='</div>';
    h+='<div class="prod-body">';
    h+='<div class="prod-price"><span class="prod-new">'+fmt(p.price)+'</span>';
    if(p.old>p.price)h+='<span class="prod-old">'+fmt(p.old)+'</span>';
    h+='</div>';
    h+='<div class="prod-name">'+esc(p.n)+'</div>';
    h+='<div class="prod-rate"><span class="star">★</span> '+p.rate+' · '+p.reviews+'</div>';
    h+='<button class="prod-add '+(inCart?'on':'')+'" onclick="addCart(\''+p.id+'\',event)">'+(inCart?'✓ '+inCart+' ta':'🛒 Savatga')+'</button>';
    h+='</div>';
    h+='</div>';
  });
  g.innerHTML=h;
}

function setCat(id){
  ST.cat=id;
  setParams();
  renderChips();
  renderProducts();
  window.scrollTo({top:0,behavior:'smooth'});
}
function onSearch(v){
  ST.search=v.trim();
  var box=document.getElementById('searchBox');
  if(ST.search)box.classList.add('has');else box.classList.remove('has');
  setParams();
  renderProducts();
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  ST.search='';
  document.getElementById('searchBox').classList.remove('has');
  setParams();
  renderProducts();
}
function resetFilters(){
  ST.priceMin=0;ST.priceMax=0;ST.search='';ST.cat='all';
  document.getElementById('searchInput').value='';
  document.getElementById('searchBox').classList.remove('has');
  setParams();
  renderChips();
  renderProducts();
}
function toggleFav(pid,ev){
  if(ev)ev.stopPropagation();
  if(ST.fav[pid])delete ST.fav[pid];
  else ST.fav[pid]=true;
  saveFav();
  renderProducts();
}
function addCart(pid,ev){
  if(ev)ev.stopPropagation();
  var p=PRODUCTS.find(function(x){return x.id===pid;});
  if(!p)return;
  if(ST.cart[pid])ST.cart[pid]++;
  else ST.cart[pid]=1;
  saveCart();
  renderProducts();
  toast('🛒 Savatga qo\'shildi','o');
}
function openProduct(pid){window.location.href='mahsulot.html?id='+pid;}

function updateBadges(){
  var total=0;
  Object.keys(ST.cart).forEach(function(k){total+=ST.cart[k];});
  ['cartBadge','navBadge'].forEach(function(id){
    var e=document.getElementById(id);
    if(!e)return;
    if(total>0){e.style.display='flex';e.textContent=total;}
    else e.style.display='none';
  });
}

function closeDr(){document.getElementById('dr').classList.remove('on');}

function openFilter(){
  var h='<div class="dr-h"><h3>⚙️ Filtr</h3><button class="dr-x" onclick="closeDr()">✕</button></div>';
  h+='<div class="fgroup"><div class="fgroup-t">Kategoriya</div><div class="fopts">';
  CATS.forEach(function(c){
    h+='<button class="fopt '+(ST.cat===c.id?'on':'')+'" onclick="setFilterCat(\''+c.id+'\')">'+c.ic+' '+esc(c.n)+'</button>';
  });
  h+='</div></div>';
  h+='<div class="fgroup"><div class="fgroup-t">Narx oralig\'i (so\'m)</div><div class="range-box">';
  h+='<input type="number" id="fMin" value="'+(ST.priceMin||'')+'" placeholder="0" inputmode="numeric">';
  h+='<span>—</span>';
  h+='<input type="number" id="fMax" value="'+(ST.priceMax||'')+'" placeholder="10 000 000" inputmode="numeric">';
  h+='</div></div>';
  h+='<div class="btn-row">';
  h+='<button class="btn btn-g" onclick="resetFilters();closeDr()">Tozalash</button>';
  h+='<button class="btn btn-p" onclick="applyFilter()">Qo\'llash</button>';
  h+='</div>';
  document.getElementById('drBox').innerHTML=h;
  document.getElementById('dr').classList.add('on');
}
function setFilterCat(id){ST.cat=id;setParams();renderChips();}
function applyFilter(){
  ST.priceMin=parseInt(document.getElementById('fMin').value)||0;
  ST.priceMax=parseInt(document.getElementById('fMax').value)||0;
  setParams();
  renderProducts();
  closeDr();
  toast('✅ Filtr qo\'llandi','o');
}

function openSort(){
  var h='<div class="dr-h"><h3>⚙️ Saralash</h3><button class="dr-x" onclick="closeDr()">✕</button></div>';
  SORTS.forEach(function(s){
    var on=ST.sort===s.id;
    h+='<button class="fopt '+(on?'on':'')+'" style="width:100%;justify-content:flex-start;padding:14px 16px;font-size:13.5px;margin-bottom:6px;display:flex" onclick="pickSort(\''+s.id+'\')">'+(on?'✓ ':'')+s.n+'</button>';
  });
  document.getElementById('drBox').innerHTML=h;
  document.getElementById('dr').classList.add('on');
}
function pickSort(id){
  ST.sort=id;
  setParams();
  renderProducts();
  closeDr();
}

function openCart(){
  var ids=Object.keys(ST.cart);
  var h='<div class="dr-h"><h3>🛒 Savat</h3><button class="dr-x" onclick="closeDr()">✕</button></div>';
  if(!ids.length){
    h+='<div style="text-align:center;padding:50px 20px"><div style="font-size:60px;margin-bottom:12px">🛒</div><div style="font-weight:800;font-size:16px">Savat bo\'sh</div></div>';
  } else {
    var subtotal=0;
    ids.forEach(function(pid){
      var p=PRODUCTS.find(function(x){return x.id===pid;});
      if(!p)return;
      var q=ST.cart[pid];
      var sum=p.price*q;
      subtotal+=sum;
      h+='<div class="ci">';
      h+='<div class="ci-img">'+p.e+'</div>';
      h+='<div class="ci-inf">';
      h+='<div class="ci-n">'+esc(p.n)+'</div>';
      h+='<div class="ci-p">'+fmt(sum)+'</div>';
      h+='<div class="ci-q">';
      h+='<button class="qb" onclick="decCart(\''+pid+'\')">−</button>';
      h+='<span class="qv">'+q+'</span>';
      h+='<button class="qb" onclick="incCart(\''+pid+'\')">+</button>';
      h+='<button class="qb" style="margin-left:auto;color:var(--er)" onclick="rmCart(\''+pid+'\')">🗑</button>';
      h+='</div></div></div>';
    });
    var delivery=subtotal>2000000?0:50000;
    h+='<div class="total">';
    h+='<div class="total-row"><span>Mahsulotlar ('+ids.length+')</span><span>'+fmt(subtotal)+'</span></div>';
    h+='<div class="total-row"><span>Yetkazib berish</span><span>'+(delivery?fmt(delivery):'Bepul')+'</span></div>';
    h+='<div class="total-row big"><span>JAMI</span><span>'+fmt(subtotal+delivery)+'</span></div>';
    h+='</div>';
    h+='<button class="btn btn-p" style="width:100%;margin-top:14px" onclick="goToCart()">✅ Savatga o\'tish</button>';
  }
  document.getElementById('drBox').innerHTML=h;
  document.getElementById('dr').classList.add('on');
}
function incCart(pid){
  if(ST.cart[pid])ST.cart[pid]++;else ST.cart[pid]=1;
  saveCart();openCart();renderProducts();
}
function decCart(pid){
  if(!ST.cart[pid])return;
  ST.cart[pid]--;
  if(ST.cart[pid]<=0)delete ST.cart[pid];
  saveCart();openCart();renderProducts();
}
function rmCart(pid){
  delete ST.cart[pid];
  saveCart();openCart();renderProducts();
}
function goToCart(){window.location.href='savat.html';}

function goBack(){
  if(document.getElementById('dr').classList.contains('on')){closeDr();return;}
  if(ST.cat!=='all'||ST.search||ST.sort!=='popular'||ST.priceMin||ST.priceMax){
    resetFilters();return;
  }
  window.location.href='index.html';
}
function goHome(){window.location.href='index.html';}
function goCalc(){window.location.href='qurilish.html';}
function goProfile(){window.location.href='profil.html';}

window.addEventListener('popstate',function(){
  if(document.getElementById('dr').classList.contains('on')){
    closeDr();
    history.pushState({},'',window.location.href);
    return;
  }
  if(ST.cat!=='all'||ST.search||ST.sort!=='popular'||ST.priceMin||ST.priceMax){
    resetFilters();
    history.pushState({},'',window.location.href);
    return;
  }
});

(function init(){
  loadLocal();
  readParams();
  renderChips();
  renderProducts();
  updateBadges();
  history.pushState({cat:ST.cat},'','');
  console.log('✅ RAYIS Katalog — ishga tushdi');
})();
