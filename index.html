<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYIS BOZORI — Kirish</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; }
  body {
    background:linear-gradient(135deg,#0a1929 0%,#1a3a2e 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#fff;
  }
  .box {
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:24px;
    padding:32px 24px;
    max-width:420px;
    width:100%;
  }
  h1 {
    font-size:26px;
    font-weight:800;
    background:linear-gradient(135deg,#10b981,#34d399);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-align:center;
    letter-spacing:2px;
  }
  .sub {
    font-size:12px;
    color:#94a3b8;
    text-align:center;
    margin-top:4px;
    margin-bottom:28px;
  }
  h2 { font-size:20px; margin-bottom:8px; }
  .hint { font-size:14px; color:#94a3b8; margin-bottom:20px; line-height:1.5; }
  .btn {
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    transition:all 0.2s;
  }
  .btn:active { transform:scale(0.97); }
  .btn-primary { background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; }
  .btn-green { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }
  .btn-gray { background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); }
  .divider {
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin:20px 0;
    position:relative;
  }
  .divider::before, .divider::after {
    content:"";
    position:absolute;
    top:50%;
    width:40%;
    height:1px;
    background:rgba(255,255,255,0.1);
  }
  .divider::before { left:0; }
  .divider::after { right:0; }
  .step { display:none; }
  .step.active { display:block; }
  .input-group { margin-bottom:14px; }
  .input-group label {
    display:block;
    font-size:12px;
    color:#94a3b8;
    margin-bottom:6px;
    font-weight:600;
  }
  .input-group input, .input-group select {
    width:100%;
    padding:14px 16px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    color:#fff;
    font-size:15px;
    outline:none;
    font-family:inherit;
  }
  .input-group input:focus, .input-group select:focus { border-color:#10b981; }
  .input-group input::placeholder { color:#64748b; }
  .input-group select option { background:#0a1929; }
  .code-input {
    text-align:center;
    font-size:22px !important;
    letter-spacing:6px;
    font-weight:700;
  }
  .error {
    color:#ef4444;
    font-size:13px;
    margin-top:10px;
    text-align:center;
    min-height:18px;
  }
  .info {
    background:rgba(59,130,246,0.1);
    border:1px solid rgba(59,130,246,0.3);
    border-radius:12px;
    padding:12px;
    font-size:12px;
    color:#93c5fd;
    margin-bottom:16px;
    line-height:1.5;
  }
  .demo-info {
    background:rgba(251,191,36,0.08);
    border:1px solid rgba(251,191,36,0.25);
    border-radius:12px;
    padding:12px;
    font-size:12px;
    color:#fcd34d;
    margin-top:16px;
    line-height:1.5;
    text-align:center;
  }
  .demo-info b { color:#fbbf24; font-size:13px; }
</style>
</head>
<body>
<div class="box">
  <h1>RAYIS BOZORI</h1>
  <p class="sub">O‘zbekistonning universal bozori</p>

  <!-- QADAM 1: Xaridor yoki Xodim -->
  <div class="step active" id="s1">
    <h2>Xush kelibsiz!</h2>
    <p class="hint">Qanday kirmoqchisiz?</p>
    <button class="btn btn-primary" onclick="goBuyer()">🛒 Xaridor sifatida kirish</button>
    <div class="divider">yoki</div>
    <button class="btn btn-gray" onclick="show('s2')">🔑 Xodim sifatida kirish</button>
  </div>

  <!-- QADAM 2: Xodim kodi -->
  <div class="step" id="s2">
    <h2>Xodim kirishi</h2>
    <p class="hint">Maxsus kodni kiriting</p>
    <div class="input-group">
      <input type="password" id="code" class="code-input" placeholder="• • • •" maxlength="20" inputmode="numeric">
    </div>
    <button class="btn btn-green" onclick="verifyCode()">Kirish</button>
    <button class="btn btn-gray" onclick="show('s1')">← Orqaga</button>
    <div class="error" id="err1"></div>
    <div class="demo-info">
      🧪 Demo kodlar: <b>1004</b> (Sotuvchi), <b>1006</b> (Usta), <b>1001</b> (Admin)
    </div>
  </div>
</div>

<script>
// ============================================
// KIRISH KODLARI
// ============================================
const CODES = {
  "63638793141822": { role:"xojayin",     name:"Xo‘jayin",           icon:"👑", panel:"admin.html" },
  "1001":           { role:"admin",       name:"Admin",              icon:"⚙️", panel:"admin.html" },
  "1002":           { role:"nazoratchi",  name:"Nazoratchi",         icon:"👁", panel:"admin.html" },
  "1003":           { role:"omborchi",    name:"Omborchi",           icon:"📦", panel:"warehouse.html" },
  "1004":           { role:"sotuvchi",    name:"Sotuvchi",           icon:"🏪", panel:"seller.html" },
  "1005":           { role:"yetkazuvchi", name:"Yetkazib beruvchi",  icon:"🚚", panel:"delivery.html" },
  "1006":           { role:"usta",        name:"Usta",               icon:"👷", panel:"master.html" },
  "1007":           { role:"kuryer",      name:"Kuryer",             icon:"🏍", panel:"delivery.html" },
  "1008":           { role:"moliya",      name:"Moliya",             icon:"💰", panel:"admin.html" },
  "1009":           { role:"callmarkaz",  name:"Call-markaz",        icon:"📞", panel:"admin.html" },
  "1010":           { role:"xizmat",      name:"Xizmat ko‘rsatuvchi",icon:"🔧", panel:"xizmatko‘rsatuvchi.html" },
  "1011":           { role:"ijarachi",    name:"Ijarachi",           icon:"🔑", panel:"ijarachi.html" }
};

// ============================================
// QADAM ALMASHTIRISH
// ============================================
function show(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('err1').textContent = '';
}

// ============================================
// XARIDOR → OTP SAHIFASIGA
// ============================================
function goBuyer() {
  location.href = 'otp.html';
}

// ============================================
// XODIM KODI
// ============================================
function verifyCode() {
  const code = document.getElementById('code').value.trim();
  const err = document.getElementById('err1');
  err.textContent = '';

  if (!code) {
    err.textContent = 'Kodni kiriting';
    return;
  }

  const data = CODES[code];
  if (!data) {
    err.textContent = '❌ Kod noto‘g‘ri';
    document.getElementById('code').value = '';
    return;
  }

  // localStorage ga saqlash
  const userData = {
    userId: 'user_' + data.role,
    role: data.role,
    name: data.name,
    icon: data.icon,
    createdAt: new Date().toISOString()
  };

  try {
    localStorage.setItem('rayis_user', JSON.stringify(userData));
  } catch(e) {}

  // Panelga yo‘naltirish
  location.href = data.panel;
}

// Enter bosilganda
document.getElementById('code').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') verifyCode();
});

// Faqat raqam
document.getElementById('code').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '');
});
</script>
</body>
</html>
