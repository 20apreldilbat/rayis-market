function yetkazishNarxi(ogirlik, summa){
  if(ogirlik <= 100){
    if(summa <= 1000000) return 10;
    if(summa <= 2000000) return 8;
    if(summa <= 3000000) return 6;
    if(summa <= 4000000) return 4;
    if(summa <= 5000000) return 2;
    return 0;
  }
  var daraja = Math.ceil(ogirlik / 100);
  var foiz = 10 + (daraja - 1) * 2;
  return Math.min(foiz, 30);
}
function hisoblashYetkazish(ogirlik, summa){
  var foiz = yetkazishNarxi(ogirlik, summa);
  return Math.round((summa * foiz) / 100);
}

function compressImage(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function imageUploaderHTML(id, max){
  return '<div class="img-up" id="' + id + '_wrap">' +
    '<input type="file" id="' + id + '_input" accept="image/*" multiple style="display:none" onchange="handleImgSelect(event, \'' + id + '\', ' + max + ')">' +
    '<button type="button" class="img-add" onclick="document.getElementById(\'' + id + '_input\').click()">📷 Rasm tanlash</button>' +
    '<div class="img-grid" id="' + id + '_grid"></div>' +
    '<div class="img-hint" id="' + id + '_hint">0 / ' + max + '</div></div>';
}
function handleImgSelect(event, id, max){
  var files = Array.prototype.slice.call(event.target.files || []);
  if(!files.length) return;
  if(!_imgBuffers[id]) _imgBuffers[id] = [];
  var canAdd = max - _imgBuffers[id].length;
  if(canAdd <= 0){ toast("Maksimum " + max + " ta rasm", true); return; }
  files = files.slice(0, canAdd);
  var idx = 0;
  function next(){
    if(idx >= files.length){
      renderImgPreview(id, max); event.target.value = ""; return;
    }
    var f = files[idx]; idx++;
    if(!f.type.startsWith("image/")){ toast("Faqat rasm", true); next(); return; }
    if(f.size > 10 * 1024 * 1024){ toast("Rasm katta (10MB dan oshmasin)", true); next(); return; }
    compressImage(f, 600, 0.6).then(function(b64){
      _imgBuffers[id].push(b64); next();
    }).catch(function(){ toast("Rasm yuklanmadi", true); next(); });
  }
  next();
}
function renderImgPreview(id, max){
  var grid = document.getElementById(id + "_grid");
  var hint = document.getElementById(id + "_hint");
  if(!grid) return;
  var arr = _imgBuffers[id] || [];
  var h = "";
  arr.forEach(function(b64, i){
    h += '<div class="img-thumb"><img src="' + b64 + '"><button type="button" class="img-del" onclick="removeImg(\'' + id + '\',' + i + ',' + max + ')">✕</button></div>';
  });
  grid.innerHTML = h;
  if(hint) hint.textContent = arr.length + " / " + max;
}
function removeImg(id, i, max){
  if(!_imgBuffers[id]) return;
  _imgBuffers[id].splice(i, 1);
  renderImgPreview(id, max);
}

function getAvgRating(targetType, targetId){
  var rs = getReviews(targetType, targetId);
  if(!rs.length) return {avg: 0, count: 0};
  var sum = 0;
  rs.forEach(function(r){ sum += Number(r.rating) || 0; });
  return {avg: (sum/rs.length).toFixed(1), count: rs.length};
}
function renderStars(n){
  var h = "";
  for(var i=1;i<=5;i++) h += (i <= n ? "★" : "☆");
  return h;
}
function reviewCard(r){
  var uid = S.user ? (S.user.code || "g_" + (S.user.loginAt||0)) : "anon";
  var liked = r.likedBy && r.likedBy.indexOf(uid) !== -1;
  var disliked = r.dislikedBy && r.dislikedBy.indexOf(uid) !== -1;
  var h = '<div class="review-card">';
  h += '<div class="review-head"><div class="review-name">' + SEC.esc(r.authorName) + '</div>';
  h += '<div class="review-date">' + new Date(r.date).toLocaleDateString("uz-UZ") + '</div></div>';
  h += '<div class="review-stars">' + renderStars(r.rating) + '</div>';
  if(r.images && r.images.length){
    h += '<div class="review-imgs">';
    r.images.forEach(function(img){ h += '<img src="' + img + '" onclick="showFullImg(\'' + img + '\')">'; });
    h += '</div>';
  }
  if(r.text) h += '<div class="review-text">' + SEC.esc(r.text) + '</div>';
  h += '<div class="review-actions">';
  h += '<button class="review-vote' + (liked?" on":"") + '" onclick="toggleReviewVote(\''+r.id+'\',\'like\')">👍 ' + (r.likedBy?r.likedBy.length:0) + '</button>';
  h += '<button class="review-vote dislike' + (disliked?" on":"") + '" onclick="toggleReviewVote(\''+r.id+'\',\'dislike\')">👎 ' + (r.dislikedBy?r.dislikedBy.length:0) + '</button>';
  h += '</div></div>';
  return h;
}
function toggleReviewVote(reviewId, type){
  var uid = S.user ? (S.user.code || "g_" + (S.user.loginAt||0)) : "anon";
  var r = null;
  S.reviews.forEach(function(x){ if(x.id === reviewId) r = x; });
  if(!r) return;
  if(!r.likedBy) r.likedBy = [];
  if(!r.dislikedBy) r.dislikedBy = [];
  var li = r.likedBy.indexOf(uid);
  var di = r.dislikedBy.indexOf(uid);
  if(type === "like"){
    if(li === -1){ r.likedBy.push(uid); if(di !== -1) r.dislikedBy.splice(di, 1); }
    else { r.likedBy.splice(li, 1); }
  } else {
    if(di === -1){ r.dislikedBy.push(uid); if(li !== -1) r.likedBy.splice(li, 1); }
    else { r.dislikedBy.splice(di, 1); }
  }
  saveAll(); render();
}
function renderReviewsSection(targetType, targetId){

function setStar(n){

function acceptOrder(orderId){
  var order = null;
  S.orders.forEach(function(o){ if(o.id === orderId) order = o; });
  if(!order) return;
  openReviewModal(order);
}
function submitReview(orderId){
  var text = (document.getElementById("rev_text").value || "").trim();
  var courierText = (document.getElementById("courier_text").value || "").trim();
  var imgs = (_imgBuffers["rev_imgs"] || []).slice();
  var order = null;
  S.orders.forEach(function(o){ if(o.id === orderId) order = o; });
  if(!order){ toast("Buyurtma topilmadi", true); return; }
  var authorName = order.name || "Xaridor";
  var now = new Date().toISOString();
  var items = order.items || [];
  var baseReview = {
    orderId: orderId,
    authorName: authorName,
    authorPhone: order.phone || "",
    rating: _reviewStars,
    text: text,
    images: imgs,
    courierRating: _courierStars,
    courierText: courierText,
    likes: 0, dislikes: 0,
    likedBy: [], dislikedBy: [],
    date: now
  };
  if(items.length){
    items.forEach(function(it){
      var r = Object.assign({}, baseReview);
      r.id = "RV-" + Date.now() + "-" + Math.random().toString(36).slice(2,5);
      r.targetType = "product";
      var prod = S.products.filter(function(p){ return p.n === it.name; })[0];
      r.targetId = prod ? prod.id : (it.sellerId || "");
      r.productName = it.name;
      r.sellerId = it.sellerId || "";
      S.reviews.unshift(r);
    });
  } else {
    var r2 = Object.assign({}, baseReview);
    r2.id = "RV-" + Date.now() + "-svc";
    r2.targetType = "service";
    r2.targetId = orderId;
    r2.productName = order.svName || "Xizmat";
    S.reviews.unshift(r2);
  }
  order.status = "Yakunlandi";
  if(!order.statusLog) order.statusLog = [{status:"Yangi", date: order.createdAt || now}];
  order.statusLog.push({status: "Yakunlandi", date: now});
  order.reviewed = true;
  saveAll();
  _imgBuffers["rev_imgs"] = [];
  SEC.audit("review_submit", orderId);
  addNotif("success", "Sharh qabul qilindi", "Rahmat! Fikringiz saqlandi");
  closeModal();
  toast("Rahmat! Sharh saqlandi ✓");
  render();
}
function skipReview(orderId){
  var order = null;
  S.orders.forEach(function(o){ if(o.id === orderId) order = o; });
  if(!order) return;
  var now = new Date().toISOString();
  order.status = "Yakunlandi";
  if(!order.statusLog) order.statusLog = [{status:"Yangi", date: order.createdAt || now}];
  order.statusLog.push({status: "Yakunlandi", date: now});
  order.reviewed = true;
  saveAll();
  closeModal();
  toast("Qabul qilindi ✓");
  render();
}

function startFirebaseListener(){
  if(!FB_REF) return;
  FB_REF.on('value', function(snap){
    _fbSyncing = true;
    var d = snap.val() || {};
    _fbCache = d;
    if(!_fbReady){
      if(d.rayis_user_v7) S.user = d.rayis_user_v7;
      if(d.rayis_cart_v7) S.cart = d.rayis_cart_v7;
      if(d.rayis_favs_v7) S.favs = d.rayis_favs_v7;
      if(d.rayis_products_v7 && d.rayis_products_v7.length) S.products = d.rayis_products_v7;
      if(d.rayis_services_v7 && d.rayis_services_v7.length) S.services = d.rayis_services_v7;
      if(d.rayis_orders_v7) S.orders = d.rayis_orders_v7;
      if(d.rayis_sellers_v7 && d.rayis_sellers_v7.length) S.sellers = d.rayis_sellers_v7;
      if(d.rayis_emp_requests_v7) S.empRequests = d.rayis_emp_requests_v7;
      if(d.rayis_approved_emps_v7) S.approvedEmps = d.rayis_approved_emps_v7;
      if(d.rayis_notifications_v7) S.notifications = d.rayis_notifications_v7;
      if(d.rayis_frozen_v7) S.frozen = d.rayis_frozen_v7;
      if(d.rayis_freeze_reqs_v7) S.freezeRequests = d.rayis_freeze_reqs_v7;
      if(d.rayis_warnings_v7) S.warnings = d.rayis_warnings_v7;
      if(d.rayis_reviews_v7) S.reviews = d.rayis_reviews_v7;
      if(d.rayis_work_orders_v7) S.workOrders = d.rayis_work_orders_v7;
      _fbReady = true; _fbSyncing = false;
      showFbStatus("☁️ Firebase ulandi");
      render(); return;
    }
    var changed = false;
    if(d.rayis_orders_v7 && JSON.stringify(d.rayis_orders_v7) !== JSON.stringify(S.orders)){ S.orders = d.rayis_orders_v7; changed = true; }
    if(d.rayis_products_v7 && JSON.stringify(d.rayis_products_v7) !== JSON.stringify(S.products)){ S.products = d.rayis_products_v7; changed = true; }
    if(d.rayis_emp_requests_v7 && JSON.stringify(d.rayis_emp_requests_v7) !== JSON.stringify(S.empRequests)){ S.empRequests = d.rayis_emp_requests_v7; changed = true; }
    if(d.rayis_approved_emps_v7 && JSON.stringify(d.rayis_approved_emps_v7) !== JSON.stringify(S.approvedEmps)){ S.approvedEmps = d.rayis_approved_emps_v7; changed = true; }
    if(d.rayis_notifications_v7 && JSON.stringify(d.rayis_notifications_v7) !== JSON.stringify(S.notifications)){ S.notifications = d.rayis_notifications_v7; changed = true; }
    if(d.rayis_sellers_v7 && JSON.stringify(d.rayis_sellers_v7) !== JSON.stringify(S.sellers)){ S.sellers = d.rayis_sellers_v7; changed = true; }
    if(d.rayis_frozen_v7 && JSON.stringify(d.rayis_frozen_v7) !== JSON.stringify(S.frozen)){ S.frozen = d.rayis_frozen_v7; changed = true; }
    if(d.rayis_freeze_reqs_v7 && JSON.stringify(d.rayis_freeze_reqs_v7) !== JSON.stringify(S.freezeRequests)){ S.freezeRequests = d.rayis_freeze_reqs_v7; changed = true; }
    if(d.rayis_warnings_v7 && JSON.stringify(d.rayis_warnings_v7) !== JSON.stringify(S.warnings)){ S.warnings = d.rayis_warnings_v7; changed = true; }
    if(d.rayis_reviews_v7 && JSON.stringify(d.rayis_reviews_v7) !== JSON.stringify(S.reviews)){ S.reviews = d.rayis_reviews_v7; changed = true; }
    if(d.rayis_work_orders_v7 && JSON.stringify(d.rayis_work_orders_v7) !== JSON.stringify(S.workOrders)){ S.workOrders = d.rayis_work_orders_v7; changed = true; }
    _fbSyncing = false;
    if(changed) render();
  }, function(err){
    _fbSyncing = false;
    console.error("Firebase listen xato:", err);
    showFbStatus("Firebase ulanmadi — offline", true);
    _fbReady = true; render();
  });
}

var CALC = {

};

function calcAll(){
  var A=CALC;
  var betonV;
  if(A.foundType==="lenta") betonV=A.perimeter*A.lentaW*A.lentaH;
  else betonV=A.area*A.slabT;
  betonV=betonV*1.02;
  var totalH=A.floors*A.wallH;
  var perW=A.foundType==="lenta"?A.perimeter:4.5*Math.sqrt(A.area);
  var wOut=perW*totalH*0.85;
  var wIn=wOut*(A.innerPct/100);
  var wTot=wOut+wIn;
  var wall=WALLS[A.wallType];
  var wQ=wTot*wall.perM2;
  var roofCoef=A.roofType==="gable"?1.4:1.6;
  var roofA=A.area*roofCoef;

  var mats=[];
  function mat(name,qty,unit,prices,note){mats.push({name:name,qty:qty,unit:unit,b:prices[1],sumB:qty*prices[1],note:note||""})}

  /* POYDEVOR */
  mat("Beton M200",betonV.toFixed(2),"m3",PRICES.beton);
  mat("Tsement M400",Math.round(betonV*6),"qop",PRICES.tsement);
  mat("Qum",(betonV*0.5).toFixed(2),"m3",PRICES.qum);
  mat("Shagal",(betonV*0.85).toFixed(2),"m3",PRICES.shagal);
  mat("Armatura 12mm",(betonV*0.08).toFixed(3),"tonna",PRICES.armatura);
  mat("Reka (qolib)",(betonV*0.02).toFixed(3),"m3",PRICES.reka);
  mat("Opalubka (arenda)",(betonV*0.1).toFixed(2),"m3",PRICES.opalubka);

  /* DEVOR */
  mat(wall.n,Math.round(wQ),wall.u,PRICES[A.wallType]);
  mat("Yopishqoq (klei)",Math.round(wTot*4),"kg",[3000,3500]);
  mat("Sim to'r",Math.round(wTot*1.2),"m2",[3500,4500]);

  /* TOM */
  var strapN=Math.ceil(roofA/1.5);
  mat("Strapila 50x150",strapN,"dona",[80000,95000]);
  mat("Reka (tom)",(roofA*0.018).toFixed(2),"m3",PRICES.reka);
  mat("Qamish/Boyra",Math.round(roofA),"m2",PRICES.qamish);
  var covN=(A.coverType==="shifer"||A.coverType==="ondulin")?Math.ceil(roofA*0.15*8):Math.round(roofA*1.15);
  var covU=(A.coverType==="shifer"||A.coverType==="ondulin")?"list":"m2";
  mat("Tom qoplama",covN,covU,PRICES[A.coverType]);
  mat("Samarez (tom mixi)",Math.round(roofA*15),"dona",[800,1200]);

  /* ESHIK VA DERAZA */
  var winN=Math.max(2,A.floors*3);
  var doorN=A.floors*2+1;
  var extDoorN=1;
  mat("Deraza (plastik 1.5x1.5)",winN,"dona",[1500000,1800000]);
  mat("Ichki eshik",doorN,"dona",[800000,1200000]);
  mat("Tashqi eshik (kirish)",extDoorN,"dona",[2500000,3500000]);

  /* ELEKTR */
  if(A.includeElectrical){
    var cableM=Math.round(A.area*A.floors*1.2);
    var rozN=Math.round(A.area*A.floors/8);
    var switchN=Math.round(A.area*A.floors/15);
    var lampN=Math.round(A.area*A.floors/10);
    var automats=Math.max(6,Math.round(A.area*A.floors/20));
    mat("Elektrik kabel (3x2.5)",cableM,"metr",[12000,15000]);
    mat("Rozetka",rozN,"dona",[25000,45000]);
    mat("Vilka + kabel uchi",rozN,"dona",[8000,12000]);
    mat("Vikluchatel",switchN,"dona",[30000,50000]);
    mat("LED chiroq",lampN,"dona",[25000,45000]);
    mat("Elektr shit + avtomat",automats,"dona",[45000,85000]);
    mat("Shit (asosiy)",1,"dona",[450000,650000]);
    mat("GOFRA / kabel kanal",Math.round(cableM*0.8),"metr",[3000,5000]);
  }

  /* SUVOQ VA SHPAKLYOVKA */
  if(A.includeFinish){
    var wallM2=wTot;
    var shtukM2=wallM2*2;
    var qumShtuk=(shtukM2*0.008).toFixed(2);
    var tsemShtuk=Math.round(shtukM2*0.0025);
    mat("Shtukaturka qum",qumShtuk,"m3",PRICES.qum);
    mat("Shtukaturka tsement",tsemShtuk,"qop",PRICES.tsement);
    mat("Shpaklyovka (finish)",Math.round(shtukM2*0.5),"kg",[8000,10000]);
    mat("Gruntovka",Math.round(shtukM2*0.15),"litr",[8000,12000]);
    mat("Malyar (bo'yoq)",Math.round(shtukM2*0.25),"litr",[25000,35000]);
    var polM2=A.area*A.floors;
    mat("Pol qoplama (laminat)",Math.round(polM2*1.05),"m2",[180000,250000]);
    mat("Plintus",Math.round(A.area*A.floors*0.9),"metr",[25000,35000]);
  }

  /* ISITISH */
  if(A.includeHeating){
    var radiators=Math.max(4,Math.round(A.area*A.floors/12));
    var pipeM=Math.round(A.area*A.floors*0.4);
    mat("Isitish radiatori",radiators,"dona",[650000,950000]);
    mat("Isitish trubasi (PPR)",pipeM,"metr",[25000,35000]);
    mat("Qozon (gaz)",1,"dona",[3500000,6500000]);
    mat("Fitinglar to'plami",1,"to'plam",[450000,750000]);
  }

  var matTotalB=0;
  mats.forEach(function(m){matTotalB+=m.sumB});

  var labors=[];
  if(A.workType!=="self"){
    function lab(name,qty,unit,prices){labors.push({name:name,qty:qty,unit:unit,sumB:qty*prices[1]})}
    lab("Beton quyish",betonV.toFixed(2),"m3",LABOR.beton);
    lab("Armatura bog'lash",(betonV*0.08).toFixed(3),"tonna",LABOR.armatura);
    lab("Devor terish",wTot.toFixed(0),"m2",LABOR[wall.labor]);
    lab("Strapila yig'ish",roofA.toFixed(1),"m2",LABOR.strapila);
    lab("Tom yopish",roofA.toFixed(1),"m2",LABOR.tom);
    if(A.includeElectrical) lab("Elektrik ishlari",A.area*A.floors,"m2",[30000,45000]);
    if(A.includeFinish) lab("Suvoq + shpaklyovka",wTot.toFixed(0),"m2",[45000,65000]);
    if(A.includeFinish) lab("Pol yotqizish",(A.area*A.floors).toFixed(0),"m2",[35000,50000]);
    if(A.includeHeating) lab("Isitish montaji",A.area*A.floors,"m2",[25000,40000]);
  }
  var laborB=0;
  labors.forEach(function(l){laborB+=l.sumB});
  return {mats:mats,labors:labors,matTotalB:matTotalB,laborB:laborB,totalB:matTotalB+laborB};

function submitEmpCode(){
  if(!SEC.rateLimit("emp_login")){ toast("Ko'p urinish", true); return; }
  var code = document.getElementById("emp_c").value.trim();
  if(!code){ toast("Kod kiriting", true); return; }
  if(code === XOJA_KOD){
    S.user = {role:"Xo'jayin", ic:"👑", loginAt:Date.now()};
    saveAll(); SEC.audit("login_xojayin", "");
    addNotif("info", "Xo'jayin kirdi", "Tizimga Xo'jayin kirdi");
    toast("Xush kelibsiz"); S.view = "panel"; render(); return;
  }
  var emp = XODIM_KODLARI[code];
  if(!emp){ toast("Kod topilmadi", true); SEC.audit("login_failed", "***"+code.slice(-2)); return; }
  if(isFrozen("employees", code)){ toast("Hisobingiz muzlatilgan", true); return; }
  if(S.approvedEmps.indexOf(code)!==-1){
    S.user = {role:emp.role, ic:emp.ic, code:code, loginAt:Date.now()};
    saveAll(); SEC.audit("login_success", emp.role);
    toast("Xush kelibsiz"); S.view = "panel"; render(); return;
  }
  var existing = null;
  for(var i=0;i<S.empRequests.length;i++){
    if(S.empRequests[i].code===code && S.empRequests[i].status==="pending"){ existing = S.empRequests[i]; break; }
  }
  if(!existing){
    S.empRequests.unshift({code: code, role: emp.role, ic: emp.ic, status:"pending", requestedAt: new Date().toISOString()});
    saveAll(); SEC.audit("emp_request", emp.role);
    addNotif("emp", "Yangi xodim so'rovi", emp.role + " (" + code + ")");
  }
  S.waitingCode = code; S.view = "waiting"; render();
}

/* ============ SAVAT ============ */
function addToCart(id){
  var p = S.products.filter(function(x){return x.id===id})[0];
  if(!p || p.stock===0) return;
  var found = false;
  for(var i=0;i<S.cart.length;i++){
    if(S.cart[i].id===id){
      if(S.cart[i].qty >= p.stock){ toast("Faqat " + p.stock + " ta", true); return; }
      S.cart[i].qty++; found = true; break;
    }
  }
  if(!found) S.cart.push({id:id, qty:1});
  saveAll(); toast("Savatga qo'shildi"); render();
}
function openCart(){
  var h = '<button class="mclose" onclick="closeModal()">✕ Yopish</button>';
  if(S.cart.length===0){
    h += '<div class="empty"><div class="eic">🛒</div>Savat bo\'sh</div>';
    document.getElementById("mbox").innerHTML = h;
    document.getElementById("modal").classList.add("on"); return;
  }
  var total = 0, ogirlik = 0;
  h += '<div class="mh">🛒 Savat</div>';
  S.cart.forEach(function(c){
    var p = S.products.filter(function(x){return x.id===c.id})[0];
    if(!p) return;
    total += p.price * c.qty;
    ogirlik += mahsulotOgirligi(p) * c.qty;
    h += '<div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05)">';
    if(p.images && p.images.length){ h += '<img class="mini-thumb" src="' + p.images[0] + '">'; }
    else { h += '<div style="font-size:24px">'+SEC.esc(p.e)+'</div>'; }
    h += '<div style="flex:1"><div style="font-size:12.5px;font-weight:600">'+SEC.esc(p.n)+'</div><div style="font-size:10px;color:#F5B041">🏪 '+SEC.esc(sotuvchiNom(p.sellerId))+'</div><div style="font-size:11px;color:#2ECC71;font-weight:700">'+fmt(p.price)+'</div></div>';
    h += '<button class="btn-m" onclick="changeQty(\''+c.id+'\',-1)">−</button>';
    h += '<span style="min-width:22px;text-align:center;font-weight:700">'+c.qty+'</span>';
    h += '<button class="btn-m" onclick="changeQty(\''+c.id+'\',1)">+</button></div>';
  });
  var yFoiz = yetkazishNarxi(ogirlik, total);
  var ySumma = hisoblashYetkazish(ogirlik, total);
  var jami = total + ySumma;
  h += '<div class="del-row"><span>Mahsulotlar:</span><span>'+fmt(total)+'</span></div>';
  h += '<div class="del-row"><span>Og\'irlik:</span><span>'+ogirlik.toFixed(1)+' kg</span></div>';
  h += '<div class="del-row"><span>Yetkazish ('+yFoiz+'%):</span><span>'+fmt(ySumma)+'</span></div>';
  h += '<div class="del-row total"><span>JAMI:</span><span>'+fmt(jami)+'</span></div>';
  h += '<button class="btn" onclick="openCheckout()">Buyurtma berish</button>';
  document.getElementById("mbox").innerHTML = h;
  document.getElementById("modal").classList.add("on");
}
function changeQty(id, d){
  for(var i=0;i<S.cart.length;i++){
    if(S.cart[i].id===id){ S.cart[i].qty += d; if(S.cart[i].qty<=0) S.cart.splice(i,1); break; }
  }
  saveAll(); render(); openCart();
}
function openCheckout(){
  var h = '<button class="mclose" onclick="closeModal()">✕ Yopish</button><div class="mh">Buyurtma berish</div>';
  h += '<label class="lbl">Ism *</label><input class="inp" id="ck_n" maxlength="60">';
  h += '<label class="lbl">Telefon *</label><input class="inp" id="ck_p" maxlength="20" placeholder="+7 981 097 7679">';
  h += '<label class="lbl">Manzil</label><input class="inp" id="ck_a" maxlength="120">';
  h += '<label class="lbl">To\'lov</label><select class="inp" id="ck_pay"><option>Naqd pul</option><option>Karta</option><option>Click</option><option>Payme</option></select>';
  h += '<button class="btn" onclick="placeOrder()">Tasdiqlash</button>';
  document.getElementById("mbox").innerHTML = h;
}
function placeOrder(){
  var n = document.getElementById("ck_n").value.trim();
  var p = document.getElementById("ck_p").value.trim();
  var a = document.getElementById("ck_a").value.trim();
  var pay = document.getElementById("ck_pay").value;
  if(!SEC.validName(n)){ toast("Ism 2-60 belgi", true); return; }
  if(!SEC.validPhone(p)){ toast("Telefon noto'g'ri", true); return; }
  var items = [], total = 0, ogirlik = 0;
  S.cart.forEach(function(c){
    var pr = S.products.filter(function(x){return x.id===c.id})[0];
    if(!pr) return;
    var og = mahsulotOgirligi(pr);
    items.push({name:pr.n, qty:c.qty, price:pr.price, sellerId:pr.sellerId, ogirlik:og});
    total += pr.price * c.qty;
    ogirlik += og * c.qty;
    pr.stock = Math.max(0, pr.stock - c.qty);
  });
  var yFoiz = yetkazishNarxi(ogirlik, total);
  var ySumma = hisoblashYetkazish(ogirlik, total);
  var jami = total + ySumma;
  var now = new Date().toISOString();
  var o = {id: "ORD-" + Date.now().toString().slice(-6), type: "savdo", items: items, subtotal: total, ogirlik: Math.round(ogirlik * 10) / 10, yetkazishFoiz: yFoiz, yetkazishSumma: ySumma, total: jami, name: n, phone: p, address: a, payment: pay, status: "Yangi", date: now.slice(0,10), createdAt: now, statusLog: [{status: "Yangi", date: now}]};
  S.orders.unshift(o); S.cart = [];
  saveAll(); SEC.audit("order", n + " → " + fmt(jami));

/* ============ TIMELINE ============ */
function renderTimeline(order){
  var log = order.statusLog || [{status: "Yangi", date: order.createdAt || new Date().toISOString()}];
  var h = '<div class="timeline">';
  h += '<div style="color:#8E9AAF;font-size:10px;font-weight:700;margin-bottom:6px">📋 BUYURTMA HOLATI</div>';
  log.forEach(function(item, idx){
    var isLast = (idx === log.length - 1);
    h += '<div class="tl-item">';
    h += '<div class="tl-dot' + (isLast ? ' active' : '') + '"></div>';
    h += '<div>';
    h += '<div class="tl-h">' + SEC.esc(item.status) + '</div>';
    h += '<div class="tl-d">' + new Date(item.date).toLocaleString("uz-UZ") + '</div>';
    h += '</div></div>';
  });
  h += '</div>';
  return h;
}

      if(o.orderTime) h += ' · ⏰ ' + SEC.esc(o.orderTime);

      h += '<div class="oinf">🔧 ' + SEC.esc(o.svName) + '<br>' + SEC.esc(o.spec) + '</div>';
    } else if(o.items) {
      h += '<div class="oinf">';
      o.items.forEach(function(it){
        h += SEC.esc(it.name) + ' × ' + it.qty;

function updateOrderStatus(orderId, newStatus){
  var now = new Date().toISOString();
  S.orders.forEach(function(o){
    if(o.id === orderId){
      o.status = newStatus;
      if(!o.statusLog) o.statusLog = [{status:"Yangi", date: o.createdAt || now}];
      o.statusLog.push({status: newStatus, date: now});
    }
  });
  saveAll(); SEC.audit("order_status", orderId + " → " + newStatus);
  addNotif("status", "Buyurtma holati: " + newStatus, "#" + orderId.slice(-6));
  toast("Holat: " + newStatus); render();
}
function approveEmp(code){
  if(S.approvedEmps.indexOf(code) === -1){ S.approvedEmps.push(code); }
  S.empRequests = S.empRequests.filter(function(r){ return r.code !== code; });
  saveAll(); SEC.audit("approve_emp", code);
  var emp = XODIM_KODLARI[code];
  addNotif("approve", "Xodim tasdiqlandi", emp.role + " (" + code + ")");
  toast("Tasdiqlandi ✓"); render();
}
function rejectEmp(code){
  S.empRequests = S.empRequests.filter(function(r){ return r.code !== code; });
  saveAll(); SEC.audit("reject_emp", code);
  var emp = XODIM_KODLARI[code];
  addNotif("reject", "Xodim rad etildi", emp.role);
  toast("Rad etildi"); render();
}
function revokeEmp(code){
  if(!confirm("Bekor qilmoqchimisiz?")) return;
  S.approvedEmps = S.approvedEmps.filter(function(c){ return c !== code; });
  saveAll(); SEC.audit("revoke_emp", code);
  addNotif("warning", "Xodim bekor qilindi", code);
  toast("Bekor qilindi"); render();
}
function incStock(id, d){
  S.products.forEach(function(p){ if(p.id===id) p.stock = Math.max(0, p.stock + d); });
  saveAll(); render();
}

/* ============ NAV ============ */
function navBar(){
  var ucnt = unreadCount();
  var items = [
    {v:"home", ic:"🏠", l:"Asosiy"},
    {v:"orders", ic:"📋", l:"Buyurtma"},
    {v:"notifications", ic:"🔔", l:"Xabar" + (ucnt>0?" ("+ucnt+")":"")},
    {v:"favs", ic:"❤️", l:"Sevimli"}
  ];
  if(S.user && S.user.role!=="Xaridor") items.push({v:"panel", ic:S.user.ic, l:S.user.role.slice(0,7)});
  var h = '<div class="nav">';
  items.forEach(function(it){
    h += '<button class="nb ' + (S.view===it.v?"on":"") + '" onclick="goView(\''+it.v+'\')">';
    h += '<span class="ic">' + it.ic + '</span><span>' + it.l + '</span></button>';
  });
  h += '</div>';
  return h;
}
function goView(v){
  S.view = v;
  if(v==="home"){ S.group = null; S.sub = null; S.query = ""; }
  if(v==="notifications") setTimeout(function(){ markAllRead(); }, 1500);
  pushNav(); render();
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
document.getElementById("modal").addEventListener("click", function(e){ if(e.target.id==="modal") closeModal(); });

/* ============ RENDER ============ */
