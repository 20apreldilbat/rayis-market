<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#005BFF">
<title>RAYIS — Hammasi bir joyda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23005BFF'/><text x='50' y='72' font-size='62' font-weight='900' fill='white' text-anchor='middle' font-family='Arial'>R</text></svg>">
<style>
:root{
  --blue:#005BFF;--blue-d:#0047CC;--blue-l:#E6EFFF;
  --bg:#F5F7FA;--sf:#FFFFFF;--sf2:#F0F3F7;
  --bd:#E5E9F0;--tx:#0F1419;--tx2:#586174;--tx3:#8B94A6;
  --red:#FF3B30;--green:#00A854;--orange:#FF9500;
  --sh:0 1px 2px rgba(15,20,25,.04),0 2px 8px rgba(15,20,25,.04);
  --sh2:0 4px 16px rgba(15,20,25,.08);
  --r:16px;--r-s:12px;--r-l:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.4;
  min-height:100vh;padding-bottom:76px;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input{font-family:inherit}
.app{max-width:640px;margin:0 auto}

/* ============ HEADER ============ */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--sf);border-bottom:1px solid var(--bd);
  padding:10px 12px 12px;
}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none;color:var(--tx)}
.logo-ic{width:36px;height:36px;flex-shrink:0;border-radius:10px}
.logo-tx{font-size:16px;font-weight:900;letter-spacing:.3px;color:var(--blue)}
.logo-sub{font-size:9px;color:var(--tx3);letter-spacing:1.2px;font-weight:700;margin-top:-2px}
.hdr-acts{display:flex;gap:6px;margin-left:auto}
.hbtn{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--tx);position:relative;
  background:var(--sf2);transition:transform .15s;
}
.hbtn:active{transform:scale(.92)}
.hbtn .badge{
  position:absolute;top:-3px;right:-3px;
  min-width:18px;height:18px;padding:0 5px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;
  border-radius:100px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sf);
}
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--sf2);border:1.5px solid transparent;
  border-radius:12px;padding:0 12px;height:44px;
  transition:border .15s;
}
.search:focus-within{border-color:var(--blue);background:#fff}
.search input{
  flex:1;background:none;border:none;outline:none;
  color:var(--tx);font-size:14px;font-weight:500;
  height:100%;
}
.search input::placeholder{color:var(--tx3)}
.search .si{font-size:17px;color:var(--tx3)}

/* ============ LOC ============ */
.loc{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;font-size:12px;color:var(--tx2);
  background:var(--sf);border-bottom:1px solid var(--bd);
}
.loc b{color:var(--blue);font-weight:700}
.loc button{color:var(--blue);font-weight:700;font-size:12px;text-decoration:underline;margin-left:auto}

/* ============ CHIPS ============ */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:12px 12px;scrollbar-width:none;
  background:var(--sf);border-bottom:1px solid var(--bd);
  position:sticky;top:108px;z-index:40;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:100px;
  background:var(--sf2);border:1.5px solid transparent;
  font-size:13px;font-weight:600;white-space:nowrap;
  color:var(--tx);transition:.15s;
}
.chip.on{background:var(--blue);color:#fff}
.chip:active{transform:scale(.95)}

/* ============ BANNER ============ */
.banner-wrap{padding:14px 12px 0}
.banner{
  border-radius:var(--r-l);padding:22px;
  background:linear-gradient(135deg,#005BFF 0%,#0047CC 100%);
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,91,255,.25);
}
.banner::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.12);
}
.banner::after{
  content:'';position:absolute;bottom:-30px;right:20px;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.banner h2{font-size:20px;font-weight:900;margin-bottom:6px;position:relative;letter-spacing:-.3px}
.banner p{font-size:13px;opacity:.92;margin-bottom:14px;position:relative;line-height:1.4}
.banner button{
  background:#fff;color:var(--blue);padding:10px 18px;
  border-radius:10px;font-weight:800;font-size:13px;
  position:relative;transition:transform .15s;
}
.banner button:active{transform:scale(.96)}

/* ============ SECTION ============ */
.sec-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 14px 12px;
}
.sec-h h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-.2px}
.sec-h a{font-size:13px;color:var(--blue);font-weight:700;text-decoration:none}

/* ============ CATEGORIES ============ */
.cat-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px;padding:0 12px;
}
.cat{
  background:var(--sf);border-radius:var(--r);
  padding:14px 6px;text-align:center;
  transition:.15s;cursor:pointer;
  box-shadow:var(--sh);
}
.cat:active{transform:scale(.95);background:var(--blue-l)}
.cat-ic{
  width:46px;height:46px;margin:0 auto 8px;
  border-radius:12px;background:var(--blue-l);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.cat-tx{font-size:11px;font-weight:700;line-height:1.2;color:var(--tx)}

/* ============ PRODUCTS ============ */
.grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:0 12px;
}
.prod{
  background:var(--sf);border-radius:var(--r);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  box-shadow:var(--sh);transition:transform .15s;
}
.prod:active{transform:scale(.98)}
.prod-img{
  aspect-ratio:1;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:56px;position:relative;
}
.prod-disc{
  position:absolute;top:8px;left:8px;
  background:var(--red);color:#fff;
  font-size:11px;font-weight:900;
  padding:3px 8px;border-radius:6px;
  letter-spacing:-.3px;
}
.prod-fav{
  position:absolute;top:8px;right:8px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.95);color:var(--tx);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;backdrop-filter:blur(6px);
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  transition:transform .15s;
}
.prod-fav:active{transform:scale(.88)}
.prod-fav.on{color:var(--red)}
.prod-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}
.prod-price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.prod-new{font-size:16px;font-weight:900;color:var(--tx);letter-spacing:-.3px}
.prod-old{font-size:11.5px;color:var(--tx3);text-decoration:line-through}
.prod-name{
  font-size:12.5px;color:var(--tx);line-height:1.35;
  margin:6px 0;flex:1;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.prod-rate{
  display:flex;align-items:center;gap:4px;
  font-size:11px;color:var(--tx2);margin-bottom:8px;
  font-weight:600;
}
.prod-rate .star{color:var(--orange);font-size:12px}
.prod-add{
  width:100%;padding:9px;border-radius:10px;
  background:var(--blue);color:#fff;
  font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:transform .15s;
}
.prod-add:active{transform:scale(.96)}
.prod-add.on{background:var(--blue-l);color:var(--blue)}

/* ============ MASTERS ============ */
.master{
  display:flex;gap:12px;padding:14px;
  background:var(--sf);border-radius:var(--r);
  margin:0 12px 10px;box-shadow:var(--sh);
}
.master-av{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--blue-d));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#fff;flex-shrink:0;
  letter-spacing:-.5px;
}
.master-inf{flex:1;min-width:0}
.master-n{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.master-s{font-size:12px;color:var(--tx2);margin:3px 0 5px}
.master-r{font-size:11.5px;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:4px}
.master-r .star{color:var(--orange)}
.master-btn{
  align-self:center;padding:10px 16px;
  background:var(--blue);color:#fff;border-radius:10px;
  font-size:13px;font-weight:800;flex-shrink:0;
  transition:transform .15s;
}
.master-btn:active{transform:scale(.95)}

/* ============ NAV ============ */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--sf);border-top:1px solid var(--bd);
  display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.nv{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:5px;
  color:var(--tx3);font-size:10.5px;font-weight:600;
  position:relative;transition:color .15s;
}
.nv-ic{font-size:20px;line-height:1}
.nv.on{color:var(--blue)}
.nv .badge{
  position:absolute;top:2px;right:calc(50% - 18px);
  min-width:16px;height:16px;padding:0 4px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:800;
  border-radius:100px;display:flex;align-items:center;justify-content:center;
}

/* ============ DRAWER ============ */
.dr{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,20,25,.55);display:none;
  align-items:flex-end;justify-content:center;
  animation:fadeIn .15s;
}
.dr.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dr-box{
  background:var(--sf);width:100%;max-width:640px;
  max-height:88vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:18px;
  animation:up .25s cubic-bezier(.2,.8,.2,1);
  padding-bottom:max(18px,env(safe-area-inset-bottom));
}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.dr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dr-h h3{font-size:18px;font-weight:900;letter-spacing:-.3px}
.dr-x{
  width:36px;height:36px;border-radius:50%;
  background:var(--sf2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.dr-x:active{transform:scale(.9)}

/* ============ CART ITEM ============ */
.ci{
  display:flex;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--bd);
}
.ci-img{
  width:68px;height:68px;border-radius:12px;
  background:var(--sf2);display:flex;align-items:center;justify-content:center;
  font-size:32px;flex-shrink:0;
}
.ci-inf{flex:1;min-width:0}
.ci-n{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:5px}
.ci-p{font-size:15px;font-weight:900;color:var(--blue);margin-bottom:8px}
.ci-q{display:flex;align-items:center;gap:8px}
.qb{
  width:30px;height:30px;border-radius:9px;
  background:var(--sf2);
  font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.qb:active{transform:scale(.9)}
.qv{font-size:14px;font-weight:800;min-width:24px;text-align:center}

/* ============ TOTAL ============ */
.total{
  background:var(--sf2);border-radius:var(--r);
  padding:16px;margin-top:16px;
}
.total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--tx2)}
.total-row b{color:var(--tx);font-weight:700}
.total-row.big{font-size:17px;font-weight:900;color:var(--tx);margin-top:10px;padding-top:10px;border-top:2px solid var(--bd)}
.total-row.big span:last-child{color:var(--blue)}
.btn-go{
  width:100%;padding:15px;border-radius:12px;
  background:var(--blue);color:#fff;font-size:15px;font-weight:900;
  margin-top:14px;transition:transform .15s;
}
.btn-go:active{transform:scale(.98)}

/* ============ TOAST ============ */
.tst{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--tx);color:#fff;
  padding:12px 22px;border-radius:100px;
  font-size:13px;font-weight:700;z-index:300;
  opacity:0;transition:.3s;pointer-events:none;
  max-width:90%;text-align:center;
  box-shadow:var(--sh2);
}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.o{background:var(--green);color:#fff}
.tst.e{background:var(--red);color:#fff}

@media(max-width:360px){
  .grid{gap:8px;padding:0 8px}
  .cat-grid{gap:6px;padding:0 8px}
  .prod-new{font-size:15px}
}
</style>
</head>

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':' o');},2000);}

function renderChips(){
  var h='';
  CATS.forEach(function(c){
    h+='<button class="chip '+(ST.cat===c.id?'on':'')+'" onclick="setCat(\''+c.id+'\')">'+c.ic+' '+esc(c.n)+'</button>';
  });
  document.getElementById('chips').innerHTML=h;
}
function renderCatGrid(){
  var h='';
  CATS.filter(function(c){return c.id!=='all';}).forEach(function(c){
    h+='<div class="cat" onclick="setCat(\''+c.id+'\')"><div class="cat-ic">'+c.ic+'</div><div class="cat-tx">'+esc(c.n)+'</div></div>';
  });
  document.getElementById('catGrid').innerHTML=h;
}
function renderProducts(){
  var list=PRODUCTS.filter(function(p){
    if(ST.cat!=='all' && p.cat!==ST.cat)return false;
    if(ST.search){
      var q=ST.search.toLowerCase();
      return p.n.toLowerCase().indexOf(q)>=0 || p.seller.toLowerCase().indexOf(q)>=0;
    }
    return true;
  });
  var g=document.getElementById('productGrid');
  if(!list.length){
    g.innerHTML='<div style="grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--tx2)"><div style="font-size:48px;margin-bottom:10px">🔍</div><div style="font-weight:700">Topilmadi</div></div>';
    return;
  }
  var h='';
  list.forEach(function(p){
    var disc=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
    var inCart=ST.cart[p.id];
    var inFav=ST.fav[p.id];
    h+='<div class="prod">';
    h+='<div class="prod-img" onclick="openProduct(\''+p.id+'\')">';
    if(disc>0)h+='<div class="prod-disc">-'+disc+'%</div>';
    h+='<button class="prod-fav '+(inFav?'on':'')+'" onclick="toggleFav(\''+p.id+'\',event)">'+(inFav?'❤️':'🤍')+'</button>';
    h+=p.e;
    h+='</div>';
    h+='<div class="prod-body">';
    h+='<div class="prod-price"><span class="prod-new">'+fmt(p.price)+'</span>';
    if(p.old>p.price)h+='<span class="prod-old">'+fmt(p.old)+'</span>';
    h+='</div>';
    h+='<div class="prod-name" onclick="openProduct(\''+p.id+'\')">'+esc(p.n)+'</div>';
    h+='<div class="prod-rate"><span class="star">★</span> '+p.rate+' · '+p.reviews+' ta sharh</div>';
    h+='<button class="prod-add '+(inCart?'on':'')+'" onclick="addCart(\''+p.id+'\')">'+(inCart?'✓ Savatda ('+inCart+')':'🛒 Savatga')+'</button>';
    h+='</div>';
    h+='</div>';
  });
  g.innerHTML=h;
}

function addCart(pid){
  var p=PRODUCTS.find(function(x){return x.id===pid;});
  if(!p)return;
  if(ST.cart[pid]){ST.cart[pid]++;}
  else ST.cart[pid]=1;
  saveCart();
  renderProducts();
  toast('🛒 '+p.n.slice(0,30)+' savatga qo\'shildi','o');
}
function decCart(pid){
  if(!ST.cart[pid])return;
  ST.cart[pid]--;
  if(ST.cart[pid]<=0)delete ST.cart[pid];
  saveCart();
  renderProducts();
}
function removeCart(pid){
  delete ST.cart[pid];
  saveCart();
  renderProducts();
  openCart();
}
function toggleFav(pid,ev){
  if(ev)ev.stopPropagation();
  if(ST.fav[pid])delete ST.fav[pid];
  else ST.fav[pid]=true;
  saveFav();
  renderProducts();
}

function openCart(){
  var ids=Object.keys(ST.cart);
  var h='<div class="dr-h"><h3>🛒 Savat</h3><button class="dr-x" onclick="closeDr()">✕</button></div>';
  if(!ids.length){
    h+='<div style="text-align:center;padding:40px 20px"><div style="font-size:56px;margin-bottom:10px">🛒</div><div style="font-weight:800;font-size:16px">Savat bo\'sh</div><div style="font-size:13px;color:var(--tx2);margin-top:6px">Mahsulot qo\'shing</div><button class="btn-go" onclick="closeDr()" style="max-width:200px;margin:16px auto 0">Katalogga</button></div>';
  } else {
    var subtotal=0;
    ids.forEach(function(pid){
      var p=PRODUCTS.find(function(x){return x.id===pid;});
      if(!p)return;
      var q=ST.cart[pid];
      var sum=p.price*q;
      subtotal+=sum;
      h+='<div class="ci">';
      h+='<div class="ci-img">'+p.e+'</div>';
      h+='<div class="ci-inf">';
      h+='<div class="ci-n">'+esc(p.n)+'</div>';
      h+='<div class="ci-p">'+fmt(sum)+'</div>';
      h+='<div class="ci-q">';
      h+='<button class="qb" onclick="decCart(\''+pid+'\')">−</button>';
      h+='<span class="qv">'+q+'</span>';
      h+='<button class="qb" onclick="addCart(\''+pid+'\')">+</button>';
      h+='<button class="qb" style="margin-left:auto;color:var(--red)" onclick="removeCart(\''+pid+'\')">🗑</button>';
      h+='</div></div></div>';
    });
    var delivery=subtotal>2000000?0:50000;
    h+='<div class="total">';
    h+='<div class="total-row"><span>Mahsulotlar ('+ids.length+')</span><b>'+fmt(subtotal)+'</b></div>';
    h+='<div class="total-row"><span>Yetkazib berish</span><b>'+(delivery?fmt(delivery):'Bepul')+'</b></div>';
    h+='<div class="total-row big"><span>JAMI</span><span>'+fmt(subtotal+delivery)+'</span></div>';
    h+='</div>';
    h+='<button class="btn-go" onclick="checkout()">✅ Buyurtma berish</button>';
  }
  document.getElementById('drBox').innerHTML=h;
  document.getElementById('dr').classList.add('on');
}

function submitOrder(){
  var n=document.getElementById('ckName').value.trim();
  var p=document.getElementById('ckPhone').value.trim();
  var a=document.getElementById('ckAddr').value.trim();
  var nt=document.getElementById('ckNote').value.trim();
  if(n.length<2)return toast('Ism kiriting','e');
  if(p.length<7)return toast('Telefon kiriting','e');
  if(a.length<3)return toast('Manzil kiriting','e');
  
  var ids=Object.keys(ST.cart);
  var items=[];
  var subtotal=0;
  ids.forEach(function(pid){
    var pr=PRODUCTS.find(function(x){return x.id===pid;});
    if(!pr)return;
    var q=ST.cart[pid];
    var sum=pr.price*q;
    subtotal+=sum;
    items.push({id:pr.id,n:pr.n,e:pr.e,price:pr.price,qty:q,sum:sum,unit:pr.unit});
  });
  var delivery=subtotal>2000000?0:50000;
  var order={
    id:'R-'+Date.now().toString().slice(-6),
    uid:UID,
    name:n,phone:p,address:a,note:nt,
    loc:ST.loc,
    items:items,
    subtotal:subtotal,
    delivery:delivery,
    total:subtotal+delivery,
    status:'yangi',
    createdAt:Date.now()
  };
  
  var orders=JSON.parse(localStorage.getItem('rayis_orders_'+UID)||'[]');
  orders.unshift(order);
  localStorage.setItem('rayis_orders_'+UID,JSON.stringify(orders));
  
  ST.cart={};
  saveCart();
  renderProducts();
  closeDr();
  
  setTimeout(function(){
    var h='<div class="dr-h"><h3>✅ Buyurtma qabul qilindi!</h3><button class="dr-x" onclick="closeDr()">✕</button></div>';
    h+='<div style="text-align:center;padding:20px">';
    h+='<div style="font-size:64px;margin-bottom:10px">🎉</div>';
    h+='<div style="font-size:18px;font-weight:900;margin-bottom:6px">Rahmat, '+esc(n.split(' ')[0])+'!</div>';
    h+='<div style="font-size:13px;color:var(--tx2);margin-bottom:14px">Buyurtma raqami: <b style="color:var(--blue)">#'+order.id+'</b></div>';
    h+='<div style="padding:14px;background:var(--sf2);border-radius:12px;text-align:left;font-size:12.5px;line-height:1.8">';
    h+='📍 '+esc(order.address)+'<br>';
    h+='💰 '+fmt(order.total)+'<br>';
    h+='📞 Operator tez orada qo\'ng\'iroq qiladi';
    h+='</div>';
    h+='<button class="btn-go" onclick="closeDr()" style="margin-top:16px">Yopish</button>';
    h+='</div>';
    document.getElementById('drBox').innerHTML=h;
    document.getElementById('dr').classList.add('on');
  },300);
}

function goNav(k){
  if(k==='home')window.scrollTo({top:0,behavior:'smooth'});
  else if(k==='catalog')window.location.href='katalog.html';
  else if(k==='calc')window.location.href='qurilish.html';
  else if(k==='profile')window.location.href='profil.html';
}
function openProduct(pid){window.location.href='mahsulot.html?id='+pid;}

(function init(){
  loadLocal();
  document.getElementById('locName').textContent=ST.loc;
  renderChips();
  renderCatGrid();
  renderProducts();
  renderMasters();
  updateBadges();
  console.log('✅ RAYIS v2.0 — Ozon uslubi ishga tushdi');
})();
</script>
