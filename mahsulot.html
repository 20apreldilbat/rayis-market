<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#22C55E">
<title>Mahsulot — RAYIS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2322C55E'/><path d='M50 22 L68 38 L32 38 Z' fill='%230B1119'/><text x='50' y='75' font-size='52' font-weight='900' fill='%230B1119' text-anchor='middle' font-family='Arial'>R</text></svg>">
<style>
:root{
  --bg:#F5F7FA;--sf:#FFFFFF;--sf2:#F1F5F9;--sf3:#E8EEF5;--bd:#E2E8F0;
  --tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --pr:#22C55E;--pr2:#16A34A;--prD:#15803D;--prL:#DCFCE7;
  --or:#F59E0B;--er:#EF4444;--ac:#3B82F6;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 16px rgba(0,0,0,.1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-t="dark"]{
  --bg:#0B1119;--sf:#151C26;--sf2:#1E2733;--sf3:#252F3D;--bd:#2A3441;
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;
  --prL:#064E3B;
  --sh:0 1px 3px rgba(0,0,0,.3);
  --sh2:0 4px 16px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;
  min-height:100vh;
  padding-bottom:calc(120px + var(--safe-b));
  overscroll-behavior-y:none;
  -webkit-overflow-scrolling:touch;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px}
.app{max-width:640px;margin:0 auto;background:var(--bg)}

.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--sf);border-bottom:1px solid var(--bd);
  padding:calc(8px + var(--safe-t)) 8px 8px;
  display:flex;align-items:center;gap:6px;
}
.hdr-btn{
  width:42px;height:42px;flex-shrink:0;
  border-radius:12px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:var(--tx);
  border:1px solid var(--bd);
  position:relative;
  transition:.15s;
}
.hdr-btn:active{transform:scale(.9);background:var(--bd)}
.hdr-btn .badge{
  position:absolute;top:-4px;right:-4px;
  min-width:18px;height:18px;padding:0 5px;
  background:var(--er);color:#fff;font-size:10px;font-weight:800;
  border-radius:100px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sf);
}
.hdr-title{
  flex:1;min-width:0;
  font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 4px;
}

.gal{
  position:relative;background:var(--sf);
  padding-bottom:10px;
}
.gal-track{
  display:flex;overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.gal-track::-webkit-scrollbar{display:none}
.gal-slide{
  flex:0 0 100%;
  scroll-snap-align:center;
  aspect-ratio:1;
  background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:140px;
  position:relative;
  user-select:none;
}
.gal-slide .zoomhint{
  position:absolute;bottom:10px;right:10px;
  background:rgba(0,0,0,.6);color:#fff;
  font-size:10px;padding:4px 8px;border-radius:100px;
  backdrop-filter:blur(4px);
}
.gal-disc{
  position:absolute;top:12px;left:12px;
  background:var(--er);color:#fff;
  font-size:13px;font-weight:900;
  padding:5px 10px;border-radius:8px;
  box-shadow:0 2px 8px rgba(239,68,68,.4);
}
.gal-fav{
  position:absolute;top:12px;right:12px;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.95);color:var(--tx);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;backdrop-filter:blur(6px);
  box-shadow:var(--sh2);
}
.gal-fav.on{color:var(--er)}
.gal-dots{
  display:flex;justify-content:center;gap:5px;
  padding:10px 0 0;
}
.gal-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--bd);transition:.2s;
}
.gal-dot.on{background:var(--pr);width:18px;border-radius:100px}
.gal-thumbs{
  display:flex;gap:6px;padding:8px 12px 0;
  overflow-x:auto;scrollbar-width:none;
}
.gal-thumbs::-webkit-scrollbar{display:none}
.gal-thumb{
  flex:0 0 54px;height:54px;border-radius:10px;
  background:var(--sf2);border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.gal-thumb.on{border-color:var(--pr)}

.card{
  background:var(--sf);border-radius:16px;
  padding:14px;margin:10px 12px;
  border:1px solid var(--bd);
}
.card.np{padding:0;overflow:hidden}

.p-price-block{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.p-price{
  font-size:26px;font-weight:900;
  color:var(--tx);line-height:1;
}
.p-price.disc{color:var(--er)}
.p-old{
  font-size:14px;color:var(--tx3);
  text-decoration:line-through;
}
.p-disc-badge{
  background:var(--er);color:#fff;
  font-size:11px;font-weight:900;
  padding:3px 7px;border-radius:6px;
}
.p-bonus{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--prL);color:var(--prD);
  font-size:11px;font-weight:800;
  padding:4px 8px;border-radius:6px;
  margin-bottom:8px;
}
[data-t="dark"] .p-bonus{color:var(--prL)}

.p-name{
  font-size:16px;font-weight:700;
  line-height:1.35;margin-bottom:8px;
}
.p-meta{
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--tx2);margin-bottom:10px;
  flex-wrap:wrap;
}
.p-meta .star{color:var(--or)}
.p-meta b{color:var(--tx);font-weight:700}
.p-sku{
  font-size:11px;color:var(--tx3);margin-top:4px;
}

.variant{margin-bottom:12px}
.variant-t{
  font-size:12px;font-weight:700;color:var(--tx2);
  margin-bottom:8px;
}
.variant-t b{color:var(--tx)}
.variant-opts{display:flex;flex-wrap:wrap;gap:8px}
.vo{
  padding:8px 14px;border-radius:10px;
  background:var(--sf2);border:1.5px solid var(--bd);
  font-size:13px;font-weight:600;color:var(--tx);
  min-height:38px;
  display:flex;align-items:center;justify-content:center;
}
.vo.on{background:var(--prL);border-color:var(--pr);color:var(--prD)}
[data-t="dark"] .vo.on{color:var(--prL)}
.vo:active{transform:scale(.95)}

.qty-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.qty-box{
  display:flex;align-items:center;gap:4px;
  background:var(--sf2);border-radius:12px;padding:4px;
  border:1px solid var(--bd);
}
.qty-btn{
  width:38px;height:38px;border-radius:9px;
  background:var(--sf);border:1px solid var(--bd);
  font-size:20px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  color:var(--tx);
}
.qty-btn:active{transform:scale(.9);background:var(--bd)}
.qty-btn:disabled{opacity:.4}
.qty-val{
  min-width:44px;text-align:center;
  font-size:16px;font-weight:800;
}
.qty-stock{
  font-size:12px;color:var(--tx2);
}
.qty-stock b{color:var(--pr);font-weight:800}

.buy-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{
  padding:14px;border-radius:12px;
  font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:50px;
}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--pr);color:#fff}
.btn-p:disabled{opacity:.5}
.btn-g{background:var(--sf2);color:var(--tx);border:1.5px solid var(--bd)}
.btn-a{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff}
.btn-full{width:100%}

.dlv-row{
  display:flex;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--bd);
  align-items:flex-start;
}
.dlv-row:last-child{border-bottom:none}
.dlv-ic{
  width:38px;height:38px;flex-shrink:0;
  border-radius:10px;background:var(--prL);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
[data-t="dark"] .dlv-ic{background:var(--prL)}
.dlv-body{flex:1;min-width:0}
.dlv-t{font-size:13px;font-weight:700;margin-bottom:2px}
.dlv-s{font-size:11.5px;color:var(--tx2);line-height:1.4}
.dlv-s b{color:var(--pr);font-weight:800}

.seller{
  display:flex;align-items:center;gap:12px;
}
.seller-av{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--pr),var(--prD));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:20px;flex-shrink:0;
}
.seller-inf{flex:1;min-width:0}
.seller-n{font-size:14px;font-weight:800;margin-bottom:2px}
.seller-s{font-size:11.5px;color:var(--tx2)}
.seller-s .star{color:var(--or)}
.seller-btn{
  padding:10px 14px;border-radius:10px;
  background:var(--sf2);border:1.5px solid var(--bd);
  font-size:12px;font-weight:800;color:var(--tx);
  flex-shrink:0;
}
.seller-btn:active{transform:scale(.95)}

.tabs{
  display:flex;background:var(--sf);border-bottom:1px solid var(--bd);
  position:sticky;top:calc(58px + var(--safe-t));z-index:35;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:100px;padding:14px 10px;
  font-size:13px;font-weight:700;color:var(--tx2);
  border-bottom:2.5px solid transparent;
  white-space:nowrap;position:relative;
}
.tab.on{color:var(--pr);border-bottom-color:var(--pr)}
.tab .count{
  display:inline-block;background:var(--sf2);color:var(--tx2);
  font-size:10px;font-weight:800;padding:2px 6px;border-radius:100px;
  margin-left:4px;
}
.tab.on .count{background:var(--pr);color:#fff}

.tab-content{padding:14px 12px 20px}

.desc{font-size:13.5px;line-height:1.7;color:var(--tx)}
.desc p{margin-bottom:10px}
.desc h4{font-size:14px;font-weight:800;margin:14px 0 8px;color:var(--tx)}
.desc ul{margin-left:18px;margin-bottom:10px}
.desc li{margin-bottom:5px}
.desc b{color:var(--tx)}
.desc .tag{
  display:inline-block;background:var(--prL);color:var(--prD);
  font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;
  margin-right:4px;margin-bottom:4px;
}
[data-t="dark"] .desc .tag{color:var(--prL)}

.chars{
  display:flex;flex-direction:column;
  border-radius:12px;overflow:hidden;
  background:var(--sf2);
}
.char{
  display:flex;justify-content:space-between;
  gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--bd);
  font-size:13px;
}
.char:last-child{border-bottom:none}
.char-k{color:var(--tx2);flex:1}
.char-v{font-weight:700;text-align:right;color:var(--tx)}
.char-group{
  font-size:11.5px;font-weight:800;color:var(--pr);
  background:var(--sf);padding:10px 14px 4px;
  text-transform:uppercase;letter-spacing:.5px;
}

.rev-summary{
  display:flex;gap:16px;align-items:center;
  padding:14px;background:var(--sf);border-radius:14px;
  margin-bottom:14px;border:1px solid var(--bd);
}
.rev-big{
  text-align:center;flex-shrink:0;
}
.rev-big-n{font-size:36px;font-weight:900;color:var(--pr);line-height:1}
.rev-big-s{font-size:11px;color:var(--tx2);margin-top:4px}
.rev-bars{flex:1;min-width:0}
.rev-bar{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--tx2);margin-bottom:3px;
}
.rev-bar-l{width:14px;font-weight:700;color:var(--tx)}
.rev-bar-t{
  flex:1;height:6px;background:var(--sf2);
  border-radius:100px;overflow:hidden;
}
.rev-bar-f{height:100%;background:var(--or);border-radius:100px}
.rev-bar-c{width:28px;text-align:right;font-weight:600}

.rev{
  padding:14px 0;border-bottom:1px solid var(--bd);
}
.rev:last-child{border-bottom:none}
.rev-h{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.rev-av{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--pr),var(--prD));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:14px;flex-shrink:0;
}
.rev-inf{flex:1;min-width:0}
.rev-n{font-size:13px;font-weight:800}
.rev-d{font-size:11px;color:var(--tx3);margin-top:2px}
.rev-stars{color:var(--or);font-size:12px;flex-shrink:0}
.rev-t{font-size:13.5px;line-height:1.6;margin-bottom:8px}
.rev-foot{
  display:flex;gap:14px;font-size:11.5px;color:var(--tx2);
}
.rev-foot button{color:var(--tx2);font-weight:700}

.qa{padding:14px 0;border-bottom:1px solid var(--bd)}
.qa:last-child{border-bottom:none}
.qa-q{
  display:flex;gap:10px;align-items:flex-start;
  margin-bottom:10px;
}
.qa-ic{
  width:28px;height:28px;border-radius:50%;
  background:var(--ac);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;flex-shrink:0;
}
.qa-ic.a{background:var(--pr)}
.qa-body{flex:1;font-size:13.5px;line-height:1.5}
.qa-who{font-size:11px;color:var(--tx3);margin-top:4px;font-weight:600}

.sim-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 12px 10px;
}
.sim-h h3{font-size:15px;font-weight:900}
.sim-h a{font-size:12px;color:var(--pr);font-weight:700;text-decoration:none}
.hscroll{
  display:flex;gap:10px;overflow-x:auto;
  padding:0 12px 16px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.hscroll::-webkit-scrollbar{display:none}
.pcard{
  flex:0 0 150px;
  background:var(--sf);border:1px solid var(--bd);
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
}
.pcard-img{
  aspect-ratio:1;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:52px;
}
.pcard-body{padding:8px;flex:1;display:flex;flex-direction:column}
.pcard-p{font-size:14px;font-weight:900;margin-bottom:2px}
.pcard-p.old{font-size:10.5px;color:var(--tx3);text-decoration:line-through;font-weight:500}
.pcard-n{
  font-size:11.5px;line-height:1.3;color:var(--tx);
  margin:4px 0;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.pcard-r{font-size:10.5px;color:var(--tx2);margin-bottom:6px}
.pcard-r .star{color:var(--or)}

.sticky{
  position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:var(--sf);border-top:1px solid var(--bd);
  padding:10px 12px calc(10px + var(--safe-b));
  max-width:640px;margin:0 auto;
  box-shadow:0 -4px 20px rgba(0,0,0,.08);
}
.sticky-inner{display:flex;gap:10px;align-items:center}
.sticky-price{flex:1;min-width:0}
.sticky-p{font-size:18px;font-weight:900;color:var(--tx);line-height:1.1}
.sticky-s{font-size:10.5px;color:var(--tx2);margin-top:2px}
.sticky-btn{
  padding:14px 22px;border-radius:12px;
  background:var(--pr);color:#fff;
  font-size:14px;font-weight:900;
  display:flex;align-items:center;gap:6px;
  min-height:50px;
}
.sticky-btn:active{transform:scale(.97)}
.sticky-btn.added{background:var(--sf2);color:var(--pr);border:1.5px solid var(--pr)}
.sticky-fav{
  width:50px;height:50px;border-radius:12px;
  background:var(--sf2);border:1.5px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.sticky-fav.on{color:var(--er)}

.md{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .15s;
}
.md.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.md-box{
  background:var(--sf);width:100%;max-width:640px;
  max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + var(--safe-b));
  animation:up .25s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.md-h{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;position:sticky;top:-18px;
  background:var(--sf);padding:8px 0;z-index:1;
}
.md-h h3{font-size:18px;font-weight:900}
.md-x{
  width:38px;height:38px;border-radius:50%;
  background:var(--sf2);font-size:18px;
  display:flex;align-items:center;justify-content:center;
}
.md-x:active{transform:scale(.9)}

.f{margin-bottom:12px}
.fl{
  display:block;font-size:12.5px;font-weight:700;
  color:var(--tx2);margin-bottom:6px;
}
.fl b{color:var(--er)}
.inp,.txa,.sel{
  width:100%;padding:12px 14px;
  background:var(--sf2);border:1.5px solid var(--bd);
  border-radius:10px;color:var(--tx);
  font-size:15px;font-weight:500;outline:none;
  font-family:inherit;
}
.inp:focus,.txa:focus,.sel:focus{border-color:var(--pr)}
.txa{resize:vertical;min-height:90px;line-height:1.5}
.sel{-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%2394A3B8'><path d='M7 10L2 5h10z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}

.stars-pick{
  display:flex;gap:6px;font-size:32px;
  justify-content:center;margin:8px 0 16px;
}
.star-p{
  color:var(--bd);
  transition:.15s;cursor:pointer;
  filter:grayscale(1);
}
.star-p.on{color:var(--or);filter:none}

.share-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.share-btn{
  padding:14px 8px;border-radius:12px;
  background:var(--sf2);border:1px solid var(--bd);
  display:flex;flex-direction:column;
  align-items:center;gap:6px;
  font-size:11px;font-weight:700;
  color:var(--tx);
}
.share-btn:active{transform:scale(.95)}
.share-ic{font-size:26px;line-height:1}

.tst{
  position:fixed;bottom:calc(130px + var(--safe-b));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--tx);color:var(--bg);
  padding:11px 20px;border-radius:100px;
  font-size:13px;font-weight:700;z-index:400;
  opacity:0;transition:.3s;pointer-events:none;
  max-width:90%;text-align:center;
  box-shadow:var(--sh2);
}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.o{background:var(--pr);color:#fff}
.tst.e{background:var(--er);color:#fff}

.sk{background:linear-gradient(90deg,var(--sf2) 25%,var(--sf3) 50%,var(--sf2) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:360px){
  .gal-slide{font-size:110px}

function loadLocal(){
  try{
    var c=localStorage.getItem('rayis_cart_'+UID);
    if(c)ST.cart=JSON.parse(c);
    var f=localStorage.getItem('rayis_fav_'+UID);
    if(f)ST.fav=JSON.parse(f);
  }catch(e){}
}
function saveCart(){localStorage.setItem('rayis_cart_'+UID,JSON.stringify(ST.cart));updateBadge();}
function saveFav(){localStorage.setItem('rayis_fav_'+UID,JSON.stringify(ST.fav));}

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function fmtN(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':' o');},2200);}
function closeMd(){document.getElementById('md').classList.remove('on');}
function openMd(){document.getElementById('md').classList.add('on');}
function getParam(k){return new URLSearchParams(window.location.search).get(k);}

function loadProduct(){
  var id=getParam('id')||'p001';
  var p=PRODUCTS.find(function(x){return x.id===id;});
  if(!p){
    document.getElementById('main').innerHTML='<div style="padding:60px 20px;text-align:center"><div style="font-size:64px;margin-bottom:10px">😕</div><div style="font-size:18px;font-weight:800">Mahsulot topilmadi</div><button class="btn btn-p" style="margin-top:20px;padding:14px 24px" onclick="goHome()">🏠 Bosh sahifa</button></div>';
    return;
  }
  ST.product=p;
  ST.qty=1;
  if(p.variants){
    Object.keys(p.variants).forEach(function(k){
      ST.variants[k]=p.variants[k][0];
    });
  }
  document.title=p.n+' — RAYIS';
  document.getElementById('hdrTitle').textContent=p.n;
  render();
  loadReviews();
  renderSimilar();
  updateSticky();
}

function updateSticky(){
  var p=ST.product;
  if(!p)return;
  document.getElementById('sticky').style.display='block';
  document.getElementById('stickyPrice').textContent=fmt(p.price*ST.qty);
  document.getElementById('stickyStock').textContent=ST.qty+' '+p.unit+' · '+p.seller;
  var fav=document.getElementById('stickyFav');
  fav.textContent=ST.fav[p.id]?'❤️':'🤍';
  fav.className='sticky-fav'+(ST.fav[p.id]?' on':'');
  var btn=document.getElementById('stickyBtn');
  if(ST.cart[p.id]){
    btn.textContent='✓ Savatda';
    btn.className='sticky-btn added';
  } else {
    btn.textContent='🛒 Savatga';
    btn.className='sticky-btn';
  }
}

function pickVariant(k,v){ST.variants[k]=v;render();}
function chQty(d){
  var p=ST.product;
  var max=Math.min(p.stock,99);
  ST.qty=Math.max(1,Math.min(max,ST.qty+d));
  document.getElementById('qtyVal').textContent=ST.qty;
  var btns=document.querySelectorAll('.qty-btn');
  btns[0].disabled=ST.qty<=1;
  btns[1].disabled=ST.qty>=max;
  updateSticky();
}
function addToCart(){
  var p=ST.product;
  if(!p)return;
  if(ST.cart[p.id])ST.cart[p.id]+=ST.qty;
  else ST.cart[p.id]=ST.qty;
  saveCart();
  render();
  toast('🛒 Savatga qo\'shildi ('+ST.qty+' '+p.unit+')','o');
}
function buyNow(){
  var p=ST.product;
  if(!p)return;
  if(!ST.cart[p.id])ST.cart[p.id]=ST.qty;
  saveCart();
  window.location.href='savat.html';
}
function toggleFav(){
  var p=ST.product;
  if(!p)return;
  if(ST.fav[p.id])delete ST.fav[p.id];
  else ST.fav[p.id]=true;
  saveFav();
  render();
  toast(ST.fav[p.id]?'❤️ Sevimlilarga qo\'shildi':'🤍 Olib tashlandi','o');
}

function onGalScroll(){
  var track=document.getElementById('galTrack');
  var idx=Math.round(track.scrollLeft/track.clientWidth);
  document.querySelectorAll('.gal-dot').forEach(function(d,i){
    d.classList.toggle('on',i===idx);
  });
  document.querySelectorAll('.gal-thumb').forEach(function(t,i){
    t.classList.toggle('on',i===idx);
  });
}
function goGal(i){
  var track=document.getElementById('galTrack');
  track.scrollTo({left:i*track.clientWidth,behavior:'smooth'});
}
function openZoom(i){
  var p=ST.product;
  var imgs=p.images||[p.e];
  var h='<div class="md-h"><h3>🖼 Rasm '+(i+1)+'/'+imgs.length+'</h3><button class="md-x" onclick="closeMd()">✕</button></div>';
  h+='<div style="aspect-ratio:1;background:var(--sf2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:200px">'+imgs[i]+'</div>';
  h+='<div style="display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px">';
  imgs.forEach(function(im,j){
    h+='<div class="gal-thumb '+(i===j?'on':'')+'" style="flex:0 0 60px;height:60px" onclick="closeMd();setTimeout(function(){openZoom('+j+')},200)">'+im+'</div>';
  });
  h+='</div>';
  document.getElementById('mdBox').innerHTML=h;
  openMd();
}

function renderTabs(){
  var p=ST.product;
  var h='<div class="tabs">';
  h+='<button class="tab '+(ST.tab==='desc'?'on':'')+'" onclick="setTab(\'desc\')">📝 Tavsif</button>';
  h+='<button class="tab '+(ST.tab==='chars'?'on':'')+'" onclick="setTab(\'chars\')">📋 Xususiyat</button>';
  h+='<button class="tab '+(ST.tab==='revs'?'on':'')+'" onclick="setTab(\'revs\')">⭐ Sharhlar<span class="count">'+(ST.reviews.length||p.reviews)+'</span></button>';
  h+='<button class="tab '+(ST.tab==='qa'?'on':'')+'" onclick="setTab(\'qa\')">❓ Savol</button>';
  h+='</div>';
  return h;
}
function setTab(t){
  ST.tab=t;
  document.querySelectorAll('.tab').forEach(function(el){
    var m={desc:'desc',chars:'chars',revs:'revs',qa:'qa'};
    el.classList.toggle('on',el.getAttribute('onclick').indexOf(m[t])>=0);
  });
  document.getElementById('tabContent').innerHTML=renderTabContent();
}
function renderTabContent(){
  var p=ST.product;
  if(ST.tab==='desc')return renderDesc();
  if(ST.tab==='chars')return renderChars();
  if(ST.tab==='revs')return renderRevs();
  if(ST.tab==='qa')return renderQA();
  return '';
}
function renderDesc(){
  var p=ST.product;
  var h='<div class="desc">';

  h+='<span class="tag">#RAYIS</span>';
  h+='<span class="tag">#Surxondaryo</span>';

function renderChars(){
  var p=ST.product;
  if(!p.chars||!p.chars.length)return '<div class="desc">Xususiyatlar mavjud emas</div>';
  var h='<div class="chars">';
  var curGroup='';
  p.chars.forEach(function(c){
    if(c.g&&c.g!==curGroup){
      h+='<div class="char-group">'+esc(c.g)+'</div>';
      curGroup=c.g;
    }
    h+='<div class="char"><div class="char-k">'+esc(c.k)+'</div><div class="char-v">'+esc(c.v)+'</div></div>';
  });
  h+='<div class="char"><div class="char-k">Artikul</div><div class="char-v">'+p.id.toUpperCase()+'</div></div>';
  h+='<div class="char"><div class="char-k">Birlik</div><div class="char-v">1 '+esc(p.unit)+'</div></div>';
  h+='<div class="char"><div class="char-k">Ishlab chiqaruvchi</div><div class="char-v">'+esc(p.seller)+'</div></div>';
  h+='</div>';
  return h;
}
function renderRevs(){
  var p=ST.product;
  var revs=ST.reviews;
  if(!ST.reviewsLoaded){
    return '<div style="text-align:center;padding:40px 20px;color:var(--tx2)">⏳ Sharhlar yuklanmoqda...</div>';
  }
  var h='';
  var counts={5:0,4:0,3:0,2:0,1:0};
  revs.forEach(function(r){counts[Math.round(r.rating)]=(counts[Math.round(r.rating)]||0)+1;});
  var total=revs.length||0;
  h+='<div class="rev-summary">';
  h+='<div class="rev-big">';
  h+='<div class="rev-big-n">'+(total?(revs.reduce(function(s,r){return s+r.rating;},0)/total).toFixed(1):p.rate)+'</div>';
  h+='<div class="rev-big-s">'+total+' ta sharh</div>';
  h+='</div>';
  h+='<div class="rev-bars">';
  [5,4,3,2,1].forEach(function(r){
    var cnt=counts[r]||0;
    var pct=total?Math.round(cnt/total*100):0;
    h+='<div class="rev-bar">';
    h+='<div class="rev-bar-l">'+r+'★</div>';
    h+='<div class="rev-bar-t"><div class="rev-bar-f" style="width:'+pct+'%"></div></div>';
    h+='<div class="rev-bar-c">'+cnt+'</div>';
    h+='</div>';
  });
  h+='</div></div>';
  
  h+='<button class="btn btn-p btn-full" style="margin-bottom:14px" onclick="openAddReview()">✍️ Sharh yozish</button>';
  
  if(!revs.length){
    h+='<div style="text-align:center;padding:30px 20px;color:var(--tx2);background:var(--sf);border-radius:14px">';
    h+='<div style="font-size:48px;margin-bottom:8px">💬</div>';
    h+='<div style="font-size:14px;font-weight:700">Hozircha sharh yo\'q</div>';
    h+='<div style="font-size:12px;margin-top:4px">Birinchi bo\'ling!</div>';
    h+='</div>';
  } else {
    revs.forEach(function(r){
      h+=renderRevItem(r);
    });
  }
  return h;
}
function renderRevItem(r){
  var h='<div class="rev">';
  h+='<div class="rev-h">';

  h+='<div class="rev-inf">';
  h+='<div class="rev-n">'+esc(r.name||'Mehmon')+'</div>';
  h+='<div class="rev-d">'+new Date(r.date||Date.now()).toLocaleDateString('uz-UZ')+'</div>';
  h+='</div>';
  h+='<div class="rev-stars">'+'★'.repeat(Math.round(r.rating))+'☆'.repeat(5-Math.round(r.rating))+'</div>';

}
function renderQA(){
  var p=ST.product;
  var h='';
  h+='<button class="btn btn-p btn-full" style="margin-bottom:14px" onclick="openAskQuestion()">❓ Savol berish</button>';

    h+='<div style="text-align:center;padding:30px 20px;color:var(--tx2)">Hozircha savol yo\'q</div>';
  } else {
    p.qa.forEach(function(q){

      h+='</div>';
      h+='<div class="qa-q">';
      h+='<div class="qa-ic a">J</div>';
      h+='<div class="qa-body">'+esc(q.a)+'</div>';
      h+='</div>';
      h+='</div>';

function loadReviews(){
  var p=ST.product;
  if(!p)return;
  ST.reviewsLoaded=false;
  if(!DB){ST.reviews=[];ST.reviewsLoaded=true;return;}
  DB.ref('reviews/'+p.id).on('value',function(snap){
    var data=snap.val()||{};
    var arr=[];
    Object.keys(data).forEach(function(k){arr.push(Object.assign({id:k},data[k]));});
    arr.sort(function(a,b){return (b.date||0)-(a.date||0);});
    ST.reviews=arr;
    ST.reviewsLoaded=true;
    if(ST.tab==='revs'){
      var tc=document.getElementById('tabContent');
      if(tc)tc.innerHTML=renderRevs();
    }
  });
}

function openAddReview(){
  ST.ratingPick=0;
  var h='<div class="md-h"><h3>✍️ Sharh yozish</h3><button class="md-x" onclick="closeMd()">✕</button></div>';
  h+='<div class="f"><label class="fl">Reyting <b>*</b></label><div class="stars-pick" id="starsPick">';
  for(var i=1;i<=5;i++)h+='<span class="star-p" data-i="'+i+'" onclick="pickStar('+i+')">★</span>';
  h+='</div></div>';
  h+='<div class="f"><label class="fl">Ismingiz <b>*</b></label><input class="inp" id="rvName" placeholder="Ism-familiya"></div>';
  h+='<div class="f"><label class="fl">Sharh <b>*</b></label><textarea class="txa" id="rvText" placeholder="Mahsulot haqida fikringiz..."></textarea></div>';
  h+='<button class="btn btn-p btn-full" style="margin-top:8px" onclick="submitReview()">📤 Yuborish</button>';
  document.getElementById('mdBox').innerHTML=h;
  openMd();
}
function pickStar(i){
  ST.ratingPick=i;
  document.querySelectorAll('.star-p').forEach(function(s,idx){s.classList.toggle('on',idx<i);});
}
function submitReview(){
  var n=document.getElementById('rvName').value.trim();
  var t=document.getElementById('rvText').value.trim();
  if(ST.ratingPick<1)return toast('Reyting tanlang','e');
  if(n.length<2)return toast('Ism kiriting','e');
  if(t.length<10)return toast('Sharh kamida 10 belgi','e');
  var rev={productId:ST.product.id,uid:UID,name:n,rating:ST.ratingPick,text:t,date:Date.now(),likes:0};
  if(!DB){toast('Firebase ulanmagan','e');return;}
  DB.ref('reviews/'+ST.product.id).push(rev)
    .then(function(){closeMd();toast('✅ Sharhingiz qabul qilindi!','o');ST.tab='revs';document.getElementById('tabContent').innerHTML=renderRevs();})
    .catch(function(e){toast('Xato: '+e.message,'e');});
}
function likeRev(id){
  if(!DB||!id)return;
  DB.ref('reviews/'+ST.product.id+'/'+id+'/likes').transaction(function(v){return (v||0)+1;});
  toast('👍 Rahmat!','o');
}

function openAskQuestion(){
  var h='<div class="md-h"><h3>❓ Savol berish</h3><button class="md-x" onclick="closeMd()">✕</button></div>';
  h+='<div class="f"><label class="fl">Ismingiz <b>*</b></label><input class="inp" id="qaName" placeholder="Ism"></div>';
  h+='<div class="f"><label class="fl">Savolingiz <b>*</b></label><textarea class="txa" id="qaText" placeholder="Savolingiz..."></textarea></div>';
  h+='<button class="btn btn-p btn-full" style="margin-top:8px" onclick="submitQuestion()">📤 Yuborish</button>';
  document.getElementById('mdBox').innerHTML=h;
  openMd();
}
function submitQuestion(){
  var n=document.getElementById('qaName').value.trim();
  var t=document.getElementById('qaText').value.trim();
  if(n.length<2)return toast('Ism kiriting','e');
  if(t.length<5)return toast('Savol kiriting','e');
  if(!DB){toast('Firebase ulanmagan','e');return;}
  DB.ref('questions/'+ST.product.id).push({productId:ST.product.id,uid:UID,name:n,question:t,answer:'',date:Date.now()})
    .then(function(){closeMd();toast('✅ Savolingiz yuborildi!','o');})
    .catch(function(e){toast('Xato: '+e.message,'e');});
}

function openShare(){
  var p=ST.product;
  if(!p)return;
  var url=window.location.href;
  var txt=p.n+' — '+fmt(p.price)+' | RAYIS';
  var h='<div class="md-h"><h3>📤 Ulashish</h3><button class="md-x" onclick="closeMd()">✕</button></div>';
  h+='<div class="share-grid">';
  h+='<button class="share-btn" onclick="shareTo(\'telegram\')"><span class="share-ic">✈️</span>Telegram</button>';
  h+='<button class="share-btn" onclick="shareTo(\'whatsapp\')"><span class="share-ic">💬</span>WhatsApp</button>';
  h+='<button class="share-btn" onclick="shareTo(\'viber\')"><span class="share-ic">📞</span>Viber</button>';
  h+='<button class="share-btn" onclick="shareTo(\'sms\')"><span class="share-ic">💌</span>SMS</button>';
  h+='<button class="share-btn" onclick="shareTo(\'email\')"><span class="share-ic">📧</span>Email</button>';
  h+='<button class="share-btn" onclick="shareTo(\'facebook\')"><span class="share-ic">📘</span>Facebook</button>';
  h+='<button class="share-btn" onclick="shareTo(\'copy\')"><span class="share-ic">📋</span>Nusxa</button>';
  h+='<button class="share-btn" onclick="shareTo(\'native\')"><span class="share-ic">📱</span>Boshqa</button>';
  h+='</div>';
  document.getElementById('mdBox').innerHTML=h;
  openMd();
}
function shareTo(t){
  var p=ST.product;
  var url=window.location.href;
  var txt=p.n+' — '+fmt(p.price)+' | RAYIS';
  if(t==='telegram')window.open('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt),'_blank');
  else if(t==='whatsapp')window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+url),'_blank');
  else if(t==='viber')window.open('viber://forward?text='+encodeURIComponent(txt+' '+url),'_blank');
  else if(t==='sms')window.location.href='sms:?body='+encodeURIComponent(txt+' '+url);
  else if(t==='email')window.location.href='mailto:?subject='+encodeURIComponent(p.n)+'&body='+encodeURIComponent(txt+' '+url);
  else if(t==='facebook')window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank');
  else if(t==='copy'){
    if(navigator.clipboard)navigator.clipboard.writeText(txt+' '+url).then(function(){toast('✅ Nusxalandi','o');});
  }
  else if(t==='native'){
    if(navigator.share)navigator.share({title:p.n,text:txt,url:url}).catch(function(){});
    else toast('Qurilma qo\'llab-quvvatlamaydi','e');
  }
  if(t!=='copy'&&t!=='native')setTimeout(closeMd,300);
}

function openInstallment(){
  var p=ST.product;
  var total=p.price*ST.qty;
  var monthly=Math.round(total/12);
  var h='<div class="md-h"><h3>💳 Nasiya / Muddatli to\'lov</h3><button class="md-x" onclick="closeMd()">✕</button></div>';
  h+='<div style="background:linear-gradient(135deg,var(--pr),var(--prD));border-radius:16px;padding:20px;color:#fff;text-align:center;margin-bottom:16px">';
  h+='<div style="font-size:11px;opacity:.9">Oylik to\'lov</div>';
  h+='<div style="font-size:32px;font-weight:900;margin:6px 0">'+fmt(monthly)+'</div>';
  h+='<div style="font-size:12px;opacity:.9">12 oy davomida</div>';
  h+='</div>';
  h+='<div class="f"><label class="fl">Muddat</label><select class="sel" id="instMonths" onchange="calcInst()"><option value="3">3 oy</option><option value="6">6 oy</option><option value="9">9 oy</option><option value="12" selected>12 oy</option><option value="18">18 oy</option><option value="24">24 oy</option></select></div>';
  h+='<div class="f"><label class="fl">Boshlang\'ich to\'lov</label><input class="inp" type="number" id="instDown" value="0" oninput="calcInst()" placeholder="0"></div>';
  h+='<div style="background:var(--sf2);border-radius:12px;padding:14px;margin-bottom:16px">';
  h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>Mahsulot narxi</span><b>'+fmt(total)+'</b></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>Boshlang\'ich</span><b id="instDownVal">0 so\'m</b></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>Muddat</span><b id="instMonthsVal">12 oy</b></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:900;color:var(--pr);margin-top:8px;padding-top:8px;border-top:2px solid var(--bd)"><span>Oylik</span><b id="instMonthlyVal">'+fmt(monthly)+'</b></div>';
  h+='</div>';
  h+='<div style="font-size:11.5px;color:var(--tx2);line-height:1.6;margin-bottom:14px">💡 Nasiya <b>Uzum Nasiya</b>, <b>Payme Nasiya</b> yoki <b>bank kartasi</b> orqali.</div>';
  h+='<button class="btn btn-p btn-full" onclick="applyInstallment()">📝 Ariza berish</button>';
  document.getElementById('mdBox').innerHTML=h;
  openMd();
}
function calcInst(){
  var p=ST.product;
  var total=p.price*ST.qty;
  var m=parseInt(document.getElementById('instMonths').value)||12;
  var down=parseFloat(document.getElementById('instDown').value)||0;
  var remain=Math.max(0,total-down);
  var monthly=Math.round(remain/m);
  document.getElementById('instDownVal').textContent=fmt(down);
  document.getElementById('instMonthsVal').textContent=m+' oy';
  document.getElementById('instMonthlyVal').textContent=fmt(monthly);
}
function applyInstallment(){
  closeMd();
  toast('✅ Ariza qabul qilindi! Operator qo\'ng\'iroq qiladi','o');
}

function renderSimilar(){
  var p=ST.product;
  if(!p)return;
  var similar=PRODUCTS.filter(function(x){return x.cat===p.cat&&x.id!==p.id;}).slice(0,8);
  var others=PRODUCTS.filter(function(x){return x.cat!==p.cat&&x.id!==p.id;}).sort(function(){return Math.random()-0.5;}).slice(0,8);
  var h='';
  if(similar.length){
    h+='<div class="sim-h"><h3>🔁 O\'xshash mahsulotlar</h3><a href="katalog.html?cat='+p.cat+'">Barchasi →</a></div>';
    h+='<div class="hscroll">';
    similar.forEach(function(s){h+=renderPCard(s);});
    h+='</div>';
  }
  if(others.length){
    h+='<div class="sim-h"><h3>💡 Sizga yoqishi mumkin</h3></div>';
    h+='<div class="hscroll">';
    others.forEach(function(s){h+=renderPCard(s);});
    h+='</div>';
  }
  document.getElementById('similarWrap').innerHTML=h;
}
function renderPCard(s){
  var disc=s.old>s.price?Math.round((1-s.price/s.old)*100):0;
  var h='<div class="pcard" onclick="openProduct(\''+s.id+'\')">';
  h+='<div class="pcard-img" style="position:relative">';
  if(disc>0)h+='<div style="position:absolute;top:6px;left:6px;background:var(--er);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:5px">-'+disc+'%</div>';
  h+=s.e;
  h+='</div>';
  h+='<div class="pcard-body">';
  h+='<div class="pcard-p">'+fmt(s.price)+'</div>';
  if(disc>0)h+='<div class="pcard-p old">'+fmt(s.old)+'</div>';
  h+='<div class="pcard-n">'+esc(s.n)+'</div>';
  h+='<div class="pcard-r"><span class="star">★</span> '+s.rate+' · '+s.reviews+'</div>';
  h+='</div>';
  h+='</div>';
  return h;
}
function openProduct(id){window.location.href='mahsulot.html?id='+id;}

function openCart(){window.location.href='savat.html';}

function updateBadge(){
  var total=0;
  Object.keys(ST.cart).forEach(function(k){total+=ST.cart[k];});
  var b=document.getElementById('cartBadge');
  if(!b)return;
  if(total>0){b.style.display='flex';b.textContent=total;}
