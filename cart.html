<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYIS BOZORI — Savat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; }
  body { background:#0b0f1a; color:#fff; min-height:100vh; padding-bottom:200px; }
  .header { background:#0f1626; border-bottom:1px solid rgba(255,255,255,0.06); padding:12px 16px; position:sticky; top:0; z-index:100; }
  .htop { display:flex; align-items:center; gap:10px; }
  .back { font-size:22px; cursor:pointer; color:#8b9ab8; }
  .title { font-size:16px; font-weight:800; flex:1; }
  .count-badge { background:rgba(0,91,255,0.15); border:1px solid rgba(0,91,255,0.3); padding:5px 12px; border-radius:20px; font-size:11px; color:#60a5fa; font-weight:800; }
  .section { padding:16px; }
  .citem { background:#131a2b; border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:12px; margin-bottom:10px; }
  .citem-row { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .citem-img { width:70px; height:70px; background:linear-gradient(135deg,#1a2337,#0f1626); border-radius:12px; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:32px; }
  .citem-img img { width:100%; height:100%; object-fit:cover; }
  .citem-info { flex:1; min-width:0; }
  .citem-name { font-size:13px; font-weight:700; margin-bottom:4px; line-height:1.3; }
  .citem-variant { font-size:11px; color:#60a5fa; margin-bottom:4px; font-weight:600; }
  .citem-price { font-size:14px; font-weight:900; color:#34d399; }
  .citem-unit { font-size:11px; color:#5b6b8a; }
  .citem-foot { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px dashed rgba(255,255,255,0.08); }
  .qty-controls { display:flex; align-items:center; gap:10px; }
  .qbtn { width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff; font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qbtn:active { transform:scale(0.92); }
  .qbtn.minus { color:#f87171; }
  .qbtn.plus { color:#34d399; }
  .qnum { font-size:14px; font-weight:800; min-width:24px; text-align:center; }
  .rm-btn { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:7px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; }
  .citem-total { font-size:12px; color:#8b9ab8; }
  .citem-total b { color:#fff; font-size:14px; }
  .promo-block { background:#131a2b; border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:14px; margin-bottom:14px; }
  .promo-block.applied { border-color:rgba(52,211,153,0.4); background:rgba(52,211,153,0.04); }
  .promo-title { font-size:13px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .promo-row { display:flex; gap:8px; }
  .promo-row input { flex:1; padding:13px 14px; background:#0f1626; border:1px solid rgba(255,255,255,0.08); border-radius:12px; color:#fff; font-size:14px; outline:none; font-family:inherit; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .promo-row input:focus { border-color:#005bff; }
  .promo-row input::placeholder { color:#4b5876; letter-spacing:0; font-weight:400; }
  .promo-row button { padding:13px 20px; background:linear-gradient(135deg,#005bff,#0047cc); border:none; border-radius:12px; color:#fff; font-size:13px; font-weight:800; cursor:pointer; }
  .promo-applied { display:flex; justify-content:space-between; align-items:center; }
  .promo-applied-info { display:flex; align-items:center; gap:10px; }
  .promo-applied-code { background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.3); color:#34d399; padding:6px 12px; border-radius:10px; font-size:13px; font-weight:900; letter-spacing:1px; }
  .promo-applied-text { font-size:12px; color:#34d399; font-weight:700; }
  .promo-remove { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:6px 10px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; }
  .promo-error { color:#f87171; font-size:12px; margin-top:8px; text-align:center; min-height:16px; }
  .promo-hint { font-size:11px; color:#5b6b8a; margin-top:6px; }
  .promo-hint b { color:#60a5fa; }
  .form-title { font-size:15px; font-weight:800; margin-bottom:14px; }
  .ig { margin-bottom:14px; }
  .ig label { display:block; font-size:12px; color:#8b9ab8; margin-bottom:6px; font-weight:600; }
  .ig input, .ig textarea { width:100%; padding:13px 14px; background:#0f1626; border:1px solid rgba(255,255,255,0.08); border-radius:12px; color:#fff; font-size:14px; outline:none; font-family:inherit; }
  .ig input:focus, .ig textarea:focus { border-color:#005bff; }
  .ig input::placeholder, .ig textarea::placeholder { color:#4b5876; }
  .ig textarea { resize:vertical; min-height:70px; }
  .pay-opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pay-opt { padding:14px; background:#0f1626; border:2px solid rgba(255,255,255,0.08); border-radius:12px; text-align:center; cursor:pointer; transition:all 0.2s; }
  .pay-opt.sel { border-color:#005bff; background:rgba(0,91,255,0.08); }
  .pay-opt .ic { font-size:22px; margin-bottom:4px; }
  .pay-opt .nm { font-size:12px; font-weight:700; }
  .btn { padding:15px; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; width:100%; }
  .btn-primary { background:linear-gradient(135deg,#005bff,#0047cc); color:#fff; }
  .btn-secondary { background:#1a2337; color:#cbd5e1; border:1px solid rgba(255,255,255,0.08); margin-top:8px; }
  .bottom-bar { position:fixed; bottom:60px; left:0; right:0; background:#0f1626; border-top:1px solid rgba(255,255,255,0.06); padding:12px 16px; z-index:150; box-shadow:0 -10px 30px rgba(0,0,0,0.5); }
  .total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .total-row .lbl { font-size:13px; color:#8b9ab8; }
  .total-row .val { font-size:14px; font-weight:700; color:#cbd5e1; }
  .total-row.discount .val { color:#34d399; }
  .total-row.grand { border-top:1px dashed rgba(255,255,255,0.08); padding-top:8px; margin-top:8px; margin-bottom:12px; }
  .total-row.grand .lbl { font-size:14px; font-weight:800; color:#fff; }
  .total-row.grand .val { font-size:22px; font-weight:900; color:#34d399; letter-spacing:-0.5px; }
  .empty { padding:80px 20px; text-align:center; color:#5b6b8a; }
  .empty .ic { font-size:64px; margin-bottom:14px; opacity:0.5; }
  .empty h3 { font-size:16px; color:#cbd5e1; margin-bottom:8px; font-weight:700; }
  .empty p { font-size:13px; line-height:1.6; margin-bottom:20px; }
  .empty button { background:linear-gradient(135deg,#005bff,#0047cc); color:#fff; border:none; padding:14px 28px; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:#005bff; color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:9999; transition:transform 0.3s; max-width:90%; text-align:center; box-shadow:0 10px 30px rgba(0,91,255,0.4); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.ok { background:#10b981; }
  .toast.err { background:#ef4444; }
  .nav { position:fixed; bottom:0; left:0; right:0; background:#0f1626; border-top:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-around; padding:10px 0 max(10px,env(safe-area-inset-bottom)); z-index:200; }
  .nav-i { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#5b6b8a; cursor:pointer; flex:1; padding:4px; position:relative; }
  .nav-i.active { color:#60a5fa; }
  .nav-i .ic { font-size:20px; }
  .nav-i .nc { position:absolute; top:0; right:25%; background:#ff3b30; color:#fff; font-size:9px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="htop">
    <div class="back" onclick="location.href='home.html'">←</div>
    <div class="title">Savat</div>
    <div class="count-badge" id="countBadge">0 ta</div>
  </div>
</div>

<div id="content"></div>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="total-row">
    <div class="lbl">Mahsulotlar:</div>
    <div class="val" id="sumProducts">0 so'm</div>
  </div>
  <div class="total-row discount" id="discountRow" style="display:none">
    <div class="lbl">🎁 Chegirma (<span id="discountCodeLbl"></span>):</div>
    <div class="val" id="sumDiscount">0 so'm</div>
  </div>
  <div class="total-row grand">
    <div class="lbl">Umumiy:</div>
    <div class="val" id="totalVal">0 so'm</div>
  </div>
  <button class="btn btn-primary" onclick="openCheckout()">Buyurtma berish →</button>
</div>

<div class="nav">
  <div class="nav-i" onclick="location.href='home.html'"><div class="ic">🏠</div><div>Bosh</div></div>
  <div class="nav-i" onclick="location.href='search.html'"><div class="ic">🔍</div><div>Qidiruv</div></div>
  <div class="nav-i active"><div class="ic">🛒</div><div>Savat</div><div class="nc" id="navCartCnt" style="display:none">0</div></div>
  <div class="nav-i" onclick="location.href='orders.html'"><div class="ic">📦</div><div>Buyurtma</div></div>
  <div class="nav-i" onclick="location.href='profile.html'"><div class="ic">👤</div><div>Profil</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
let cart = [];
let view = 'cart';
let payMethod = 'naqd';
let appliedPromo = null;

try { cart = JSON.parse(localStorage.getItem('rayis_cart') || '[]'); } catch(e) { cart = []; }
if (!Array.isArray(cart)) cart = [];

try {
  const savedPromo = localStorage.getItem('rayis_applied_promo');
  if (savedPromo) appliedPromo = JSON.parse(savedPromo);
} catch(e) {}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function fmt(p) { return (Number(p)||0).toLocaleString('uz-UZ').replace(/,/g,' ') + " so'm"; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function productsTotal() { return cart.reduce((s, i) => s + (Number(i.price)||0) * (Number(i.qty)||1), 0); }
function discountAmount() {
  if (!appliedPromo) return 0;
  const pTotal = productsTotal();
  if (appliedPromo.type === 'percent') return Math.round(pTotal * appliedPromo.value / 100);
  else return Math.min(appliedPromo.value, pTotal);
}
function grandTotal() { return Math.max(0, productsTotal() - discountAmount()); }
function saveCart() { try { localStorage.setItem('rayis_cart', JSON.stringify(cart)); } catch(e) {} }
function updateCount() {
  const cnt = Math.round(cart.reduce((s, i) => s + (Number(i.qty)||0), 0));
  document.getElementById('countBadge').textContent = cnt + ' ta';
  const nav = document.getElementById('navCartCnt');
  if (cnt > 0) { nav.textContent = cnt > 99 ? '99+' : cnt; nav.style.display = 'flex'; }
  else { nav.style.display = 'none'; }
}
function changeQty(cartKey, delta) {
  const item = cart.find(i => i.cartKey === cartKey || String(i.id) === String(cartKey));
  if (!item) return;
  item.qty = (Number(item.qty) || 1) + delta;
  if (item.qty <= 0) cart = cart.filter(i => i !== item);
  saveCart();
  render();
}
function removeItem(cartKey) {
  if (!confirm('O\'chirishni tasdiqlaysizmi?')) return;
  cart = cart.filter(i => i.cartKey !== cartKey && String(i.id) !== String(cartKey));
  saveCart();
  render();
  toast('🗑 O\'chirildi', 'ok');
}
function getPromos() {
  let all = [];
  try { all = JSON.parse(localStorage.getItem('rayis_promos') || '[]'); } catch(e) {}
  if (!Array.isArray(all)) return [];
  if (all.length === 0) {
    return [
      { code: 'RAYIS10', type: 'percent', value: 10, active: true, used: false },
      { code: 'RAYIS20', type: 'percent', value: 20, active: true, used: false },
      { code: 'YANGI50', type: 'percent', value: 50, active: true, used: false },
      { code: 'BEPUL10K', type: 'fixed', value: 10000, active: true, used: false }
    ];
  }
  return all;
}
function applyPromo() {
  const inp = document.getElementById('promoInput');
  const err = document.getElementById('promoError');
  const code = (inp.value || '').trim().toUpperCase();
  err.textContent = '';
  if (!code) { err.textContent = 'Kodni kiriting'; return; }
  if (cart.length === 0) { err.textContent = 'Savat bo\'sh'; return; }
  const promos = getPromos();
  const found = promos.find(p => p.code === code && p.active !== false && !p.used);
  if (!found) { err.textContent = '❌ Kod noto\'g\'ri yoki muddati tugagan'; return; }
  appliedPromo = found;
  try { localStorage.setItem('rayis_applied_promo', JSON.stringify(found)); } catch(e) {}
  toast('✅ Kod qo\'llandi: ' + found.code, 'ok');
  render();
}
function removePromo() {
  appliedPromo = null;
  try { localStorage.removeItem('rayis_applied_promo'); } catch(e) {}
  toast('Promo-kod olib tashlandi');
  render();
}

function render() {
  updateCount();
  const c = document.getElementById('content');
  const bb = document.getElementById('bottomBar');

  if (view === 'checkout') { bb.style.display = 'none'; c.innerHTML = getCheckoutHTML(); return; }

  if (cart.length === 0) {
    bb.style.display = 'none';
    c.innerHTML = '<div class="empty"><div class="ic">🛒</div><h3>Savat bo\'sh</h3><p>Mahsulot qidirib, savatga qo\'shing</p><button onclick="location.href=\'search.html\'">🔍 Xarid qilish</button></div>';
    return;
  }

  bb.style.display = 'block';
  document.getElementById('sumProducts').textContent = fmt(productsTotal());
  const d = discountAmount();
  if (d > 0 && appliedPromo) {
    document.getElementById('discountRow').style.display = 'flex';
    document.getElementById('discountCodeLbl').textContent = appliedPromo.code;
    document.getElementById('sumDiscount').textContent = '−' + fmt(d);
  } else {
    document.getElementById('discountRow').style.display = 'none';
  }
  document.getElementById('totalVal').textContent = fmt(grandTotal());

  let html = '<div class="section">';
  cart.forEach(it => {
    const img = (it.images && it.images[0]) ? '<img src="' + it.images[0] + '">' : (it.emoji || '📦');
    const qty = Number(it.qty) || 1;
    const sum = (Number(it.price)||0) * qty;
    const key = it.cartKey || it.id;
    html += '<div class="citem">' +
      '<div class="citem-row">' +
        '<div class="citem-img">' + img + '</div>' +
        '<div class="citem-info">' +
          '<div class="citem-name">' + esc(it.name) + '</div>' +
          (it.variantText ? '<div class="citem-variant">' + esc(it.variantText) + '</div>' : '') +
          '<div class="citem-price">' + fmt(it.price) + '</div>' +
          '<div class="citem-unit">1 ' + esc(it.unit||'dona') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="citem-foot">' +
        '<div class="qty-controls">' +
          '<button class="qbtn minus" onclick="changeQty(\'' + key + '\',-1)">−</button>' +
          '<span class="qnum">' + qty + '</span>' +
          '<button class="qbtn plus" onclick="changeQty(\'' + key + '\',1)">+</button>' +
        '</div>' +
        '<div class="citem-total">Jami: <b>' + fmt(sum) + '</b></div>' +
        '<button class="rm-btn" onclick="removeItem(\'' + key + '\')">🗑</button>' +
      '</div>' +
    '</div>';
  });

  html += '<div class="promo-block ' + (appliedPromo ? 'applied' : '') + '">';
  if (appliedPromo) {
    const d = discountAmount();
    const dText = appliedPromo.type === 'percent' ? appliedPromo.value + '% chegirma' : fmt(appliedPromo.value) + ' chegirma';
    html += '<div class="promo-title">🎁 Promo-kod qo\'llandi</div>' +
      '<div class="promo-applied">' +
        '<div class="promo-applied-info">' +
          '<div class="promo-applied-code">' + esc(appliedPromo.code) + '</div>' +
          '<div class="promo-applied-text">' + dText + ' (−' + fmt(d) + ')</div>' +
        '</div>' +
        '<button class="promo-remove" onclick="removePromo()">✕</button>' +
      '</div>';
  } else {
    html += '<div class="promo-title">🎁 Promo-kod</div>' +
      '<div class="promo-row">' +
        '<input type="text" id="promoInput" placeholder="Kodni kiriting..." maxlength="20" onkeydown="if(event.key===\'Enter\'){event.preventDefault();applyPromo();}">' +
        '<button type="button" onclick="applyPromo()">Qo\'llash</button>' +
      '</div>' +
      '<div class="promo-error" id="promoError"></div>' +
      '<div class="promo-hint">Sinab ko\'ring: <b>RAYIS10</b>, <b>RAYIS20</b>, <b>YANGI50</b>, <b>BEPUL10K</b></div>';
  }
  html += '</div>';
  html += '</div>';
  c.innerHTML = html;
}

function getCheckoutHTML() {
  const user = JSON.parse(localStorage.getItem('rayis_user') || '{}');
  const name = ((user.firstName || '') + ' ' + (user.lastName || '')).trim();
  const region = user.region || '';
  const d = discountAmount();
  const sub = productsTotal();
  const grand = grandTotal();

  return '<div class="section">' +
    '<div class="form-title">Buyurtma ma\'lumotlari</div>' +
    '<div class="ig"><label>Ism-familiya *</label><input type="text" id="cName" placeholder="Ali Valiyev" value="' + esc(name) + '"></div>' +
    '<div class="ig"><label>Telefon raqam *</label><input type="tel" id="cPhone" placeholder="+998 90 123 45 67"></div>' +
    '<div class="ig"><label>Manzil *</label><textarea id="cAddr" placeholder="' + (region ? region + ', ' : '') + 'ko\'cha, uy raqami">' + (region ? esc(region) + ', ' : '') + '</textarea></div>' +
    '<div class="ig"><label>To\'lov usuli</label>' +
      '<div class="pay-opts">' +
        '<div class="pay-opt ' + (payMethod === 'naqd' ? 'sel' : '') + '" onclick="setPay(\'naqd\')"><div class="ic">💵</div><div class="nm">Naqd pul</div></div>' +
        '<div class="pay-opt ' + (payMethod === 'karta' ? 'sel' : '') + '" onclick="setPay(\'karta\')"><div class="ic">💳</div><div class="nm">Plastik karta</div></div>' +
      '</div>' +
    '</div>' +
    '<div style="background:#0f1626;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-bottom:14px">' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#8b9ab8;padding:4px 0"><span>Mahsulotlar (' + cart.length + '):</span><span style="color:#fff;font-weight:700">' + fmt(sub) + '</span></div>' +
      (d > 0 ? '<div style="display:flex;justify-content:space-between;font-size:12px;color:#34d399;padding:4px 0"><span>🎁 Chegirma (' + esc(appliedPromo.code) + '):</span><span style="font-weight:700">−' + fmt(d) + '</span></div>' : '') +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#8b9ab8;padding:4px 0"><span>Yetkazish:</span><span style="color:#fff;font-weight:700">Bepul</span></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:14px;padding-top:8px;margin-top:6px;border-top:1px dashed rgba(255,255,255,0.08)"><span style="color:#8b9ab8">Jami:</span><span style="color:#34d399;font-weight:900;font-size:16px">' + fmt(grand) + '</span></div>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="placeOrder()">✅ Buyurtmani tasdiqlash</button>' +
    '<button class="btn btn-secondary" onclick="backToCart()">← Savatga qaytish</button>' +
  '</div>';
}

function setPay(m) { payMethod = m; render(); }
function backToCart() { view = 'cart'; render(); }
function openCheckout() {
  if (cart.length === 0) return toast('Savat bo\'sh', 'err');
  view = 'checkout';
  render();
  window.scrollTo(0, 0);
}

// ✅ TUZATILGAN: To'lov sahifasiga yo'naltirish
function placeOrder() {
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const addr = document.getElementById('cAddr').value.trim();

  if (!name || name.length < 2) return toast('Ismingizni kiriting', 'err');
  if (!phone || phone.length < 7) return toast('Telefon raqamni kiriting', 'err');
  if (!addr || addr.length < 5) return toast('Manzilni kiriting', 'err');

  const oid = 'ORD' + Date.now();
  const d = discountAmount();
  const grand = grandTotal();

  const order = {
    id: oid,
    items: cart.map(i => ({ ...i })),
    total: grand,
    subtotal: productsTotal(),
    discount: d,
    promoCode: appliedPromo ? appliedPromo.code : null,
    customer: { name, phone, address: addr },
    payment: payMethod,
    paymentStatus: 'pending',
    status: 'yangi',
    createdAt: new Date().toISOString()
  };

  let orders = [];
  try { orders = JSON.parse(localStorage.getItem('rayis_orders') || '[]'); } catch(e) {}
  if (!Array.isArray(orders)) orders = [];
  orders.unshift(order);

  try { localStorage.setItem('rayis_orders', JSON.stringify(orders)); }
  catch(e) { return toast('Xotira to\'ldi', 'err'); }

  // Promo-kodni "ishlatilgan" deb belgilash
  if (appliedPromo) {
    let promos = [];
    try { promos = JSON.parse(localStorage.getItem('rayis_promos') || '[]'); } catch(e) {}
    if (Array.isArray(promos) && promos.length > 0) {
      const idx = promos.findIndex(p => p.code === appliedPromo.code);
      if (idx !== -1) {
        promos[idx].used = true;
        promos[idx].usedAt = new Date().toISOString();
        promos[idx].usedInOrder = oid;
        try { localStorage.setItem('rayis_promos', JSON.stringify(promos)); } catch(e) {}
      }
    }
  }

  // Savatni tozalash
  cart = [];
  saveCart();
  appliedPromo = null;
  try { localStorage.removeItem('rayis_applied_promo'); } catch(e) {}

  // ✅ TO'LOV SAHIFASIGA YO'NALTIRISH
  location.href = 'payment.html?order=' + oid;
}

render();
</script>
</body>
</html>
