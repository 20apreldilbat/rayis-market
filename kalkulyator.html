<style>
:root{--bg:#0B1119;--sf:#151C26;--sf2:#1E2733;--bd:#2A3441;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--pr:#10B981;--pr2:#34D399;--prS:#064E3B;--ac:#3B82F6;--acS:#1E3A8A;--er:#EF4444}
[data-t="light"]{--bg:#F5F7FA;--sf:#FFF;--sf2:#EEF2F7;--bd:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;--prS:#ECFDF5;--acS:#EFF6FF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:100px}
.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{display:flex;align-items:center;gap:8px;padding:10px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;position:sticky;top:8px;z-index:40}
.hb{width:40px;height:40px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--tx);flex-shrink:0}
.hb:active{transform:scale(.92)}
.ht{flex:1;min-width:0}
.ht1{font-size:15px;font-weight:800}
.ht2{font-size:11px;color:var(--tx2);margin-top:2px}
.prog{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:11px;margin-bottom:12px}
.pi{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-bottom:8px;font-weight:600}
.pi .c{color:var(--pr2);font-weight:800}
.pb{display:flex;gap:3px}
.pbs{flex:1;height:4px;background:var(--sf2);border-radius:2px;transition:.4s}
.pbs.d{background:var(--pr2)}
.pbs.a{background:var(--pr2);animation:pl 1.5s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
.sh{margin-bottom:14px}
.sn{display:inline-block;padding:3px 9px;background:var(--prS);color:var(--pr2);font-size:11px;font-weight:800;border-radius:6px;margin-bottom:6px}
.st{font-size:22px;font-weight:800;line-height:1.15;margin-bottom:3px}
.sd{font-size:13px;color:var(--tx2)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.f{margin-bottom:12px}
.f:last-child{margin-bottom:0}
.fl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fl .hint{color:var(--tx3);font-weight:400;font-size:11px}
.inp,.sel{width:100%;padding:12px 14px;background:var(--sf2);border:2px solid transparent;border-radius:10px;color:var(--tx);font-size:15px;font-weight:600;font-family:inherit;outline:none}
.inp:focus,.sel:focus{border-color:var(--pr2)}
.sel{-webkit-appearance:none;cursor:pointer;padding-right:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%2394A3B8'><path d='M7 10L2 5h10z'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.opts{display:grid;gap:8px}
.opts.t{grid-template-columns:1fr 1fr}
.opts.th{grid-template-columns:1fr 1fr 1fr}
.opt{background:var(--sf2);border:2px solid transparent;border-radius:10px;padding:12px;cursor:pointer;text-align:center;position:relative;user-select:none}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--pr2);background:var(--prS)}
.opt.on::after{content:"✓";position:absolute;top:5px;right:8px;color:var(--pr2);font-weight:900;font-size:13px}
.oi{font-size:24px;margin-bottom:4px;line-height:1}
.ot{font-size:12.5px;font-weight:700;line-height:1.25}
.od{font-size:10.5px;color:var(--tx2);margin-top:2px}
.chk{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sf2);border:2px solid transparent;border-radius:10px;margin-bottom:8px;cursor:pointer}
.chk.on{border-color:var(--pr2);background:var(--prS)}
.chk input{width:22px;height:22px;accent-color:var(--pr2);cursor:pointer}
.chk-lbl{flex:1;font-size:13.5px;font-weight:700}
.chk-sub{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:400}
.info{background:var(--acS);border-left:3px solid var(--ac);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.info b{color:var(--ac)}
.auto-hint{background:rgba(46,204,113,.1);border-left:3px solid var(--pr2);border-radius:8px;padding:8px 10px;font-size:11.5px;color:#8DF0B5;margin-top:6px;line-height:1.6}
.auto-hint b{color:var(--pr2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btns.one{grid-template-columns:1fr}
.btn{padding:13px;border-radius:10px;border:none;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.bg{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.ba{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.bsm{padding:9px 12px;min-height:38px;font-size:12px}
.hero{background:linear-gradient(135deg,var(--pr2),var(--pr));border-radius:24px;padding:26px 18px;text-align:center;color:#fff;margin-bottom:14px;box-shadow:0 12px 32px rgba(16,185,129,.3)}
.hl{font-size:12px;font-weight:600;opacity:.95;margin-bottom:4px}
.hv{font-size:26px;font-weight:900;line-height:1.1;word-break:break-word}
.hr{font-size:11px;opacity:.9;margin-top:6px}
.hs{font-size:11px;opacity:.85;margin-top:3px}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;overflow:hidden}
.sch{padding:11px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--sf2)}
.sct{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.scc{font-size:11px;color:var(--tx2);font-weight:600}
.scb{padding:2px 14px}
.mr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px;font-size:12.5px}
.mr:last-child{border-bottom:none}
.mn{flex:1;min-width:0}
.mq{color:var(--tx2);font-size:11px;white-space:nowrap;font-weight:600}
.mp{color:var(--pr2);font-weight:800;white-space:nowrap;font-size:12.5px}
.mr.tot{border-top:2px solid var(--bd);margin-top:4px;padding-top:12px;font-weight:800}
.mr.tot .mn,.mr.tot .mp{color:var(--pr2);font-size:15px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify-content:center}
.md.on{display:flex}
.mbox{background:var(--sf);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mt{font-size:18px;font-weight:800}
.mx{width:36px;height:36px;border-radius:50%;background:var(--sf2);border:none;color:var(--tx);font-size:18px;cursor:pointer}
.tst{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:#10B981;color:#fff}
@media print{.hdr,.prog,.btns,.md,.tst{display:none!important}body{background:#fff;color:#000;padding:0}}
</style>

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nf(n){var v=Number(n)||0;return Number.isInteger(v)?v.toString():v.toFixed(2).replace(/\.?0+$/,'');}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2200);}
function closeMd(){document.getElementById('md').classList.remove('on');}
function openMd(){document.getElementById('md').classList.add('on');}
function toggleTheme(){var c=document.body.dataset.t;var n=c==='dark'?'light':'dark';document.body.dataset.t=n;localStorage.setItem('rayis_calc_theme',n);document.getElementById('thBtn').textContent=n==='dark'?'☀️':'🌙';}
function saveL(){try{localStorage.setItem('rayis_calc_v10',JSON.stringify({d:S.d,activeSections:S.activeSections}));}catch(e){}}
function loadL(){try{var s=localStorage.getItem('rayis_calc_v10');if(s){var p=JSON.parse(s);if(p.d)S.d=Object.assign(S.d,p.d);if(p.activeSections)S.activeSections=p.activeSections;}}catch(e){}}

/* ═══ AUTO HISOBLASH ═══ */
function calcTotalArea(){return S.d.area*S.d.floors;}
function calcPerim(){return Math.round(4*Math.sqrt(S.d.area));}
function calcRoofArea(){return S.d.area*(S.d.roofType==='hip'?1.6:1.4)*S.d.floors;}
function autoFromArea(){
var A=S.d.area;
if(!S.d.strapila_soni)S.d.strapila_soni=Math.ceil(A*0.4);
if(!S.d.reka_soni)S.d.reka_soni=Math.ceil(A*0.75);
if(!S.d.boyra_m2)S.d.boyra_m2=A;
if(!S.d.qamish_bog)S.d.qamish_bog=Math.ceil(A/4);
if(!S.d.somon_pres)S.d.somon_pres=Math.ceil(A/9);
if(!S.d.tuproq_m3)S.d.tuproq_m3=Math.round(A/20*10)/10;
if(!S.d.mourlat_pm)S.d.mourlat_pm=calcPerim();
if(!S.d.strapila_tom)S.d.strapila_tom=Math.ceil(A*0.3);
if(!S.d.reka_tom_pm)S.d.reka_tom_pm=Math.round(A*5.2);
if(!S.d.tornov_pm)S.d.tornov_pm=calcPerim();
}
function autoFromRooms(){
var r=S.d.rooms;
if(!S.d.eshikIQ)S.d.eshikIQ=r;
if(!S.d.rozetkaQ)S.d.rozetkaQ=r*4;
if(!S.d.viklQ)S.d.viklQ=r*2;
if(!S.d.chiroqQ)S.d.chiroqQ=r*2;
if(!S.d.radiatorQ)S.d.radiatorQ=Math.max(4,Math.round(calcTotalArea()/12));
if(!S.d.pechkaQ)S.d.pechkaQ=Math.max(1,Math.ceil(r/3));
}
function autoFromPerim(){if(!S.d.pPerim)S.d.pPerim=calcPerim();}

function bindZeroClear(){
var inputs=document.querySelectorAll('input[type="number"]');
for(var i=0;i<inputs.length;i++){
var inp=inputs[i];
if(inp.dataset.zc)continue;
inp.dataset.zc='1';
inp.addEventListener('focus',function(){
if(this.value==='0'||this.value==='0.0'||this.value==='0.00')this.value='';
var self=this;setTimeout(function(){try{self.select();}catch(e){}},20);
});
inp.addEventListener('blur',function(){
if(this.value===''||this.value==='-'||this.value==='.')this.value='0';
});
}
}/* ═══ RENDER ═══ */
function render(){
var c=document.getElementById('content');
if(S.stage===0)c.innerHTML=vSelect();
else if(S.stage===2)c.innerHTML=vResult();
else c.innerHTML=vStep();
renderProg();
setTimeout(bindZeroClear,50);
}
function getSelectedSections(){return SECTIONS.filter(function(s){return S.activeSections[s.id];});}
function renderProg(){
var w=document.getElementById('progWrap');
if(S.stage===0){w.innerHTML='<div class="pi"><span>Boshlash</span><span>Bo\'limlarni tanlang</span></div><div class="pb"><div class="pbs a" style="flex:1"></div></div>';return;}
if(S.stage===2){w.innerHTML='<div class="pi"><span>Natija</span><span>✓</span></div><div class="pb"><div class="pbs d" style="flex:1"></div></div>';return;}
var sel=getSelectedSections();var cur=S.step+1;var pct=cur/sel.length*100;var s=sel[S.step];
w.innerHTML='<div class="pi"><span>'+s.stage+'</span><span><span class="c">'+cur+'</span> / '+sel.length+'</span></div><div class="pb"><div class="pbs d" style="width:'+pct+'%"></div></div>';
}

/* ═══ STAGE 0 — TANLOV ═══ */
function vSelect(){
if(Object.keys(S.activeSections).length===0){SECTIONS.forEach(function(s){S.activeSections[s.id]=true;});}
var h='<div class="sh"><span class="sn">BOSHLASH</span><div class="st">Qaysi bo\'limlar kerak?</div><div class="sd">Kerak bo\'lmaganini o\'chirib tashlang</div></div>';
var stages={};
SECTIONS.forEach(function(s){if(!stages[s.stage])stages[s.stage]=[];stages[s.stage].push(s);});
Object.keys(stages).forEach(function(st){
h+='<div class="card"><div style="font-weight:800;font-size:13px;margin-bottom:10px;color:var(--pr2)">'+st+'</div><div class="r2" style="gap:6px">';
stages[st].forEach(function(sec){
var on=S.activeSections[sec.id]?'on':'';
h+='<div class="opt '+on+'" onclick="toggleSel(\''+sec.id+'\')" style="padding:10px 8px"><div class="oi" style="font-size:20px">'+sec.ic+'</div><div class="ot" style="font-size:11.5px">'+sec.n+'</div></div>';
});
h+='</div></div>';
});
var cnt=Object.keys(S.activeSections).filter(function(k){return S.activeSections[k];}).length;
h+='<div class="info">✅ <b>'+cnt+'</b> ta bo\'lim tanlangan</div>';
h+='<div class="btns one" style="margin-top:12px"><button class="btn bp" onclick="startCalc()">▶ BOSHLASH</button></div>';
return h;
}
function toggleSel(id){
if(id==="loyiha"){toast("Loyiha majburiy",'e');return;}
S.activeSections[id]=!S.activeSections[id];saveL();render();
}
function startCalc(){
autoFromArea();autoFromRooms();autoFromPerim();
var sel=getSelectedSections();
if(sel.length===0){toast("Bo'lim tanlanmagan",'e');return;}
S.stage=1;S.step=0;render();
}

/* ═══ STAGE 1 — WIZARD ═══ */
function vStep(){
var sel=getSelectedSections();var sec=sel[S.step];
if(!sec)return '<div class="info">Topilmadi</div>';
var h='<div class="sh"><span class="sn">'+sec.ic+' QADAM '+(S.step+1)+'</span><div class="st">'+sec.n+'</div><div class="sd">'+sec.desc+'</div></div>';
h+='<div class="card">'+renderFields(sec.id)+'</div>';
h+='<div class="btns" style="margin-top:14px">';
if(S.step>0)h+='<button class="btn bg" onclick="prevStep()">← Orqaga</button>';
else h+='<button class="btn bg" onclick="backToSelect()">← Tanlov</button>';
if(S.step<sel.length-1)h+='<button class="btn bp" onclick="nextStep()">Keyingi →</button>';
else h+='<button class="btn bp" onclick="calculate()">🧮 HISOBLASH</button>';
h+='</div>';
h+='<div style="text-align:center;font-size:11px;color:var(--tx3);margin-top:14px">Bo\'lim '+(S.step+1)+' / '+sel.length+'</div>';
return h;
}
function nextStep(){collect();var sel=getSelectedSections();if(S.step<sel.length-1){S.step++;saveL();render();window.scrollTo({top:0,behavior:'smooth'});}else calculate();}
function prevStep(){collect();if(S.step>0){S.step--;saveL();render();window.scrollTo({top:0,behavior:'smooth'});}}
function backToSelect(){collect();S.stage=0;render();}

function copyShare(){
var s=buildText();

} else {
var ta=document.createElement('textarea');
ta.value=s;
document.body.appendChild(ta);
ta.select();
try{document.execCommand('copy');toast('✅ Nusxalandi','o');}catch(e){toast('Xato','e');}
document.body.removeChild(ta);
}
}

/* ═══ FIREBASE / SAVAT ═══ */
async function addAll(){
if(!S.res)return;
try{
var ref=DB.ref('rayis-bozori-v1');
var snap=await ref.once('value');
var d=snap.val()||{};
var products=Array.isArray(d.rayis_products_v7)?d.rayis_products_v7.slice():[];
var cart=Array.isArray(d.rayis_cart_v7)?d.rayis_cart_v7.slice():[];
var added=0;
S.res.mats.forEach(function(m){
var pid='calc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
products.push({id:pid,sellerId:'s1',cat:'qurilish',n:m.n,price:m.sumA/Math.max(1,m.qty),unit:m.u,stock:9999,e:'📦',fromCalc:true,createdAt:new Date().toISOString()});
cart.push({cartKey:pid+'__',id:pid,qty:Math.ceil(m.qty)||1});
added++;
});
await ref.update({rayis_products_v7:products,rayis_cart_v7:cart});
toast('✅ '+added+' ta material savatga','o');
}catch(e){console.error(e);toast('Xato: '+e.message,'e');}
}

function exportCSV(){
if(!S.res)return;
var rows=[['Guruh','Nomi','Miqdor','Birlik','Summa']];
S.res.mats.forEach(function(m){rows.push([m.group,m.n,nf(m.qty),m.u,Math.round(m.sumA)]);});
rows.push([]);
S.res.labors.forEach(function(l){rows.push(['Ish',l.n,nf(l.qty),l.u,Math.round(l.sumA)]);});
rows.push([]);
rows.push(['','MATERIAL','','',Math.round(S.res.matA)]);
rows.push(['','ISHLAR','','',Math.round(S.res.labA)]);
rows.push(['','JAMI','','',Math.round(S.res.totA)]);
var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');a.href=url;a.download='rayis-calc-'+Date.now()+'.csv';a.click();
URL.revokeObjectURL(url);
toast('📊 Excel yuklandi','o');
}
