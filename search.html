<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYIS BOZORI — Qidiruv</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; }
  body { background:#0b0f1a; color:#fff; min-height:100vh; padding-bottom:80px; }

  .header { background:#0f1626; border-bottom:1px solid rgba(255,255,255,0.06); padding:12px 16px; position:sticky; top:0; z-index:100; }
  .htop { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .back { font-size:22px; cursor:pointer; color:#8b9ab8; }
  .title { font-size:16px; font-weight:800; flex:1; }
  .cart-btn { position:relative; width:38px; height:38px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; color:#fff; }
  .cart-btn .dot { position:absolute; top:-4px; right:-4px; background:#ff3b30; color:#fff; font-size:9px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  .search-row { display:flex; align-items:center; gap:10px; background:#0f1626; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:12px 14px; }
  .search-row input { flex:1; background:none; border:none; color:#fff; font-size:14px; outline:none; font-family:inherit; }
  .search-row input::placeholder { color:#5b6b8a; }
  .search-row .clr { color:#8b9ab8; font-size:14px; cursor:pointer; padding:4px; }

  .chips { display:flex; gap:6px; padding:12px 16px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:8px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:20px; color:#94a3b8; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chip.active { background:rgba(0,91,255,0.15); border-color:#005bff; color:#60a5fa; font-weight:800; }

  .toolbar { display:flex; justify-content:space-between; align-items:center; padding:6px 16px 12px; }
  .count { font-size:12px; color:#8b9ab8; font-weight:600; }
  .sort-btn { padding:8px 14px; background:#131a2b; border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:#cbd5e1; font-size:12px; font-weight:700; cursor:pointer; }
  .sort-btn.active { border-color:#005bff; color:#60a5fa; }

  .products { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px; }
  .prod { background:#131a2b; border:1px solid rgba(255,255,255,0.06); border-radius:14px; overflow:hidden; cursor:pointer; transition:all 0.15s; }
  .prod:active { transform:scale(0.98); }
  .prod-img { height:130px; background:linear-gradient(135deg,#1a2337,#0f1626); display:flex; align-items:center; justify-content:center; font-size:48px; position:relative; overflow:hidden; }
  .prod-img img { width:100%; height:100%; object-fit:cover; }
  .prod-img .heart { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.5); color:#fff; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; }
  .prod-img .heart.on { color:#ff3b6b; }
  .prod-info { padding:10px; }
  .prod-name { font-size:13px; font-weight:700; margin-bottom:5px; line-height:1.3; min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .prod-rating { display:flex; align-items:center; gap:4px; margin-bottom:6px; font-size:11px; }
  .prod-rating .stars { color:#fbbf24; letter-spacing:0.5px; }
  .prod-rating .num { color:#fbbf24; font-weight:800; }
  .prod-rating .cnt { color:#8b9ab8; }
  .prod-rating .none { color:#5b6b8a; }
  .prod-price-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .prod-price { font-size:14px; font-weight:900; color:#34d399; }
  .prod-old { font-size:11px; color:#5b6b8a; text-decoration:line-through; }
  .prod-add { width:100%; padding:9px; background:linear-gradient(135deg,#005bff,#0047cc); border:none; border-radius:10px; color:#fff; font-size:12px; font-weight:800; cursor:pointer; }
  .prod-add:active { transform:scale(0.97); }

  .empty { padding:60px 20px; text-align:center; color:#5b6b8a; }
  .empty .ic { font-size:60px; margin-bottom:14px; opacity:0.5; }
  .empty h3 { font-size:16px; color:#cbd5e1; margin-bottom:8px; font-weight:700; }
  .empty p { font-size:13px; line-height:1.6; }

  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:#005bff; color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:9999; transition:transform 0.3s; max-width:90%; text-align:center; box-shadow:0 10px 30px rgba(0,91,255,0.4); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.ok { background:#10b981; }
  .toast.err { background:#ef4444; }

  .nav { position:fixed; bottom:0; left:0; right:0; background:#0f1626; border-top:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-around; padding:10px 0 max(10px,env(safe-area-inset-bottom)); z-index:200; }
  .nav-i { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#5b6b8a; cursor:pointer; flex:1; padding:4px; position:relative; }
  .nav-i.active { color:#60a5fa; }
  .nav-i .ic { font-size:20px; }
  .nav-i .nc { position:absolute; top:0; right:25%; background:#ff3b30; color:#fff; font-size:9px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="htop">
    <div class="back" onclick="location.href='home.html'">←</div>
    <div class="title">Qidiruv</div>
    <div class="cart-btn" onclick="location.href='cart.html'">
      🛒<span class="dot" id="cartDot" style="display:none">0</span>
    </div>
  </div>
  <div class="search-row">
    <span>🔍</span>
    <input type="text" id="q" placeholder="Mahsulot nomi..." autocomplete="off">
    <span class="clr" id="clr" style="display:none" onclick="clearSearch()">✕</span>
  </div>
</div>

<div class="chips" id="chips">
  <div class="chip active" data-c="all" onclick="setCat('all')">Barchasi</div>
  <div class="chip" data-c="oziq-ovqat" onclick="setCat('oziq-ovqat')">🍎 Oziq-ovqat</div>
  <div class="chip" data-c="kiyim" onclick="setCat('kiyim')">👕 Kiyim</div>
  <div class="chip" data-c="elektronika" onclick="setCat('elektronika')">📱 Elektronika</div>
  <div class="chip" data-c="qurilish" onclick="setCat('qurilish')">🏗 Qurilish</div>
  <div class="chip" data-c="xizmatlar" onclick="setCat('xizmatlar')">🔧 Xizmatlar</div>
</div>

<div class="toolbar">
  <div class="count" id="count">0 ta natija</div>
  <button class="sort-btn" id="sortBtn" onclick="toggleSort()">💰 Arzon → Qimmat</button>
</div>

<div id="list"></div>

<div class="nav">
  <div class="nav-i" onclick="location.href='home.html'"><div class="ic">🏠</div><div>Bosh</div></div>
  <div class="nav-i active"><div class="ic">🔍</div><div>Qidiruv</div></div>
  <div class="nav-i" onclick="location.href='cart.html'">
    <div class="ic">🛒</div><div>Savat</div>
    <div class="nc" id="navCartCnt" style="display:none">0</div>
  </div>
  <div class="nav-i" onclick="location.href='orders.html'"><div class="ic">📦</div><div>Buyurtma</div></div>
  <div class="nav-i" onclick="location.href='profile.html'"><div class="ic">👤</div><div>Profil</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
let state = { q: '', cat: 'all', sortAsc: true };

const params = new URLSearchParams(location.search);
const catParam = params.get('cat');
if (catParam) state.cat = catParam;

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function fmt(p) { return (Number(p)||0).toLocaleString('uz-UZ').replace(/,/g,' ') + " so'm"; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============================================
// REYTING
// ============================================
function getRatingInfo(productId) {
  let reviews = [];
  try { reviews = JSON.parse(localStorage.getItem('rayis_reviews') || '[]'); } catch(e) {}
  if (!Array.isArray(reviews)) return { avg: 0, count: 0 };
  const filtered = reviews.filter(r => r && String(r.productId) === String(productId));
  if (filtered.length === 0) return { avg: 0, count: 0 };
  const sum = filtered.reduce((s, r) => s + (Number(r.rating) || 0), 0);
  return { avg: Math.round((sum / filtered.length) * 10) / 10, count: filtered.length };
}

function ratingHtml(productId) {
  const r = getRatingInfo(productId);
  if (r.count === 0) {
    return '<div class="prod-rating"><span class="none">☆☆☆☆☆ Sharh yo\'q</span></div>';
  }
  const starsFull = '⭐'.repeat(Math.round(r.avg)) + '☆'.repeat(5 - Math.round(r.avg));
  return '<div class="prod-rating">' +
    '<span class="stars">' + starsFull + '</span>' +
    '<span class="num">' + r.avg.toFixed(1) + '</span>' +
    '<span class="cnt">(' + r.count + ')</span>' +
  '</div>';
}

const qIn = document.getElementById('q');
const clrBtn = document.getElementById('clr');

qIn.addEventListener('input', () => {
  state.q = qIn.value.toLowerCase().trim();
  clrBtn.style.display = state.q ? 'block' : 'none';
  render();
});

function clearSearch() {
  qIn.value = '';
  state.q = '';
  clrBtn.style.display = 'none';
  render();
}

function setCat(c) {
  state.cat = c;
  document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('active', ch.dataset.c === c));
  render();
}

document.querySelectorAll('.chip').forEach(ch => {
  if (ch.dataset.c === state.cat) ch.classList.add('active');
  else ch.classList.remove('active');
});

function toggleSort() {
  state.sortAsc = !state.sortAsc;
  const btn = document.getElementById('sortBtn');
  btn.textContent = state.sortAsc ? '💰 Arzon → Qimmat' : '💰 Qimmat → Arzon';
  btn.classList.toggle('active', !state.sortAsc);
  render();
}

function render() {
  const wrap = document.getElementById('list');
  let products = [];
  try { products = JSON.parse(localStorage.getItem('rayis_products') || '[]'); } catch(e) {}
  if (!Array.isArray(products)) products = [];

  let filtered = products.filter(p => p && p.name && p.price > 0);
  if (state.cat !== 'all') filtered = filtered.filter(p => p.category === state.cat);
  if (state.q) {
    filtered = filtered.filter(p =>
      (p.name || '').toLowerCase().includes(state.q) ||
      (p.description || '').toLowerCase().includes(state.q)
    );
  }
  filtered.sort((a, b) => state.sortAsc ? a.price - b.price : b.price - a.price);

  document.getElementById('count').textContent = filtered.length + ' ta natija';

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty"><div class="ic">🔍</div><h3>Hech narsa topilmadi</h3><p>Boshqa so\'z bilan qidirib ko\'ring<br>yoki kategoriyani o\'zgartiring</p></div>';
    return;
  }

  let favs = [];
  try { favs = JSON.parse(localStorage.getItem('rayis_favs') || '[]'); } catch(e) {}
  if (!Array.isArray(favs)) favs = [];

  let html = '<div class="products">';
  filtered.forEach(p => {
    const img = (p.images && p.images[0]) ? '<img src="' + p.images[0] + '">' : (p.emoji || '📦');
    const oldPrice = (p.oldPrice && p.oldPrice > p.price) ? '<span class="prod-old">' + fmt(p.oldPrice) + '</span>' : '';
    const isFav = favs.indexOf(p.id) !== -1;

    html += '<div class="prod">' +
      '<div class="prod-img" onclick="openProduct(' + p.id + ')">' + img +
        '<div class="heart ' + (isFav ? 'on' : '') + '" onclick="event.stopPropagation();toggleFav(' + p.id + ',this)">' + (isFav ? '❤️' : '🤍') + '</div>' +
      '</div>' +
      '<div class="prod-info">' +
        '<div class="prod-name">' + esc(p.name) + '</div>' +
        ratingHtml(p.id) +
        '<div class="prod-price-row"><span class="prod-price">' + fmt(p.price) + '</span>' + oldPrice + '</div>' +
        '<button class="prod-add" onclick="event.stopPropagation();addToCart(' + p.id + ')">🛒 Savatga</button>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;

  updateBadges();
}

function openProduct(id) {
  location.href = 'product.html?id=' + id;
}

function addToCart(id) {
  const all = JSON.parse(localStorage.getItem('rayis_products') || '[]');
  const p = all.find(x => String(x.id) === String(id));
  if (!p) return toast('Topilmadi', 'err');

  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('rayis_cart') || '[]'); } catch(e) {}
  if (!Array.isArray(cart)) cart = [];

  const ex = cart.find(i => String(i.id) === String(id));
  if (ex) { ex.qty = (ex.qty || 1) + 1; }
  else {
    cart.push({
      id: p.id, name: p.name, price: p.price,
      unit: p.unit || 'dona', emoji: p.emoji || '📦',
      images: p.images || [], category: p.category, qty: 1
    });
  }
  try { localStorage.setItem('rayis_cart', JSON.stringify(cart)); } catch(e) {
    return toast('Xotira to\'ldi', 'err');
  }
  updateBadges();
  toast('✅ Savatga qo\'shildi', 'ok');
}

function toggleFav(id, el) {
  let favs = [];
  try { favs = JSON.parse(localStorage.getItem('rayis_favs') || '[]'); } catch(e) {}
  if (!Array.isArray(favs)) favs = [];

  const idx = favs.indexOf(id);
  if (idx === -1) {
    favs.push(id);
    el.textContent = '❤️';
    el.classList.add('on');
    toast('❤️ Sevimlilarga qo\'shildi', 'ok');
  } else {
    favs.splice(idx, 1);
    el.textContent = '🤍';
    el.classList.remove('on');
    toast('Sevimlilardan olindi');
  }
  try { localStorage.setItem('rayis_favs', JSON.stringify(favs)); } catch(e) {}
}

function updateBadges() {
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('rayis_cart') || '[]'); } catch(e) {}
  if (!Array.isArray(cart)) cart = [];
  const cnt = cart.reduce((s, i) => s + (i.qty || 0), 0);

  const cartDot = document.getElementById('cartDot');
  const navCnt = document.getElementById('navCartCnt');

  if (cnt > 0) {
    cartDot.textContent = cnt; cartDot.style.display = 'flex';
    navCnt.textContent = cnt; navCnt.style.display = 'flex';
  } else {
    cartDot.style.display = 'none';
    navCnt.style.display = 'none';
  }
}

render();
</script>
</body>
</html>
