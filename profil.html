<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#22C55E">
<title>Profil — RAYIS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2322C55E'/><path d='M50 22 L68 38 L32 38 Z' fill='%230B1119'/><text x='50' y='75' font-size='52' font-weight='900' fill='%230B1119' text-anchor='middle' font-family='Arial'>R</text></svg>">
<style>
:root{
  --bg:#F5F7FA;--sf:#FFFFFF;--sf2:#F1F5F9;--sf3:#E8EEF5;--bd:#E2E8F0;
  --tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --pr:#22C55E;--pr2:#16A34A;--prD:#15803D;--prL:#DCFCE7;
  --or:#F59E0B;--er:#EF4444;--ac:#3B82F6;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 16px rgba(0,0,0,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-t="dark"]{
  --bg:#0B1119;--sf:#151C26;--sf2:#1E2733;--sf3:#252F3D;--bd:#2A3441;
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;
  --prL:#064E3B;
  --sh:0 1px 3px rgba(0,0,0,.3);
  --sh2:0 4px 16px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;
  min-height:100vh;
  padding-bottom:calc(78px + var(--safe-b));
  overscroll-behavior-y:none;
  -webkit-overflow-scrolling:touch;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px}
.app{max-width:640px;margin:0 auto}

.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--sf);border-bottom:1px solid var(--bd);
  padding:calc(8px + var(--safe-t)) 8px 8px;
  display:flex;align-items:center;gap:8px;
}
.hdr-btn{
  width:42px;height:42px;flex-shrink:0;
  border-radius:12px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--tx);
  border:1px solid var(--bd);
}
.hdr-btn:active{transform:scale(.9)}
.hdr-title{flex:1;min-width:0;padding:0 4px}
.hdr-title b{font-size:16px;font-weight:800;display:block}
.hdr-title span{font-size:11px;color:var(--tx2)}

.hero{
  background:linear-gradient(135deg,var(--pr) 0%,var(--prD) 100%);
  padding:24px 20px;
  color:#fff;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.hero::after{
  content:'';position:absolute;bottom:-60px;left:30%;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero-av{
  width:72px;height:72px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;flex-shrink:0;
  border:3px solid rgba(255,255,255,.3);
  backdrop-filter:blur(10px);
}
.hero-inf{flex:1;min-width:0}
.hero-n{
  font-size:19px;font-weight:900;
  display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;
}
.hero-verif{
  background:rgba(255,255,255,.25);
  padding:3px 8px;border-radius:6px;
  font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;gap:3px;
}
.hero-p{font-size:13px;opacity:.95;margin-top:4px}
.hero-id{font-size:11px;opacity:.8;margin-top:4px;font-family:monospace}
.hero-edit{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);
  padding:8px 14px;border-radius:10px;
  color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;gap:5px;
  flex-shrink:0;
}
.hero-edit:active{transform:scale(.95);background:rgba(255,255,255,.3)}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;
  background:var(--sf);
  margin:0;
  border-bottom:1px solid var(--bd);
  position:relative;z-index:2;
}
.stat{
  padding:14px 8px;
  text-align:center;
  border-right:1px solid var(--bd);
  cursor:pointer;
  transition:.15s;
}
.stat:last-child{border-right:none}
.stat:active{background:var(--sf2)}
.stat-n{font-size:18px;font-weight:900;color:var(--tx);line-height:1}
.stat-l{font-size:10.5px;color:var(--tx2);margin-top:4px;font-weight:600}
.stat.on .stat-n{color:var(--pr)}

.tabs{
  display:flex;
  background:var(--sf);
  border-bottom:1px solid var(--bd);
  position:sticky;top:calc(58px + var(--safe-t));z-index:40;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:96px;
  padding:14px 10px;
  font-size:12.5px;font-weight:700;
  color:var(--tx2);
  border-bottom:2.5px solid transparent;
  white-space:nowrap;
  position:relative;
}
.tab.on{color:var(--pr);border-bottom-color:var(--pr)}

.sec{padding:14px 12px}
.sec-h{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.sec-h h3{font-size:15px;font-weight:900}
.sec-h .more{
  font-size:12px;color:var(--pr);font-weight:700;
  text-decoration:none;
}

.card{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:16px;padding:14px;
  margin-bottom:10px;
}

.order{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:16px;padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.15s;
}
.order:active{transform:scale(.99)}
.order-h{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.order-n{
  font-size:13px;font-weight:900;
  font-family:monospace;letter-spacing:.5px;
}
.order-status{
  font-size:10.5px;font-weight:800;
  padding:4px 10px;border-radius:100px;
  display:flex;align-items:center;gap:4px;
}
.status-new{background:#DBEAFE;color:#1E40AF}
.status-paid{background:#FEF3C7;color:#92400E}
.status-shipped{background:#E0E7FF;color:#4338CA}
.status-delivered{background:#DCFCE7;color:#166534}
.status-cancelled{background:#FEE2E2;color:#991B1B}
[data-t="dark"] .status-new{background:#1E3A8A;color:#DBEAFE}
[data-t="dark"] .status-paid{background:#78350F;color:#FEF3C7}
[data-t="dark"] .status-shipped{background:#312E81;color:#E0E7FF}
[data-t="dark"] .status-delivered{background:#064E3B;color:#DCFCE7}
[data-t="dark"] .status-cancelled{background:#7F1D1D;color:#FEE2E2}

.order-items{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.order-item{
  width:48px;height:48px;border-radius:10px;
  background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  position:relative;
}
.order-item-more{
  position:absolute;inset:0;
  background:rgba(0,0,0,.55);color:#fff;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;
  backdrop-filter:blur(2px);
}
.order-info{
  display:flex;justify-content:space-between;
  font-size:12px;color:var(--tx2);
  padding-top:10px;border-top:1px solid var(--bd);
  margin-bottom:10px;
}
.order-info b{color:var(--tx);font-weight:800}
.order-info .price{color:var(--pr);font-weight:900;font-size:14px}
.order-actions{display:flex;gap:8px}
.order-btn{
  flex:1;padding:10px;
  border-radius:10px;
  background:var(--sf2);
  border:1.5px solid var(--bd);
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.order-btn:active{transform:scale(.97)}
.order-btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.order-btn.r{color:var(--er);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}

.timeline{
  position:relative;
  padding-left:32px;
}
.timeline::before{
  content:'';position:absolute;
  left:11px;top:8px;bottom:8px;
  width:2px;background:var(--bd);
}
.tl-item{
  position:relative;
  padding-bottom:18px;
}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:'';position:absolute;
  left:-32px;top:3px;
  width:24px;height:24px;border-radius:50%;
  background:var(--sf2);border:2px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
}
.tl-item.done::before{background:var(--pr);border-color:var(--pr);content:'✓';color:#fff;font-size:12px;font-weight:900;text-align:center;line-height:20px}
.tl-item.active::before{background:var(--pr);border-color:var(--pr);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.tl-t{font-size:13px;font-weight:800;margin-bottom:3px}
.tl-t.muted{color:var(--tx2);font-weight:600}
.tl-s{font-size:11px;color:var(--tx3)}
.tl-date{font-size:10.5px;color:var(--tx3);margin-top:2px;font-family:monospace}

.addr-card{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:14px;padding:14px;
  margin-bottom:10px;
  display:flex;gap:12px;
  position:relative;
}
.addr-card.default{border-color:var(--pr);border-width:2px}
.addr-ic{
  width:42px;height:42px;flex-shrink:0;
  border-radius:12px;background:var(--prL);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
[data-t="dark"] .addr-ic{background:var(--prL)}
.addr-body{flex:1;min-width:0}
.addr-t{font-size:13.5px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.addr-default{
  font-size:9.5px;background:var(--pr);color:#fff;
  padding:2px 6px;border-radius:5px;font-weight:800;
}
.addr-s{font-size:12px;color:var(--tx2);line-height:1.5;word-break:break-word}
.addr-acts{
  display:flex;gap:6px;
  margin-top:10px;
}
.addr-act{
  padding:6px 12px;border-radius:8px;
  background:var(--sf2);border:1px solid var(--bd);
  font-size:11.5px;font-weight:700;
}
.addr-act:active{transform:scale(.95)}
.addr-act.danger{color:var(--er)}

.fav-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;
}
.fav-card{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
}
.fav-img{
  aspect-ratio:1;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:48px;
  position:relative;
}
.fav-rm{
  position:absolute;top:6px;right:6px;
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--er);
}
.fav-body{padding:10px;display:flex;flex-direction:column;flex:1}
.fav-p{font-size:14px;font-weight:900;margin-bottom:3px}
.fav-old{font-size:10.5px;color:var(--tx3);text-decoration:line-through;margin-bottom:5px}
.fav-n{
  font-size:12px;line-height:1.3;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:8px;
}
.fav-add{
  width:100%;padding:9px;border-radius:9px;
  background:var(--pr);color:#fff;
  font-size:11.5px;font-weight:800;
}
.fav-add.on{background:var(--sf2);color:var(--pr);border:1.5px solid var(--pr)}

.settings{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:16px;overflow:hidden;
  margin-bottom:10px;
}
.st-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--bd);
  cursor:pointer;
  transition:.15s;
}
.st-item:last-child{border-bottom:none}
.st-item:active{background:var(--sf2)}
.st-ic{
  width:38px;height:38px;flex-shrink:0;
  border-radius:10px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.st-body{flex:1;min-width:0}
.st-t{font-size:13.5px;font-weight:700;margin-bottom:2px}
.st-s{font-size:11.5px;color:var(--tx2)}
.st-arrow{color:var(--tx3);font-size:18px;flex-shrink:0}
.st-toggle{
  width:48px;height:28px;border-radius:100px;
  background:var(--bd);position:relative;
  transition:.2s;flex-shrink:0;
}
.st-toggle.on{background:var(--pr)}
.st-toggle::after{
  content:'';position:absolute;
  width:22px;height:22px;border-radius:50%;
  background:#fff;top:3px;left:3px;
  transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);
}
.st-toggle.on::after{left:23px}

.support{
  background:linear-gradient(135deg,#3B82F6,#1E40AF);
  border-radius:16px;padding:18px;
  color:#fff;margin-bottom:10px;
  position:relative;overflow:hidden;
}
.support::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.support h3{font-size:16px;font-weight:900;margin-bottom:6px;position:relative}
.support p{font-size:12.5px;opacity:.95;line-height:1.5;margin-bottom:14px;position:relative}
.support-btns{display:flex;gap:8px;position:relative}
.support-btn{
  flex:1;padding:11px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);
  border-radius:10px;
  color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.support-btn:active{transform:scale(.95);background:rgba(255,255,255,.3)}

.empty{
  text-align:center;padding:50px 20px;
}
.empty-ic{font-size:64px;margin-bottom:14px}
.empty-t{font-size:16px;font-weight:900;margin-bottom:6px}
.empty-s{font-size:12.5px;color:var(--tx2);margin-bottom:20px;line-height:1.5}
.empty-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:13px 24px;background:var(--pr);color:#fff;
  border-radius:12px;font-size:13px;font-weight:800;
}
.empty-btn:active{transform:scale(.97)}

.md{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .15s;
}
.md.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.md-box{
  background:var(--sf);width:100%;max-width:640px;
  max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + var(--safe-b));
  animation:up .25s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.md-h{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;position:sticky;top:-18px;
  background:var(--sf);padding:8px 0;z-index:1;
}
.md-h h3{font-size:18px;font-weight:900}
.md-x{
  width:38px;height:38px;border-radius:50%;
  background:var(--sf2);font-size:18px;
  display:flex;align-items:center;justify-content:center;
}
.md-x:active{transform:scale(.9)}

.f{margin-bottom:12px}
.fl{
  display:block;font-size:12.5px;font-weight:700;
  color:var(--tx2);margin-bottom:6px;
}
.fl b{color:var(--er)}
.inp,.txa,.sel{
  width:100%;padding:13px 14px;
  background:var(--sf2);border:1.5px solid var(--bd);
  border-radius:12px;color:var(--tx);
  font-size:15px;font-weight:600;outline:none;
  font-family:inherit;
}
.inp:focus,.txa:focus,.sel:focus{border-color:var(--pr)}
.txa{resize:vertical;min-height:80px;line-height:1.5}

.btn-go{
  width:100%;padding:15px;border-radius:12px;
  background:var(--pr);color:#fff;
  font-size:14px;font-weight:900;
  margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:50px;
}
.btn-go:active{transform:scale(.98)}
.btn-go.g{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}

.bonus{
  background:linear-gradient(135deg,#F59E0B,#D97706);
  border-radius:16px;padding:18px;
  color:#fff;margin-bottom:10px;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
.bonus::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.15);
}
.bonus-ic{
  width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;position:relative;
}
.bonus-body{flex:1;position:relative}
.bonus-l{font-size:11.5px;opacity:.9}
.bonus-v{font-size:24px;font-weight:900;margin:2px 0}
.bonus-s{font-size:11px;opacity:.9}

.tst{
  position:fixed;bottom:calc(90px + var(--safe-b));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--tx);color:var(--bg);
  padding:11px 20px;border-radius:100px;
  font-size:13px;font-weight:700;z-index:400;
  opacity:0;transition:.3s;pointer-events:none;
  max-width:90%;text-align:center;
  box-shadow:var(--sh2);
}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.o{background:var(--pr);color:#fff}
.tst.e{background:var(--er);color:#fff}

.logout{
  width:100%;padding:15px;
  border-radius:12px;
  background:rgba(239,68,68,.1);
  color:var(--er);
  font-size:14px;font-weight:800;
  margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.logout:active{transform:scale(.98);background:rgba(239,68,68,.2)}

.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--sf);border-top:1px solid var(--bd);
  display:flex;
  padding:6px 0 calc(6px + var(--safe-b));
  max-width:640px;margin:0 auto;
}
.nv{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:6px 4px;
  color:var(--tx3);font-size:10px;font-weight:600;
  position:relative;min-height:52px;
}
.nv-ic{font-size:20px;line-height:1}
.nv.on{color:var(--pr)}
.nv .badge{
  position:absolute;top:2px;right:calc(50% - 18px);
  min-width:16px;height:16px;padding:0 4px;
  background:var(--er);color:#fff;font-size:9.5px;font-weight:800;
  border-radius:100px;display:flex;align-items:center;justify-content:center;
}
</style>
</head>
<body data-t="light">
<div class="app">

  <div class="hdr">
    <button class="hdr-btn" onclick="goBack()" aria-label="Orqaga">←</button>
    <div class="hdr-title">
      <b>Profil</b>
      <span id="hdrSub">Shaxsiy kabinet</span>
    </div>
    <button class="hdr-btn" onclick="openSettings()" aria-label="Sozlamalar">⚙️</button>
  </div>

  <div class="hero" id="hero"></div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="orders" onclick="setTab('orders')">📦 Buyurtmalar</button>
    <button class="tab" data-tab="fav" onclick="setTab('fav')">❤️ Sevimli</button>

    var c=localStorage.getItem('rayis_cart_'+UID);
    if(c)ST.cart=JSON.parse(c);

    if(a)ST.addresses=JSON.parse(a);
    else if(localStorage.getItem('rayis_addr_'+UID)){

      if(oldAddr&&oldAddr.name)ST.addresses=[Object.assign({id:'a1',default:true},oldAddr)];

    var bh=localStorage.getItem('rayis_bonus_history_'+UID);

    var s=localStorage.getItem('rayis_settings_'+UID);

  }catch(e){console.warn(e);}

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function fmtN(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':' o');},2200);}
function closeMd(){document.getElementById('md').classList.remove('on');}
function openMd(){document.getElementById('md').classList.add('on');}
function fmtDate(ts){
  if(!ts)return '';
  var d=new Date(ts);
  var day=('0'+d.getDate()).slice(-2);
  var m=('0'+(d.getMonth()+1)).slice(-2);
  var y=d.getFullYear();
  var h=('0'+d.getHours()).slice(-2);
  var mi=('0'+d.getMinutes()).slice(-2);
  return day+'.'+m+'.'+y+' '+h+':'+mi;
}

function maskPhone(p){
  if(!p)return '';
  var clean=p.replace(/\D/g,'');
  if(clean.length<7)return p;
  return '+'+clean.slice(0,3)+' '+clean.slice(3,5)+' '+clean.slice(5,8)+' '+clean.slice(8,10)+' '+clean.slice(10,12);
}

function stat(id,v,l){
  return '<div class="stat '+(ST.tab===id?'on':'')+'" onclick="setTab(\''+id+'\')">'+
    '<div class="stat-n">'+v+'</div>'+
    '<div class="stat-l">'+l+'</div>'+
    '</div>';
}

function setTab(t){
  ST.tab=t;
  document.querySelectorAll('.tab').forEach(function(el){
    el.classList.toggle('on',el.getAttribute('data-tab')===t);
  });
  document.querySelectorAll('.stat').forEach(function(el){
    var onclick=el.getAttribute('onclick')||'';
    el.classList.toggle('on',onclick.indexOf("'"+t+"'")>=0);
  });
  renderContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderContent(){
  var c=document.getElementById('content');
  if(ST.tab==='orders')c.innerHTML=renderOrders();
  else if(ST.tab==='fav')c.innerHTML=renderFav();
  else if(ST.tab==='addr')c.innerHTML=renderAddresses();
  else if(ST.tab==='bonus')c.innerHTML=renderBonus();
}

function renderOrders(){
  if(!ST.orders.length){
    return '<div class="empty">'+
      '<div class="empty-ic">📦</div>'+
      '<div class="empty-t">Buyurtmalar yo\'q</div>'+
      '<div class="empty-s">Hozircha buyurtma bermagansiz.<br>Katalogdan mahsulot tanlang.</div>'+
      '<button class="empty-btn" onclick="goCatalog()">🗂 Katalogga</button>'+
      '</div>';
  }
  var h='<div class="sec">';
  ST.orders.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  ST.orders.forEach(function(o){h+=renderOrderCard(o);});
  h+='</div>';
  return h;
}

function renderOrderCard(o){
  var s=STATUS[o.status]||STATUS.new;
  var items=o.items||[];
  var shown=items.slice(0,4);
  var more=items.length-4;
  var h='<div class="order" onclick="openOrderDetail(\''+o.id+'\')">';
  h+='<div class="order-h">';
  h+='<div class="order-n">#'+esc(o.id)+'</div>';
  h+='<div class="order-status '+s.cls+'">'+s.ic+' '+s.n+'</div>';
  h+='</div>';
  h+='<div class="order-items">';
  shown.forEach(function(it){h+='<div class="order-item">'+(it.e||'📦')+'</div>';});
  if(more>0)h+='<div class="order-item"><div class="order-item-more">+'+more+'</div></div>';
  h+='</div>';
  h+='<div class="order-info">';
  h+='<span>📅 '+fmtDate(o.createdAt)+'</span>';
  h+='<span class="price">'+fmt(o.total)+'</span>';
  h+='</div>';
  h+='<div class="order-actions">';
  if(o.status==='new'||o.status==='paid'){
    h+='<button class="order-btn r" onclick="event.stopPropagation();cancelOrder(\''+o.id+'\')">❌ Bekor</button>';
  }
  if(o.status==='delivered'){
    h+='<button class="order-btn" onclick="event.stopPropagation();repeatOrder(\''+o.id+'\')">🔁 Qayta</button>';
  }
  h+='<button class="order-btn p" onclick="event.stopPropagation();openOrderDetail(\''+o.id+'\')">📋 Batafsil</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function openOrderDetail(id){
  var o=ST.orders.find(function(x){return x.id===id;});
  if(!o)return;
  var s=STATUS[o.status]||STATUS.new;
  var h='<div class="md-h"><h3>📦 Buyurtma #'+esc(o.id)+'</h3><button class="md-x" onclick="closeMd()">✕</button></div>';
  h+='<div style="background:var(--sf2);border-radius:14px;padding:14px;margin-bottom:14px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<span style="font-size:12px;color:var(--tx2)">Holat:</span>';
  h+='<span class="order-status '+s.cls+'">'+s.ic+' '+s.n+'</span>';
  h+='</div>';
  h+='<div class="timeline">';
  var hist=o.history||[{status:'new',time:o.createdAt,note:'Buyurtma yaratildi'}];
  var statuses=['new','paid','shipped','delivered'];
  var currentIdx=statuses.indexOf(o.status);
  if(o.status==='cancelled'){

function cancelOrder(id){
  if(!confirm('Buyurtmani bekor qilishni xohlaysizmi?'))return;
  var o=ST.orders.find(function(x){return x.id===id;});
  if(!o)return;
  o.status='cancelled';
  o.cancelledAt=Date.now();
  if(!o.history)o.history=[];
  o.history.push({status:'cancelled',time:Date.now(),note:'Bekor qilindi'});
  localStorage.setItem('rayis_orders_'+UID,JSON.stringify(ST.orders));
  if(DB)DB.ref('orders/'+id).update({status:'cancelled',cancelledAt:o.cancelledAt}).catch(function(){});
  render();
  toast('❌ Buyurtma bekor qilindi','o');
}

function repeatOrder(id){
  var o=ST.orders.find(function(x){return x.id===id;});
  if(!o)return;
  var added=0;
  (o.items||[]).forEach(function(it){
    if(ST.cart[it.id])ST.cart[it.id]+=it.qty;
    else ST.cart[it.id]=it.qty;
    added++;
  });
  saveCart();
  toast('🛒 '+added+' ta mahsulot savatga qo\'shildi','o');
  setTimeout(function(){window.location.href='savat.html';},600);
}

function renderFav(){
  var ids=Object.keys(ST.fav);
  if(!ids.length){
    return '<div class="empty">'+
      '<div class="empty-ic">🤍</div>'+
      '<div class="empty-t">Sevimlilar bo\'sh</div>'+
      '<div class="empty-s">Yoqqan mahsulotlarni saqlab qo\'ying.</div>'+
      '<button class="empty-btn" onclick="goCatalog()">🗂 Katalogga</button>'+
      '</div>';
  }
  var h='<div class="sec"><div class="fav-grid">';
  ids.forEach(function(pid){
    var p=PRODUCTS.find(function(x){return x.id===pid;});
    if(!p)return;
    var disc=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
    var inCart=ST.cart[pid];
    h+='<div class="fav-card">';
    h+='<div class="fav-img" onclick="goProduct(\''+pid+'\')">';
    if(disc>0)h+='<div style="position:absolute;top:6px;left:6px;background:var(--er);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:5px">-'+disc+'%</div>';
    h+=p.e;
    h+='<button class="fav-rm" onclick="event.stopPropagation();removeFav(\''+pid+'\')">✕</button>';
    h+='</div>';
    h+='<div class="fav-body">';
    h+='<div class="fav-p">'+fmt(p.price)+'</div>';
    if(p.old>p.price)h+='<div class="fav-old">'+fmt(p.old)+'</div>';
    h+='<div class="fav-n">'+esc(p.n)+'</div>';
    h+='<button class="fav-add '+(inCart?'on':'')+'" onclick="addCart(\''+pid+'\')">'+(inCart?'✓ Savatda':'🛒 Savatga')+'</button>';
    h+='</div>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;

  var def=document.getElementById('adDefault').checked;
  if(name.length<2)return toast('Ism kiriting','e');
  if(phone.length<7)return toast('Telefon kiriting','e');
  if(address.length<3)return toast('Manzil kiriting','e');
  var a={id:'a'+Date.now(),name:name,phone:phone,address:address,note:note,region:region,default:def};
  if(def||ST.addresses.length===0){
    ST.addresses.forEach(function(x){x.default=false;});
    a.default=true;
  }
  if(idx===null||idx===undefined){ST.addresses.push(a);}
  else {ST.addresses[idx]=a;}
  saveAddresses();
  closeMd();
  render();
  renderContent();
  toast('✅ Manzil saqlandi','o');
}
