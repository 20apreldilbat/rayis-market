function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function fmtN(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');if(!e)return;e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':' o');},2200);}
function closeMd(){document.getElementById('md').classList.remove('on');}
function openMd(){document.getElementById('md').classList.add('on');}
function fmtDate(ts){if(!ts)return '';var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function maskPhone(p){if(!p)return '';var c=p.replace(/\D/g,'');if(c.length<7)return p;return '+'+c.slice(0,3)+' '+c.slice(3,5)+' '+c.slice(5,8)+' '+c.slice(8,10)+' '+c.slice(10,12);}

function stat(id,v,l){return '<div class="stat '+(ST.tab===id?'on':'')+'" onclick="setTab(\''+id+'\')"><div class="stat-n">'+v+'</div><div class="stat-l">'+l+'</div></div>';}

function setTab(t){
  ST.tab=t;
  var tabs=document.querySelectorAll('.tab');for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i].getAttribute('data-tab')===t);
  var stats=document.querySelectorAll('.stat');for(var j=0;j<stats.length;j++){var oc=stats[j].getAttribute('onclick')||'';stats[j].classList.toggle('on',oc.indexOf("'"+t+"'")>=0);}
  renderContent();
}

function renderContent(){
  var c=document.getElementById('content');if(!c)return;
  try{
    if(ST.tab==='orders')c.innerHTML=renderOrders();
    else if(ST.tab==='fav')c.innerHTML=renderFav();
    else if(ST.tab==='addr')c.innerHTML=renderAddresses();
    else if(ST.tab==='bonus')c.innerHTML=renderBonus();
  }catch(e){c.innerHTML='<div style="padding:40px;text-align:center;color:var(--er)">Xato: '+esc(e.message)+'</div>';}
}

function renderOrders(){
  if(!ST.orders.length)return '<div class="empty"><div class="empty-ic">📦</div><div class="empty-t">Buyurtmalar yo\'q</div><div class="empty-s">Hozircha buyurtma bermagansiz.<br>Katalogdan mahsulot tanlang.</div><button class="empty-btn" onclick="goCatalog()">🗂 Katalogga</button></div>';
  var h='<div class="sec">';
  var sorted=ST.orders.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  for(var i=0;i<sorted.length;i++)h+=renderOrderCard(sorted[i]);
  h+='</div>';
  return h;
}
function renderOrderCard(o){
  var s=STATUS[o.status]||STATUS.new;var items=o.items||[];var shown=items.slice(0,4);var more=items.length-4;
  var h='<div class="order" onclick="openOrderDetail(\''+o.id+'\')"><div class="order-h"><div class="order-n">#'+esc(o.id)+'</div><div class="order-status '+s.cls+'">'+s.ic+' '+s.n+'</div></div><div class="order-items">';
  for(var i=0;i<shown.length;i++)h+='<div class="order-item">'+(shown[i].e||'📦')+'</div>';
  if(more>0)h+='<div class="order-item"><div class="order-item-more">+'+more+'</div></div>';
  h+='</div><div class="order-info"><span>📅 '+fmtDate(o.createdAt)+'</span><span class="price">'+fmt(o.total)+'</span></div><div class="order-actions">';
  if(o.status==='new'||o.status==='paid')h+='<button class="order-btn r" onclick="event.stopPropagation();cancelOrder(\''+o.id+'\')">❌ Bekor</button>';
  if(o.status==='delivered')h+='<button class="order-btn" onclick="event.stopPropagation();repeatOrder(\''+o.id+'\')">🔁 Qayta</button>';
  h+='<button class="order-btn p" onclick="event.stopPropagation();openOrderDetail(\''+o.id+'\')">📋 Batafsil</button></div></div>';
  return h;
}

function cancelOrder(id){
  if(!confirm('Bekor qilishni xohlaysizmi?'))return;
  for(var i=0;i<ST.orders.length;i++)if(ST.orders[i].id===id){ST.orders[i].status='cancelled';break;}
  saveOrders();render();toast('❌ Bekor qilindi','o');
}
function repeatOrder(id){
  for(var i=0;i<ST.orders.length;i++)if(ST.orders[i].id===id){
    var items=ST.orders[i].items||[];
    for(var j=0;j<items.length;j++){if(ST.cart[items[j].id])ST.cart[items[j].id]+=items[j].qty;else ST.cart[items[j].id]=items[j].qty;}
    break;
  }
  saveCart();toast('🛒 Savatga qo\'shildi','o');
  setTimeout(function(){window.location.href='savat.html';},600);
}

function renderFav(){
  var ids=Object.keys(ST.fav);
  if(!ids.length)return '<div class="empty"><div class="empty-ic">🤍</div><div class="empty-t">Sevimlilar bo\'sh</div><div class="empty-s">Yoqqan mahsulotlarni saqlang.</div><button class="empty-btn" onclick="goCatalog()">🗂 Katalogga</button></div>';
  var h='<div class="sec"><div class="fav-grid">';
  for(var i=0;i<ids.length;i++){
    var pid=ids[i];var p=null;for(var j=0;j<PRODUCTS.length;j++)if(PRODUCTS[j].id===pid)p=PRODUCTS[j];
    if(!p)continue;
    var disc=p.old>p.price?Math.round((1-p.price/p.old)*100):0;var inCart=ST.cart[pid];
    h+='<div class="fav-card"><div class="fav-img" onclick="goProduct(\''+pid+'\')">';
    if(disc>0)h+='<div style="position:absolute;top:6px;left:6px;background:var(--er);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:5px">-'+disc+'%</div>';

    h+='<div class="fav-n">'+esc(p.n)+'</div><button class="fav-add '+(inCart?'on':'')+'" onclick="addCart(\''+pid+'\')">'+(inCart?'✓ Savatda':'🛒 Savatga')+'</button></div></div>';
  }

  return h;

function saveAddress(idx){
  var name=document.getElementById('adName').value.trim();
  var phone=document.getElementById('adPhone').value.trim();
  var address=document.getElementById('adAddr').value.trim();
  var note=document.getElementById('adNote').value.trim();
  var region=document.getElementById('adRegion').value;
  var def=document.getElementById('adDefault').checked;
  if(name.length<2)return toast('Ism kiriting','e');
  if(phone.length<7)return toast('Telefon kiriting','e');
  if(address.length<3)return toast('Manzil kiriting','e');
  var a={id:'a'+Date.now(),name:name,phone:phone,address:address,note:note,region:region,default:def};
  if(def||ST.addresses.length===0){for(var i=0;i<ST.addresses.length;i++)ST.addresses[i].default=false;a.default=true;}
  if(idx===null||idx===undefined)ST.addresses.push(a);else ST.addresses[idx]=a;
  saveAddresses();closeMd();render();toast('✅ Saqlandi','o');
}
function setDefaultAddress(idx){for(var i=0;i<ST.addresses.length;i++)ST.addresses[i].default=(i===idx);saveAddresses();renderContent();toast('⭐ O\'zgartirildi','o');}
function deleteAddress(idx){if(!confirm('O\'chirish?'))return;ST.addresses.splice(idx,1);saveAddresses();render();toast('🗑 O\'chirildi','o');}

  ST.settings[key]=!ST.settings[key];saveSettings();
